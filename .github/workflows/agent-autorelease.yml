# Provider Agent 자동 버전 증가 + 릴리스 트리거.
# main 에 provider-agent 코드가 바뀌면 컨벤셔널 커밋으로 다음 SemVer 를 계산해 버전 파일을
# 갱신·커밋([skip ci])하고 agent-v<버전> 태그를 push → agent-build 가 빌드/릴리스/패키지매니저
# 갱신까지 자동 수행. (수동 버전 bump·태그 불필요)
name: agent-autorelease

on:
  push:
    branches: [main]
    paths:
      - "provider-agent/src/**"
      - "provider-agent/pyproject.toml"
  workflow_dispatch:
    inputs:
      bump:
        description: "강제 bump 종류(major/minor/patch). 비우면 커밋으로 자동 판단."
        required: false

permissions:
  contents: write
  actions: write # agent-build 를 workflow_dispatch 로 트리거하기 위함

concurrency: agent-autorelease

jobs:
  tag:
    # [skip ci] 커밋(자기 자신의 bump 커밋)·릴리스 커밋에는 돌지 않는다(무한 루프 방지).
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, 'release agent-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 다음 버전 계산 + 버전 파일 갱신 + 태그 push
        env:
          FORCE_BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          LAST=$(git tag -l 'agent-v*' --sort=-v:refname | head -1 || true)
          LAST=${LAST:-agent-v0.0.0}
          TAGVER=${LAST#agent-v}

          # 기준 버전 = 마지막 태그와 현재 파일 버전 중 **높은 쪽**.
          # (파일이 태그보다 앞서 수동 bump 돼 있어도 새 버전이 항상 전진 → "nothing to commit" 방지.)
          FILEVER=$(sed -nE 's/^version = "(.*)"/\1/p' provider-agent/pyproject.toml | head -1)
          FILEVER=${FILEVER:-0.0.0}
          BASE=$(printf '%s\n%s\n' "$TAGVER" "$FILEVER" | sort -V | tail -1)
          IFS=. read -r MA MI PA <<< "$BASE"

          # bump 종류 결정: 입력값 > 커밋 컨벤션(feat→minor, BREAKING/!→major, 그 외→patch).
          if [ -n "${FORCE_BUMP:-}" ]; then
            BUMP="$FORCE_BUMP"
          else
            RANGE="${LAST}..HEAD"
            git rev-parse "$LAST" >/dev/null 2>&1 || RANGE="HEAD"
            LOG=$(git log --format='%s%n%b' "$RANGE" -- provider-agent || true)
            # here-string 으로 grep — echo|grep 은 grep -q 가 파이프를 일찍 닫아 echo 가 SIGPIPE,
            # set -o pipefail 과 만나 스텝이 broken pipe 로 죽는다(원인 #1).
            if grep -qiE 'BREAKING CHANGE|^[a-z]+(\([^)]*\))?!:' <<<"$LOG"; then
              BUMP=major
            elif grep -qiE '^feat(\([^)]*\))?:' <<<"$LOG"; then
              BUMP=minor
            else
              BUMP=patch
            fi
          fi
          case "$BUMP" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            *)     PA=$((PA+1)) ;;
          esac
          NEW="$MA.$MI.$PA"
          # 그 태그가 이미 있으면(재실행 등) patch 를 한 칸씩 더 올려 충돌 회피.
          while git rev-parse "agent-v$NEW" >/dev/null 2>&1; do
            PA=$((PA+1)); NEW="$MA.$MI.$PA"
          done
          echo "기준 $BASE (tag=$TAGVER, file=$FILEVER) → 새 버전 $NEW (bump=$BUMP)"

          # 버전 파일(단일 소스 2곳) 갱신.
          sed -i -E "s/^version = \".*\"/version = \"$NEW\"/" provider-agent/pyproject.toml
          sed -i -E "s/(AGENT_VERSION: Final\[str\] = \").*(\")/\1$NEW\2/" provider-agent/src/provider_agent/constants.py
          grep -q "\"$NEW\"" provider-agent/pyproject.toml
          grep -q "\"$NEW\"" provider-agent/src/provider_agent/constants.py

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add provider-agent/pyproject.toml provider-agent/src/provider_agent/constants.py
          # 버전 파일이 이미 NEW 면 커밋할 게 없음 — 그래도 태그는 만들어야 릴리스가 나간다(원인 #2).
          if git diff --cached --quiet; then
            echo "버전 파일이 이미 $NEW — 커밋 생략, 태그만 생성."
          else
            git commit -m "chore(agent): release agent-v$NEW [skip ci]"
            git push origin HEAD:main
          fi
          git tag "agent-v$NEW"
          git push origin "agent-v$NEW"
          # GITHUB_TOKEN 이 push 한 태그는 안전장치로 다른 워크플로를 트리거하지 않는다.
          # 단 workflow_dispatch/repository_dispatch 는 예외라 GITHUB_TOKEN 으로도 실행된다 →
          # agent-build 를 태그 ref 로 명시 트리거(빌드/릴리스/패키지매니저 갱신을 이어서 수행).
          gh workflow run agent-build.yml --ref "agent-v$NEW"
          echo "agent-v$NEW 태그 push + agent-build dispatch 완료."
