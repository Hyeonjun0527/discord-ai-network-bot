# Provider Agent 멀티 플랫폼 단일 실행파일 빌드 + 릴리스 (배포 신뢰성 강화).
# agent-v* 태그 push 시 Windows/macOS/Linux 단일 실행파일을 PyInstaller 로 빌드해
# 서명(Win signtool / macOS Developer ID + notarization)하고, 단일 SHA256SUMS.txt·SBOM·
# GitHub artifact attestation 과 함께 GitHub Release 에 첨부한다.
name: agent-build

on:
  workflow_dispatch:
  push:
    tags: ["agent-v*"]

permissions:
  contents: write # 릴리스 생성/자산 업로드
  id-token: write # artifact attestation(Sigstore OIDC)
  attestations: write # attest-build-provenance

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: provider-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
      - name: 빌드
        run: pyinstaller packaging/agent.spec
      # 릴리스 서명 게이트: agent-v* 태그 빌드는 미서명으로 통과시키지 않는다(조용한 미서명 금지).
      # 서명 강제는 **opt-in**: 레포 변수 REQUIRE_SIGNED_RELEASE=true 일 때만 미서명 릴리스를 막는다.
      # 기본(미설정)은 무료($0) 경로 — 미서명 + 체크섬/attestation/패키지매니저로 검증. 유료 인증서를
      # 등록한 뒤 변수를 켜면 그때부터 미서명 릴리스가 차단된다.
      - name: macOS 서명 시크릿 게이트(opt-in)
        if: startsWith(github.ref, 'refs/tags/agent-v') && runner.os == 'macOS' && vars.REQUIRE_SIGNED_RELEASE == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -z "${MACOS_CERT_P12}" ] || [ -z "${APPLE_ID}" ]; then
            echo "::error::REQUIRE_SIGNED_RELEASE=true 인데 macOS 서명/공증 시크릿이 없습니다. 미서명 릴리스를 막습니다."
            exit 1
          fi
      - name: Windows 서명 시크릿 게이트(opt-in)
        if: startsWith(github.ref, 'refs/tags/agent-v') && runner.os == 'Windows' && vars.REQUIRE_SIGNED_RELEASE == 'true'
        shell: bash
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
        run: |
          if [ -z "${WINDOWS_CERT_PFX}" ]; then
            echo "::error::REQUIRE_SIGNED_RELEASE=true 인데 Windows 코드서명 시크릿이 없습니다. 미서명 릴리스를 막습니다."
            exit 1
          fi
      # macOS Developer ID 서명 + notarization(#106). 인증서/Apple 계정 시크릿이 있을 때만 실행.
      - name: macOS codesign + notarize
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security unlock-keychain -p ci build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          # 하드웨어 런타임으로 Developer ID 서명(notarization 요건).
          codesign --deep --force --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" dist/discord-ai-provider-agent
          codesign --verify --strict --verbose=2 dist/discord-ai-provider-agent
          # notarization: 단일 실행파일은 zip 으로 제출(스테이플 불가 → 온라인 검증).
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ] && [ -n "${APPLE_APP_PASSWORD:-}" ]; then
            ditto -c -k --keepParent dist/discord-ai-provider-agent dist/notarize.zip
            xcrun notarytool submit dist/notarize.zip \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            rm -f dist/notarize.zip
          else
            echo "::warning::APPLE_ID/TEAM_ID/APP_PASSWORD 미설정 — 서명만 하고 notarization 생략"
          fi
      # Windows 코드서명(#107, SmartScreen 평판). 인증서 시크릿이 있을 때만 실행.
      - name: Windows signtool
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          & signtool sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\discord-ai-provider-agent.exe
          & signtool verify /pa dist\discord-ai-provider-agent.exe
      - name: OS별 자산 이름
        shell: bash
        run: |
          cd dist
          case "$RUNNER_OS" in
            Linux)   mv discord-ai-provider-agent discord-ai-provider-agent-linux ;;
            macOS)   mv discord-ai-provider-agent discord-ai-provider-agent-macos ;;
            Windows) mv discord-ai-provider-agent.exe discord-ai-provider-agent-windows.exe ;;
          esac
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: provider-agent-${{ matrix.os }}
          path: provider-agent/dist/discord-ai-provider-agent-*

  # 모든 OS 빌드를 모아 단일 SHA256SUMS.txt·SBOM·attestation 을 만들고 릴리스에 첨부.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: provider-agent-*
          merge-multiple: true
          path: dist
      - name: 단일 SHA256SUMS.txt 생성
        run: |
          cd dist
          sha256sum discord-ai-provider-agent-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # 패키지 매니저 매니페스트 렌더링(Homebrew/winget). 매니저가 sha256 을 자동 검증하므로
      # 사용자는 수동 해시검증이 불필요해진다. 렌더 결과를 릴리스 자산으로 첨부.
      - name: Homebrew/winget 매니페스트 렌더
        if: startsWith(github.ref, 'refs/tags/agent-v')
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#agent-v}"
          sha() { awk -v f="$1" '$2==f {print $1}' dist/SHA256SUMS.txt; }
          MAC=$(sha discord-ai-provider-agent-macos)
          LIN=$(sha discord-ai-provider-agent-linux)
          WIN=$(sha discord-ai-provider-agent-windows.exe)
          mkdir -p dist/pkg/winget
          sed -e "s/__VERSION__/$VER/g" -e "s/__MACOS_SHA256__/$MAC/g" -e "s/__LINUX_SHA256__/$LIN/g" \
            provider-agent/packaging/homebrew/discord-ai-provider-agent.rb > dist/pkg/discord-ai-provider-agent.rb
          for f in provider-agent/packaging/winget/*.yaml; do
            sed -e "s/__VERSION__/$VER/g" -e "s/__WINDOWS_SHA256__/$WIN/g" "$f" > "dist/pkg/winget/$(basename "$f")"
          done
          sed -e "s/__VERSION__/$VER/g" -e "s/__WINDOWS_SHA256__/$WIN/g" \
            provider-agent/packaging/scoop/discord-ai-provider-agent.json > dist/pkg/discord-ai-provider-agent.json
          echo "렌더된 매니페스트:"; ls -R dist/pkg
      # SBOM(소프트웨어 자재명세서) — provider-agent 의존성 그래프를 SPDX 로 생성.
      - name: SBOM 생성(syft/SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: provider-agent
          format: spdx-json
          artifact-name: provider-agent-sbom.spdx.json
          output-file: dist/provider-agent-sbom.spdx.json
      # GitHub artifact attestation — 바이너리 빌드 출처(provenance) 증명.
      - name: 빌드 출처 attestation
        if: startsWith(github.ref, 'refs/tags/agent-v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/discord-ai-provider-agent-*
      - name: SBOM attestation
        if: startsWith(github.ref, 'refs/tags/agent-v')
        uses: actions/attest-sbom@v2
        with:
          subject-path: dist/discord-ai-provider-agent-linux
          sbom-path: dist/provider-agent-sbom.spdx.json
      - name: GitHub Release 업로드
        if: startsWith(github.ref, 'refs/tags/agent-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: provider-agent ${{ github.ref_name }}
          body: |
            커뮤니티 Provider Agent — 내 PC 의 Ollama 를 풀에 연결하는 단일 실행파일.
            자기 OS 파일을 받아 `--token <토큰> --relay-url wss://discord-ai.yeon.world/agent` 로 실행하세요.

            ## 검증 방법(권장)
            1. `SHA256SUMS.txt` 를 함께 받아 해시를 대조하세요.
               - macOS/Linux: `sha256sum -c SHA256SUMS.txt --ignore-missing` (macOS 는 `shasum -a 256 -c`)
               - Windows: `Get-FileHash <파일> -Algorithm SHA256` 출력과 비교
            2. 빌드 출처(provenance)·SBOM attestation 확인:
               `gh attestation verify discord-ai-provider-agent-<os> --repo Hyeonjun0527/discord-assistant`
            3. 일반 사용자 권한으로 실행하세요(관리자/sudo 불필요).
          files: |
            dist/discord-ai-provider-agent-*
            dist/SHA256SUMS.txt
            dist/provider-agent-sbom.spdx.json
            dist/pkg/discord-ai-provider-agent.rb
            dist/pkg/discord-ai-provider-agent.json
            dist/pkg/winget/*.yaml
      # 다음 잡(tap/bucket 자동 갱신)에서 쓰도록 렌더된 매니페스트를 아티팩트로 올린다.
      - name: 매니페스트 아티팩트 업로드
        if: startsWith(github.ref, 'refs/tags/agent-v')
        uses: actions/upload-artifact@v4
        with:
          name: pkg-manifests
          path: dist/pkg/

  # 패키지 매니저 저장소(Homebrew tap·Scoop bucket) 자동 갱신.
  # PAT 시크릿 PKG_PUSH_TOKEN(tap·bucket 레포 push 권한)이 있을 때만 실행 — 없으면 통째로 스킵.
  # 사용자는 한 번만 두 레포 + PAT 를 만들면, 이후 릴리스마다 매니페스트가 자동으로 갱신된다.
  publish-pkg-managers:
    needs: release
    if: startsWith(github.ref, 'refs/tags/agent-v')
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.PKG_PUSH_TOKEN != '' && 'true' || 'false' }}
      OWNER: Hyeonjun0527
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pkg-manifests
          path: pkg
      - name: Homebrew tap 갱신
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.PKG_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#agent-v}"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp pkg/discord-ai-provider-agent.rb tap/Formula/discord-ai-provider-agent.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/discord-ai-provider-agent.rb
          git commit -m "discord-ai-provider-agent ${VER}" || { echo "변경 없음"; exit 0; }
          git push
      - name: Scoop bucket 갱신
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.PKG_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#agent-v}"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp pkg/discord-ai-provider-agent.json bucket/bucket/discord-ai-provider-agent.json
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/discord-ai-provider-agent.json
          git commit -m "discord-ai-provider-agent ${VER}" || { echo "변경 없음"; exit 0; }
          git push
      - name: 안내(토큰 없음)
        if: env.HAS_TOKEN != 'true'
        run: echo "PKG_PUSH_TOKEN 미설정 — tap/bucket 자동 갱신을 건너뜁니다. docs/SETUP_PACKAGE_MANAGERS.md 참고."

  # 빌드된 바이너리를 원격 central 의 다운로드 폴더로 배치 → central 이 /download/** 로 서빙.
  # (레포 비공개 유지: 같은 run 의 아티팩트를 받아 self-hosted 러너에서 복사 — 토큰/공개 불필요)
  publish-central:
    needs: build
    runs-on: [self-hosted, yeon-arm]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: provider-agent-*
          merge-multiple: true
          path: agent-bins
      - name: central 다운로드 폴더에 배치
        run: |
          set -e
          DEST="$HOME/deploy/central-server/downloads"
          mkdir -p "$DEST"
          cp -f agent-bins/discord-ai-provider-agent-* "$DEST/"
          chmod +x "$DEST"/discord-ai-provider-agent-* 2>/dev/null || true
          ls -la "$DEST"
