# Provider Agent 멀티 플랫폼 단일 실행파일 빌드 (LAUNCH 차수 9 #116).
# 태그 push 또는 수동 실행 시 Windows/macOS/Linux 바이너리를 PyInstaller 로 빌드해 아티팩트 업로드.
name: agent-build

on:
  workflow_dispatch:
  push:
    tags: ["agent-v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: provider-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
      - name: 빌드
        run: pyinstaller packaging/agent.spec
      - name: 체크섬(무결성 #115)
        shell: bash
        run: |
          cd dist
          if command -v shasum >/dev/null; then shasum -a 256 * > SHA256SUMS; else sha256sum * > SHA256SUMS; fi
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: provider-agent-${{ matrix.os }}
          path: provider-agent/dist/*
