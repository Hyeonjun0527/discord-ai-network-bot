# Provider Agent 멀티 플랫폼 단일 실행파일 빌드 + 릴리스 (배포 신뢰성 강화).
# agent-v* 태그 push 시 Windows/macOS/Linux 단일 실행파일을 PyInstaller 로 빌드해
# 서명(Win signtool / macOS Developer ID + notarization)하고, 단일 SHA256SUMS.txt·SBOM·
# GitHub artifact attestation 과 함께 GitHub Release 에 첨부한다.
name: agent-build

on:
  workflow_dispatch:
  push:
    tags: ["agent-v*"]

permissions:
  contents: write # 릴리스 생성/자산 업로드
  id-token: write # artifact attestation(Sigstore OIDC)
  attestations: write # attest-build-provenance

# Windows 러너의 기본 콘솔 인코딩(cp1252)은 한글·'→' 출력 시 UnicodeEncodeError 로 스텝을 죽인다.
# UTF-8 모드를 전역 강제해 모든 python 스크립트 출력이 Win/macOS/Linux 동일하게 동작하도록 한다.
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  # 릴리스 게이트: 온보딩 기본 이미지 모델 URL 이 살아있는지(HTTP 200) 빌드 전에 1회 검증.
  # HF 가 모델을 옮기거나 gated/삭제하면 익명 GET 이 깨져 전 사용자 다운로드가 실패하므로,
  # 깨진 URL 을 들고 릴리스가 나가는 걸 막는다(신규설치 신뢰성 감사 후속). 매트릭스 빌드는 이 잡에 의존.
  model-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 의존성(모델 카탈로그 import 용)
        run: pip install ./provider-agent
      - name: 기본 이미지 모델 URL 헬스체크
        run: python scripts/check_model_urls.py

  build:
    needs: model-urls
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: provider-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          # .[gui] = pywebview → 데스크톱 GUI(.app/.exe)가 네이티브 창으로 동작(없으면 브라우저 폴백).
          pip install ".[gui]" pyinstaller
      # 데스크톱 앱 자산 이식(생성물·gitignore). PyInstaller 가 webui_assets 를 번들하려면 빌드 전에 돌아야 한다.
      # scripts/sync_desktop_app.py 는 리포 루트 기준(__file__ parents[1])이라 working-directory 를 루트로.
      - name: 데스크톱 앱 자산 이식(sync-desktop)
        working-directory: ${{ github.workspace }}
        run: python scripts/sync_desktop_app.py
      - name: 빌드
        run: pyinstaller packaging/agent.spec
      # 릴리스 서명 게이트: agent-v* 태그 빌드는 미서명으로 통과시키지 않는다(조용한 미서명 금지).
      # 서명 강제는 **opt-in**: 레포 변수 REQUIRE_SIGNED_RELEASE=true 일 때만 미서명 릴리스를 막는다.
      # 기본(미설정)은 무료($0) 경로 — 미서명 + 체크섬/attestation/패키지매니저로 검증. 유료 인증서를
      # 등록한 뒤 변수를 켜면 그때부터 미서명 릴리스가 차단된다.
      - name: macOS 서명 시크릿 게이트(opt-in)
        if: startsWith(github.ref, 'refs/tags/agent-v') && runner.os == 'macOS' && vars.REQUIRE_SIGNED_RELEASE == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -z "${MACOS_CERT_P12}" ] || [ -z "${APPLE_ID}" ]; then
            echo "::error::REQUIRE_SIGNED_RELEASE=true 인데 macOS 서명/공증 시크릿이 없습니다. 미서명 릴리스를 막습니다."
            exit 1
          fi
      - name: Windows 서명 시크릿 게이트(opt-in)
        if: startsWith(github.ref, 'refs/tags/agent-v') && runner.os == 'Windows' && vars.REQUIRE_SIGNED_RELEASE == 'true'
        shell: bash
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
        run: |
          if [ -z "${WINDOWS_CERT_PFX}" ]; then
            echo "::error::REQUIRE_SIGNED_RELEASE=true 인데 Windows 코드서명 시크릿이 없습니다. 미서명 릴리스를 막습니다."
            exit 1
          fi
      # macOS Developer ID 서명 + notarization(#106). 인증서/Apple 계정 시크릿이 있을 때만 실행.
      - name: macOS codesign + notarize
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security unlock-keychain -p ci build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          # 하드웨어 런타임으로 Developer ID 서명(notarization 요건).
          codesign --deep --force --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" dist/nexa-agent-cli
          codesign --verify --strict --verbose=2 dist/nexa-agent-cli
          # notarization: 단일 실행파일은 zip 으로 제출(스테이플 불가 → 온라인 검증).
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ] && [ -n "${APPLE_APP_PASSWORD:-}" ]; then
            ditto -c -k --keepParent dist/nexa-agent-cli dist/notarize.zip
            xcrun notarytool submit dist/notarize.zip \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            rm -f dist/notarize.zip
          else
            echo "::warning::APPLE_ID/TEAM_ID/APP_PASSWORD 미설정 — 서명만 하고 notarization 생략"
          fi
          # GUI .app 번들(인앱 업데이트 배포물)도 동일하게 서명 + 공증 + staple.
          if [ -d "dist/Nexa.app" ]; then
            codesign --deep --force --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" "dist/Nexa.app"
            codesign --verify --strict --verbose=2 "dist/Nexa.app"
            if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ] && [ -n "${APPLE_APP_PASSWORD:-}" ]; then
              ditto -c -k --keepParent "dist/Nexa.app" dist/notarize-app.zip
              xcrun notarytool submit dist/notarize-app.zip \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
              xcrun stapler staple "dist/Nexa.app"   # 오프라인 검증용 티켓 부착
              rm -f dist/notarize-app.zip
            fi
          fi
      # Windows 코드서명(#107, SmartScreen 평판). 인증서 시크릿이 있을 때만 실행.
      - name: Windows signtool
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          & signtool sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\nexa-agent-cli.exe
          & signtool verify /pa dist\nexa-agent-cli.exe
          # GUI exe(Nexa.exe)도 동일하게 서명(SmartScreen 평판).
          if (Test-Path dist\Nexa.exe) {
            & signtool sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\Nexa.exe
            & signtool verify /pa dist\Nexa.exe
          }
      # Windows 코드서명 — SSL.com eSigner(클라우드, 토큰리스). 한국 개인은 Azure Trusted Signing 불가 →
      # SSL.com IV + eSigner 사용. Variables 에 WINDOWS_SIGN_PROVIDER=esigner 일 때만 동작(평소 비활성).
      # 시크릿: ES_USERNAME / ES_PASSWORD / ES_CREDENTIAL_ID / ES_TOTP_SECRET. (액션 버전은 추후 핀 고정 권장)
      - name: Windows eSigner sign (CLI exe)
        if: runner.os == 'Windows' && vars.WINDOWS_SIGN_PROVIDER == 'esigner'
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}\provider-agent\dist\nexa-agent-cli.exe
          override: 'true'
          malware_block: 'false'
          environment_name: PROD
      - name: Windows eSigner sign (GUI exe)
        if: runner.os == 'Windows' && vars.WINDOWS_SIGN_PROVIDER == 'esigner' && hashFiles('provider-agent/dist/Nexa.exe') != ''
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}\provider-agent\dist\Nexa.exe
          override: 'true'
          malware_block: 'false'
          environment_name: PROD
      - name: OS별 자산 이름
        shell: bash
        env:
          # dmg notarize/staple 용(서명 시크릿이 있을 때만 사용). 없으면 dmg 는 미공증으로 생성된다.
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          cd dist
          case "$RUNNER_OS" in
            Linux)   mv nexa-agent-cli nexa-agent-linux ;;
            macOS)   mv nexa-agent-cli nexa-agent-macos ;;
            Windows) mv nexa-agent-cli.exe nexa-agent-windows.exe ;;
          esac
          # macOS GUI .app → ① 인앱 업데이터/brew 가 받는 zip(내부 피드, 사용자 비노출).
          #                  ② 사용자 웹 다운로드용 dmg(드래그 설치) — Applications 심볼릭 링크 포함.
          # (서명/staple 끝난 .app 으로 만든다.)
          if [ "$RUNNER_OS" = "macOS" ] && [ -d "Nexa.app" ]; then
            ditto -c -k --keepParent "Nexa.app" "nexa-macos.zip"
            dmgroot="$(mktemp -d)"
            cp -R "Nexa.app" "$dmgroot/"
            ln -s /Applications "$dmgroot/Applications"
            # macOS runner 에서 hdiutil 이 가끔 기존 /Volumes/Nexa 또는 직전 partial dmg 를 물고
            # "Resource busy" 를 반환한다. 릴리스 전체를 깨지 않게 stale mount/output 을 정리하고 재시도한다.
            rm -f "nexa-macos.dmg"
            hdiutil detach "/Volumes/Nexa" -force 2>/dev/null || true
            created=false
            for attempt in 1 2 3; do
              if hdiutil create -volname "Nexa" -srcfolder "$dmgroot" -ov -format UDZO "nexa-macos.dmg"; then
                created=true
                break
              fi
              echo "::warning::hdiutil create failed (attempt ${attempt}/3); detaching stale Nexa volume and retrying"
              hdiutil detach "/Volumes/Nexa" -force 2>/dev/null || true
              rm -f "nexa-macos.dmg"
              sleep $((attempt * 5))
            done
            rm -rf "$dmgroot"
            if [ "$created" != "true" ]; then
              echo "::error::nexa-macos.dmg 생성 실패"
              exit 1
            fi
            # 완전 무경고(Gatekeeper) 드래그 설치를 위해 dmg 컨테이너 자체도 notarize + staple.
            # 서명/Apple 시크릿이 모두 있을 때만 — 없으면 미공증 dmg(체크섬/attestation 으로 검증).
            if [ -n "${MACOS_CERT_P12:-}" ] && [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ] && [ -n "${APPLE_APP_PASSWORD:-}" ]; then
              xcrun notarytool submit "nexa-macos.dmg" \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
              xcrun stapler staple "nexa-macos.dmg"   # 오프라인 검증 티켓 부착
            else
              echo "::warning::macOS 서명/Apple 시크릿 미설정 — dmg notarize/staple 생략(미공증 dmg)"
            fi
          fi
          # Windows GUI exe(네이티브 창) → 인앱 업데이트가 받는 배포 자산.
          if [ "$RUNNER_OS" = "Windows" ] && [ -f "Nexa.exe" ]; then
            mv "Nexa.exe" "nexa-windows.exe"
          fi
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: provider-agent-${{ matrix.os }}
          path: |
            provider-agent/dist/nexa-agent-linux
            provider-agent/dist/nexa-agent-macos
            provider-agent/dist/nexa-agent-windows.exe
            provider-agent/dist/nexa-macos.zip
            provider-agent/dist/nexa-macos.dmg
            provider-agent/dist/nexa-windows.exe

  # 모든 OS 빌드를 모아 단일 SHA256SUMS.txt·SBOM·attestation 을 만들고 릴리스에 첨부.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: provider-agent-*
          merge-multiple: true
          path: dist
      - name: 단일 SHA256SUMS.txt 생성
        run: |
          set -euo pipefail
          cd dist
          required_assets=(
            nexa-agent-linux
            nexa-agent-macos
            nexa-agent-windows.exe
            nexa-macos.zip
            nexa-macos.dmg
            nexa-windows.exe
          )
          for f in "${required_assets[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::릴리스 자산 파일이 없습니다: $f"
              find . -maxdepth 2 -print
              exit 1
            fi
            sha256sum "$f"
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # 패키지 매니저 매니페스트 렌더링(Homebrew/winget). 매니저가 sha256 을 자동 검증하므로
      # 사용자는 수동 해시검증이 불필요해진다. 렌더 결과를 릴리스 자산으로 첨부.
      - name: Homebrew/winget 매니페스트 렌더
        if: startsWith(github.ref, 'refs/tags/agent-v')
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#agent-v}"
          sha() { awk -v f="$1" '$2==f {print $1}' dist/SHA256SUMS.txt; }
          # CLI 바이너리(formula·헤드리스/linux 용)
          MAC=$(sha nexa-agent-macos)
          LIN=$(sha nexa-agent-linux)
          # 데스크톱 GUI 앱 자산(cask·winget·scoop — 맥/윈도우가 같은 앱을 받는다)
          MACGUI=$(sha nexa-macos.zip)
          WINGUI=$(sha nexa-windows.exe)
          mkdir -p dist/pkg/winget
          # Homebrew formula(CLI) — linux/헤드리스용
          sed -e "s/__VERSION__/$VER/g" -e "s/__MACOS_SHA256__/$MAC/g" -e "s/__LINUX_SHA256__/$LIN/g" \
            provider-agent/packaging/homebrew/nexa-agent.rb > dist/pkg/nexa-agent.rb
          # Homebrew cask(GUI .app) — 맥 데스크톱 앱(winget 과 동일 앱)
          sed -e "s/__VERSION__/$VER/g" -e "s/__MACOS_APP_SHA256__/$MACGUI/g" \
            provider-agent/packaging/homebrew/nexa.rb > dist/pkg/nexa.rb
          # winget/scoop(GUI exe) — 윈도우 데스크톱 앱
          for f in provider-agent/packaging/winget/*.yaml; do
            sed -e "s/__VERSION__/$VER/g" -e "s/__WINDOWS_SHA256__/$WINGUI/g" "$f" > "dist/pkg/winget/$(basename "$f")"
          done
          sed -e "s/__VERSION__/$VER/g" -e "s/__WINDOWS_SHA256__/$WINGUI/g" \
            provider-agent/packaging/scoop/nexa.json > dist/pkg/nexa.json
          echo "렌더된 매니페스트:"; ls -R dist/pkg
      # SBOM(소프트웨어 자재명세서) — provider-agent 의존성 그래프를 SPDX 로 생성.
      # 부가 산출물 — syft 를 GitHub 에서 받는데 CDN 504 가 잦다(실증, 반복 릴리스 실패 원인). 릴리스를
      # 막지 않게 continue-on-error(SBOM 이 없어도 바이너리·체크섬·attestation 으로 검증 가능).
      - name: SBOM 생성(syft/SPDX)
        id: sbom
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          path: provider-agent
          format: spdx-json
          artifact-name: provider-agent-sbom.spdx.json
          output-file: dist/provider-agent-sbom.spdx.json
      # GitHub artifact attestation — 바이너리 빌드 출처(provenance) 증명.
      - name: 빌드 출처 attestation
        if: startsWith(github.ref, 'refs/tags/agent-v')
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/nexa-agent-*
      - name: SBOM attestation
        # SBOM 생성이 성공했을 때만(파일이 있을 때만) — 부가 산출물이라 릴리스를 막지 않는다.
        if: startsWith(github.ref, 'refs/tags/agent-v') && steps.sbom.outcome == 'success'
        continue-on-error: true
        uses: actions/attest-sbom@v2
        with:
          subject-path: dist/nexa-agent-linux
          sbom-path: dist/provider-agent-sbom.spdx.json
      - name: GitHub Release 업로드
        if: startsWith(github.ref, 'refs/tags/agent-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: provider-agent ${{ github.ref_name }}
          body: |
            Nexa Provider Agent — 내 로컬 AI모델을 디스코드 서버/채널에 공유하는 단일 실행파일.
            자기 OS 파일을 받아 `--token <토큰> --relay-url wss://discord-ai.yeon.world/agent` 로 실행하세요.

            ## 검증 방법(권장)
            1. `SHA256SUMS.txt` 를 함께 받아 해시를 대조하세요.
               - macOS/Linux: `sha256sum -c SHA256SUMS.txt --ignore-missing` (macOS 는 `shasum -a 256 -c`)
               - Windows: `Get-FileHash <파일> -Algorithm SHA256` 출력과 비교
            2. 빌드 출처(provenance)·SBOM attestation 확인:
               `gh attestation verify nexa-agent-<os> --repo Hyeonjun0527/discord-ai-network-bot`
            3. 일반 사용자 권한으로 실행하세요(관리자/sudo 불필요).
          files: |
            dist/nexa-agent-*
            dist/nexa-macos.zip
            dist/nexa-macos.dmg
            dist/nexa-windows.exe
            dist/SHA256SUMS.txt
            dist/provider-agent-sbom.spdx.json
            dist/pkg/nexa-agent.rb
            dist/pkg/nexa.rb
            dist/pkg/nexa.json
            dist/pkg/winget/*.yaml
      # 다음 잡(tap/bucket 자동 갱신)에서 쓰도록 렌더된 매니페스트를 아티팩트로 올린다.
      - name: 매니페스트 아티팩트 업로드
        if: startsWith(github.ref, 'refs/tags/agent-v')
        uses: actions/upload-artifact@v4
        with:
          name: pkg-manifests
          path: dist/pkg/

  # 패키지 매니저 저장소(Homebrew tap·Scoop bucket) 자동 갱신.
  # GitHub App(org 소유, tap·bucket 에 설치, Contents:write)으로 런타임 설치 토큰을 발급해 push.
  # App 시크릿(PKG_APP_ID·PKG_APP_PRIVATE_KEY)이 있을 때만 실행 — 없으면 스킵.
  # org 정책상 장수명 PAT·deploy key 가 막혀 있어 만료 없는 App 방식을 사용한다.
  publish-pkg-managers:
    needs: release
    if: startsWith(github.ref, 'refs/tags/agent-v')
    runs-on: ubuntu-latest
    env:
      HAS_APP: ${{ secrets.PKG_APP_ID != '' && secrets.PKG_APP_PRIVATE_KEY != '' && 'true' || 'false' }}
      ORG: yeon-intergation-platform # tap/bucket 레포가 있는 org(릴리스 자산은 메인 레포에 남음)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pkg-manifests
          path: pkg
      - name: App 설치 토큰 발급(tap·bucket 스코프)
        if: env.HAS_APP == 'true'
        id: apptoken
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PKG_APP_ID }}
          private-key: ${{ secrets.PKG_APP_PRIVATE_KEY }}
          owner: yeon-intergation-platform
          repositories: |
            homebrew-tap
            scoop-bucket
      - name: Homebrew tap 갱신
        if: env.HAS_APP == 'true'
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#agent-v}"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${ORG}/homebrew-tap.git" tap
          mkdir -p tap/Formula tap/Casks
          cp pkg/nexa-agent.rb tap/Formula/nexa-agent.rb   # CLI(formula)
          cp pkg/nexa.rb tap/Casks/nexa.rb                 # 데스크톱 GUI 앱(cask)
          # 이전 이름들의 잔존 formula 제거(rename 정리) — 현재 이름만 남긴다.
          rm -f tap/Formula/discord-ai-network-bot.rb tap/Casks/nyassistant.rb 2>/dev/null || true
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A Formula Casks
          git commit -m "nexa ${VER}" || { echo "변경 없음"; exit 0; }
          git push
      - name: Scoop bucket 갱신
        if: env.HAS_APP == 'true'
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#agent-v}"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${ORG}/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp pkg/nexa.json bucket/bucket/nexa.json
          rm -f bucket/bucket/discord-ai-network-bot.json 2>/dev/null || true
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A bucket
          git commit -m "nexa ${VER}" || { echo "변경 없음"; exit 0; }
          git push
      - name: 안내(App 미설정)
        if: env.HAS_APP != 'true'
        run: echo "PKG_APP_ID/PKG_APP_PRIVATE_KEY 미설정 — tap/bucket 자동 갱신을 건너뜁니다. docs/SETUP_PACKAGE_MANAGERS.md 참고."

  # winget 은 Microsoft 커뮤니티 저장소가 버전별 매니페스트를 소유하므로, 릴리스마다 PR 이 필요하다.
  # WINGET_GH_TOKEN(사용자 fork push + microsoft/winget-pkgs PR 생성 권한)이 있을 때만 자동 제출한다.
  publish-winget-pr:
    needs: release
    if: startsWith(github.ref, 'refs/tags/agent-v')
    runs-on: ubuntu-latest
    env:
      HAS_WINGET_TOKEN: ${{ secrets.WINGET_GH_TOKEN != '' && 'true' || 'false' }}
      WINGET_FORK_OWNER: Hyeonjun0527
      WINGET_FORK_REPO: winget-pkgs
      WINGET_UPSTREAM: microsoft/winget-pkgs
      WINGET_PACKAGE_ID: Nexa.Nexa
      WINGET_MANIFEST_ROOT: manifests/n/Nexa/Nexa
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pkg-manifests
          path: pkg
      - name: winget-pkgs PR 생성/갱신
        if: env.HAS_WINGET_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.WINGET_GH_TOKEN }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#agent-v}"
          BRANCH="nexa-nexa-${VER}"
          DEST="${WINGET_MANIFEST_ROOT}/${VER}"

          test -f pkg/winget/Nexa.Nexa.yaml
          test -f pkg/winget/Nexa.Nexa.installer.yaml
          test -f pkg/winget/Nexa.Nexa.locale.ko-KR.yaml
          test -f pkg/winget/Nexa.Nexa.locale.en-US.yaml
          test -f pkg/winget/Nexa.Nexa.locale.ja-JP.yaml

          git clone --filter=blob:none --no-checkout \
            "https://x-access-token:${GH_TOKEN}@github.com/${WINGET_FORK_OWNER}/${WINGET_FORK_REPO}.git" winget-pkgs
          cd winget-pkgs
          git sparse-checkout init --cone
          git sparse-checkout set "${WINGET_MANIFEST_ROOT}"
          git fetch origin master --depth=1
          git checkout -B "${BRANCH}" origin/master

          mkdir -p "${DEST}"
          cp ../pkg/winget/*.yaml "${DEST}/"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${DEST}"
          git commit -m "Update ${WINGET_PACKAGE_ID} to version ${VER}" || { echo "winget 매니페스트 변경 없음"; exit 0; }
          git push --force-with-lease origin "${BRANCH}"

          if gh api "repos/${WINGET_UPSTREAM}/contents/${WINGET_MANIFEST_ROOT}?ref=master" >/dev/null 2>&1; then
            TITLE="Update ${WINGET_PACKAGE_ID} to version ${VER}"
          else
            TITLE="New package: ${WINGET_PACKAGE_ID} version ${VER}"
          fi
          BODY="$(printf 'Automated winget manifest submission for %s %s.\n\nRendered from %s@%s release %s.\n' "${WINGET_PACKAGE_ID}" "${VER}" "${GITHUB_REPOSITORY}" "${GITHUB_SHA}" "${GITHUB_REF_NAME}")"
          EXISTING_PR="$(gh pr list --repo "${WINGET_UPSTREAM}" --head "${WINGET_FORK_OWNER}:${BRANCH}" --state open --json number --jq '.[0].number // empty')"
          if [ -n "${EXISTING_PR}" ]; then
            gh pr edit "${EXISTING_PR}" --repo "${WINGET_UPSTREAM}" --title "${TITLE}" --body "${BODY}"
            echo "기존 winget PR 갱신: #${EXISTING_PR}"
          else
            gh pr create --repo "${WINGET_UPSTREAM}" --base master --head "${WINGET_FORK_OWNER}:${BRANCH}" --title "${TITLE}" --body "${BODY}"
          fi
      - name: 안내(winget 토큰 미설정)
        if: env.HAS_WINGET_TOKEN != 'true'
        run: echo "WINGET_GH_TOKEN 미설정 — winget-pkgs PR 자동 생성을 건너뜁니다. docs/SETUP_PACKAGE_MANAGERS.md 참고."

  # 빌드된 바이너리를 원격 central 의 다운로드 폴더로 배치 → central 이 /download/** 로 서빙.
  # (레포 비공개 유지: 같은 run 의 아티팩트를 받아 self-hosted 러너에서 복사 — 토큰/공개 불필요)
  publish-central:
    needs: build
    runs-on: [self-hosted, yeon-arm]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: provider-agent-*
          merge-multiple: true
          path: agent-bins
      - name: central 다운로드 폴더에 배치
        run: |
          set -euo pipefail
          DEST="$HOME/deploy/central-server/downloads"
          mkdir -p "$DEST"
          required_assets=(
            nexa-agent-linux
            nexa-agent-macos
            nexa-agent-windows.exe
            nexa-macos.zip
            nexa-macos.dmg
            nexa-windows.exe
          )
          for f in "${required_assets[@]}"; do
            if [ ! -f "agent-bins/$f" ]; then
              echo "::error::central 배치 자산 파일이 없습니다: $f"
              find agent-bins -maxdepth 2 -print
              exit 1
            fi
            cp -f "agent-bins/$f" "$DEST/"
          done
          # 공개 업데이트 채널: 앱은 비공개 GitHub 릴리스에 인증 없이 접근할 수 없으므로 central /download 를 SSOT 로 쓴다.
          (
            cd "$DEST"
            sha256sum "${required_assets[@]}" > SHA256SUMS.txt
            if [[ "${GITHUB_REF_NAME:-}" == agent-v* ]]; then
              VER="${GITHUB_REF_NAME#agent-v}"
              cat > latest.json <<JSON
          {
            "version": "${VER}",
            "tag": "${GITHUB_REF_NAME}",
            "assets": {
              "nexa-macos.zip": "https://discord-ai.yeon.world/download/nexa-macos.zip",
              "nexa-macos.dmg": "https://discord-ai.yeon.world/download/nexa-macos.dmg",
              "nexa-windows.exe": "https://discord-ai.yeon.world/download/nexa-windows.exe",
              "SHA256SUMS.txt": "https://discord-ai.yeon.world/download/SHA256SUMS.txt"
            }
          }
          JSON
            fi
          )
          chmod +x "$DEST"/nexa-agent-linux "$DEST"/nexa-agent-macos 2>/dev/null || true
          ls -la "$DEST"
