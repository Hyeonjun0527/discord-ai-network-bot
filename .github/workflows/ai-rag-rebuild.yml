name: AI RAG 인덱스 재빌드

on:
  push:
    branches: [main]
    paths:
      - 'rag/**'
      - 'docker/rag/Dockerfile'
      - 'docker-compose.qdrant.yml'
      - 'scripts/rag.sh'
      - '.github/workflows/ai-rag-rebuild.yml'
      - 'docs/**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-rag-rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    name: AI Network RAG rebuild and eval
    runs-on: [self-hosted, yeon-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip stale main run
        id: fresh
        run: |
          git fetch --no-tags --depth=1 origin main
          latest="$(git rev-parse FETCH_HEAD)"
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "A newer main commit exists; skipping stale RAG rebuild"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore ENV_FILE
        if: steps.fresh.outputs.run == 'true'
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s' "$ENV_FILE" > .env

      # build-local/eval은 Qdrant vector rebuild를 하지 않는다.
      # self-hosted Pi의 16KB page size에서 공식 Qdrant 이미지가 jemalloc abort를 내므로
      # 불필요하게 Qdrant를 띄우지 않고, 과거 run이 남긴 helper 컨테이너만 정리한다.
      - name: Stop stale Qdrant helper
        if: steps.fresh.outputs.run == 'true'
        run: docker compose -f docker-compose.qdrant.yml down --remove-orphans || true

      - name: Rebuild local RAG index
        if: steps.fresh.outputs.run == 'true'
        run: scripts/rag.sh build-local

      - name: Evaluate RAG golden set
        if: steps.fresh.outputs.run == 'true'
        run: scripts/rag.sh eval

      - name: Commit generated metadata index
        if: steps.fresh.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rag/bm25/corpus.jsonl rag/meta.db
          if git diff --staged --quiet; then
            echo "RAG index unchanged"
          else
            git commit -m "chore: rebuild AI network RAG index [skip ci]"
            git push origin main
          fi
