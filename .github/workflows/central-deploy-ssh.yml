# central-server 자동 CI/CD → 원격 SSH 배포(linuxssh.dailyting.cloud).
# 흐름: bootJar 빌드 → GHCR 이미지 push → SSH 로 원격에 .env 렌더 → compose pull/up → 헬스 판정.
#
# 필요한 GitHub Secrets:
#   SSH_HOST          = linuxssh.dailyting.cloud
#   SSH_USER          = osuma
#   SSH_PRIVATE_KEY   = 원격 접속용 개인키(전체 PEM). 원격 ~/.ssh/authorized_keys 에 공개키 등록 필요.
#   GHCR_PAT          = read:packages 권한 PAT(원격에서 이미지 pull 용). 이미지 public 이면 생략 가능.
#   CENTRAL_DB_PASSWORD = Postgres 비밀번호
#   DISCORD_BOT_TOKEN = 봇 토큰
#   DISCORD_GUILD_ID  = (선택) 즉시 명령 등록용 길드 ID
name: central-server CI/CD (SSH 원격 배포)

on:
  push:
    branches: [main, feat/remote-agent-byollm]
    paths:
      - "central-server/**"
      - ".github/workflows/central-deploy-ssh.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: central-deploy-ssh
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/central-server
  REMOTE_DIR: deploy/central-server

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: bootJar 빌드
        working-directory: central-server
        run: ./gradlew bootJar --no-daemon --console=plain

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 & push
        uses: docker/build-push-action@v6
        with:
          context: central-server
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: compose 파일 원격 복사
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: central-server/deploy/compose.remote.yml
          target: ${{ env.REMOTE_DIR }}
          strip_components: 2 # central-server/deploy/ 제거 → compose.remote.yml 만

      - name: 원격 배포(pull + up + 헬스)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE,GITHUB_SHA,GHCR_USER,GHCR_PAT,CENTRAL_DB_PASSWORD,DISCORD_BOT_TOKEN,DISCORD_GUILD_ID
          script_stop: true
          script: |
            set -e
            cd "${REMOTE_DIR:-deploy/central-server}" 2>/dev/null || { mkdir -p deploy/central-server && cd deploy/central-server; }
            mv -f compose.remote.yml compose.yml 2>/dev/null || true
            cat > .env <<ENV
            CENTRAL_IMAGE=${IMAGE}:${GITHUB_SHA}
            CENTRAL_DB_PASSWORD=${CENTRAL_DB_PASSWORD}
            DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
            DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
            ENV
            chmod 600 .env
            if [ -n "${GHCR_PAT}" ]; then echo "${GHCR_PAT}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin; fi
            docker compose --env-file .env -f compose.yml pull
            docker compose --env-file .env -f compose.yml up -d
            ok=0
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then ok=1; break; fi
              sleep 3
            done
            if [ "$ok" != "1" ]; then
              echo "❌ 헬스 실패 — 로그:"; docker compose -f compose.yml logs --tail=60 central-server; exit 1
            fi
            echo "✅ 배포 완료 + 헬스 UP"
        env:
          IMAGE: ${{ env.IMAGE }}
          GITHUB_SHA: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          CENTRAL_DB_PASSWORD: ${{ secrets.CENTRAL_DB_PASSWORD }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
