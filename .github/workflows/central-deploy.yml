# central-server 자동 CI/CD → 원격 self-hosted 러너(ssh.yeon.world, ARM64) 배포.
# Cloudflare Tunnel 뒤라 raw SSH 불가 → 원격에 설치한 self-hosted 러너에서 직접 배포.
# build(ubuntu-latest): bootJar → arm64 이미지 GHCR push(QEMU).  deploy(self-hosted: yeon-arm): pull → compose up → 헬스.
#
# 필요한 GitHub Secrets:
#   ENV_FILE — 운영 .env 전체(CENTRAL_DB_PASSWORD, DISCORD_BOT_TOKEN, DISCORD_GUILD_ID,
#              RELAY_PUBLIC_URL 등 앱 런타임 환경변수). 앱 시크릿은 이 하나로만 관리한다.
# GHCR pull 은 self-hosted 러너의 GITHUB_TOKEN 으로 처리(추가 PAT 불필요).
name: central-server CI/CD (원격 배포)

on:
  push:
    branches: [main, feat/remote-agent-byollm]
    paths:
      - "central-server/**"
      - ".github/workflows/central-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: central-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/hyeonjun0527/central-server
  APP_PORT: "8085"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: bootJar 빌드
        working-directory: central-server
        run: ./gradlew bootJar --no-daemon --console=plain
      - uses: docker/setup-qemu-action@v3 # 새 서버(ssh.yeon.world) ARM64 → arm64 이미지 빌드 에뮬레이션
      - uses: docker/setup-buildx-action@v3
      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 이미지 빌드 & push
        uses: docker/build-push-action@v6
        with:
          context: central-server
          platforms: linux/arm64 # 새 서버 ARM64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: [self-hosted, yeon-arm]
    steps:
      - uses: actions/checkout@v4
      - name: GHCR 로그인(원격)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: 배포(compose pull + up + 헬스)
        env:
          IMAGE: ${{ env.IMAGE }}
          GIT_SHA: ${{ github.sha }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          APP_PORT: ${{ env.APP_PORT }}
          SERVER_PORT: "8085"
        run: |
          set -e
          DEST="$HOME/deploy/central-server"
          mkdir -p "$DEST"
          cp central-server/deploy/compose.remote.yml "$DEST/compose.yml"
          cd "$DEST"
          umask 077
          if [ -z "${ENV_FILE:-}" ]; then
            echo "❌ ENV_FILE GitHub secret 이 비어 있습니다."
            exit 1
          fi
          printf '%s\n' "$ENV_FILE" > .env
          tr -d '\r' < .env > .env.tmp && mv .env.tmp .env
          awk '!/^(CENTRAL_IMAGE|SERVER_PORT|APP_PORT)=/' .env > .env.tmp
          mv .env.tmp .env
          {
            echo "CENTRAL_IMAGE=${IMAGE}:${GIT_SHA}"
            echo "SERVER_PORT=${SERVER_PORT}"
            echo "APP_PORT=${APP_PORT}"
          } >> .env
          # 웹검색(SearXNG) 설정 — JSON 포맷 활성 + 안정적 시크릿(최초 1회만 생성, 이후 유지).
          # 컨테이너(다른 uid)가 읽어야 하므로 settings 파일은 읽기 가능 권한으로 둔다.
          mkdir -p searxng
          if [ ! -f searxng/settings.yml ]; then
            SX_SECRET=$(openssl rand -hex 32 2>/dev/null || (head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'))
            printf 'use_default_settings: true\nserver:\n  secret_key: "%s"\n  limiter: false\n  image_proxy: false\nsearch:\n  formats:\n    - html\n    - json\n' "$SX_SECRET" > searxng/settings.yml
          fi
          chmod 755 searxng && chmod 644 searxng/settings.yml || true
          retry() {
            name="$1"
            shift
            max=5
            delay=10
            for i in $(seq 1 "$max"); do
              echo "▶ ${name} 시도 ${i}/${max}"
              if "$@"; then
                echo "✅ ${name} 성공"
                return 0
              fi
              if [ "$i" = "$max" ]; then
                echo "❌ ${name} 최종 실패"
                return 1
              fi
              sleep "$delay"
              delay=$((delay * 2))
            done
          }
          retry "GHCR 이미지 다운로드" docker compose --env-file .env -f compose.yml pull
          retry "컨테이너 기동" docker compose --env-file .env -f compose.yml up -d
          ok=0
          for i in $(seq 1 40); do
            if curl -sf http://localhost:${APP_PORT}/actuator/health | grep -q '"status":"UP"'; then ok=1; break; fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "❌ 헬스 실패 — 로그:"; docker compose -f compose.yml logs --tail=80 central-server; exit 1
          fi
          echo "✅ 배포 완료 + 헬스 UP (image ${IMAGE}:${GIT_SHA})"
