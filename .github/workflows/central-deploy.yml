# central-server 자동 CI/CD → 원격 self-hosted 러너(ssh.yeon.world, ARM64) 배포.
# Cloudflare Tunnel 뒤라 raw SSH 불가 → 원격에 설치한 self-hosted 러너에서 직접 배포.
# build(self-hosted yeon-arm): bootJar → arm64 이미지 GHCR push(네이티브).  deploy(self-hosted yeon-arm): pull → compose up → 헬스.
# 정책: GitHub-hosted runner 미사용 — 모든 job 은 self-hosted ARM64 러너에서만 돈다.
#
# 운영 값의 SSOT는 GitHub production Environment다. 민감 값은 Compose secrets로만 컨테이너에 전달하며,
# self-hosted runner의 배포 디렉터리에 .env를 만들지 않는다.
# GHCR pull 은 self-hosted 러너의 GITHUB_TOKEN 으로 처리(추가 PAT 불필요).
name: central-server CI/CD (원격 배포)

on:
  push:
    branches: [main]
    paths:
      - "central-server/**"
      - ".github/workflows/central-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: central-deploy
  # yeon-arm runner is a single deployment lane. A newer main push must cancel
  # stale queued/in-flight deploy runs; otherwise old deploys hold the group and
  # the latest production deploy remains pending.
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/hyeonjun0527/central-server
  APP_PORT: "8085"

jobs:
  fresh-main:
    runs-on: [self-hosted, yeon-arm]
    outputs:
      should-deploy: ${{ steps.fresh.outputs.should-deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - id: fresh
        name: 최신 main 배포만 진행
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=50 origin main
          latest="$(git rev-parse origin/main)"
          if [ "$latest" != "${{ github.sha }}" ]; then
            # origin/main 이 이 커밋보다 앞서 있어도, 뒤따른 커밋이 '배포 트리거 경로'
            # (central-server/** · 이 워크플로)를 건드리지 않았으면 그 커밋은 자기 deploy 를
            # 트리거하지 않는다(예: rag 인덱스 [skip ci] 리빌드). 그 경우 이 실행이 여전히
            # 최신 코드이므로 계속 진행한다. 예전엔 tip 이동만으로 무조건 스킵해서, 매 머지
            # 뒤 자동으로 붙는 RAG 리빌드 커밋이 코드 배포를 통째로 삼켜 배포가 안 됐다.
            newer="$(git diff --name-only "${{ github.sha }}" "$latest" -- \
              'central-server/**' '.github/workflows/central-deploy.yml' 2>/dev/null || echo UNKNOWN)"
            if [ -n "$newer" ]; then
              echo "배포 경로를 건드린 더 최신 main 커밋($latest)이 있어 이 배포는 스킵합니다:"
              echo "$newer"
              echo "should-deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "뒤따른 커밋은 배포 경로를 안 건드림(rag 인덱스 등) — 이 실행이 최신 코드, 계속 진행."
          fi
          echo "should-deploy=true" >> "$GITHUB_OUTPUT"

  build:
    needs: fresh-main
    if: needs.fresh-main.outputs.should-deploy == 'true'
    # self-hosted ARM64(yeon-arm, Linux) — 네이티브 arm64 라 QEMU 에뮬레이션 불필요. GitHub-hosted 미사용.
    runs-on: [self-hosted, yeon-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: bootJar 빌드
        working-directory: central-server
        run: ./gradlew bootJar --no-daemon --console=plain
      - uses: docker/setup-buildx-action@v3
      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 이미지 빌드 & push
        uses: docker/build-push-action@v6
        with:
          context: central-server
          platforms: linux/arm64 # 새 서버 ARM64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: [fresh-main, build]
    if: needs.fresh-main.outputs.should-deploy == 'true'
    runs-on: [self-hosted, yeon-arm]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: GHCR 로그인(원격)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: 배포(compose pull + up + 헬스)
        env:
          CENTRAL_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          APP_PORT: ${{ env.APP_PORT }}
          SERVER_PORT: "8085"
          COMPOSE_DISABLE_ENV_FILE: "1"
          CENTRAL_DB_PASSWORD: ${{ secrets.CENTRAL_DB_PASSWORD }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_ENABLED: ${{ secrets.DISCORD_ENABLED }}
          RELAY_PUBLIC_URL: ${{ secrets.RELAY_PUBLIC_URL }}
          CENTRAL_DURABLE_SECRET: ${{ secrets.CENTRAL_DURABLE_SECRET }}
          NEXA_FIELD_ENC_KEY: ${{ secrets.NEXA_FIELD_ENC_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          CONNECT_DISCORD_CLIENT_ID: ${{ secrets.CONNECT_DISCORD_CLIENT_ID }}
          CONNECT_DISCORD_CLIENT_SECRET: ${{ secrets.CONNECT_DISCORD_CLIENT_SECRET }}
          CENTRAL_OAUTH_ENABLED: ${{ secrets.CENTRAL_OAUTH_ENABLED }}
          CENTRAL_DASHBOARD_ADMIN_USER_IDS: ${{ secrets.CENTRAL_DASHBOARD_ADMIN_USER_IDS }}
        run: |
          set -euo pipefail
          DEST="$HOME/deploy/central-server"
          mkdir -p "$DEST"
          candidate_compose="$DEST/.compose.candidate-${GITHUB_RUN_ID}"
          rendered_compose="$DEST/.compose.rendered-${GITHUB_RUN_ID}"
          previous_compose="$DEST/.compose.previous-${GITHUB_RUN_ID}"
          legacy_env="$DEST/.env.legacy-${GITHUB_RUN_ID}"
          legacy_durable="$DEST/.durable-secret.legacy-${GITHUB_RUN_ID}"
          install -m 640 central-server/deploy/compose.remote.yml "$candidate_compose"
          cp central-server/scripts/ops_healthcheck.sh "$DEST/ops_healthcheck.sh"
          cp central-server/scripts/ops_policy_audit.sh "$DEST/ops_policy_audit.sh"
          cp central-server/scripts/ops_runtime_secret_audit.sh "$DEST/ops_runtime_secret_audit.sh"
          chmod 755 "$DEST/ops_healthcheck.sh" "$DEST/ops_policy_audit.sh" "$DEST/ops_runtime_secret_audit.sh"
          cd "$DEST"
          umask 077

          rollback() {
            status=$?
            if [ "$status" -ne 0 ] && [ -f "$previous_compose" ]; then
              echo "::warning::새 secret-file 배포 실패 — 이전 compose와 host secret 파일로 롤백합니다."
              [ ! -f "$legacy_env" ] || mv -f "$legacy_env" .env
              [ ! -f "$legacy_durable" ] || mv -f "$legacy_durable" .durable-secret
              cp -f "$previous_compose" compose.yml
              if [ -f .env ]; then
                rollback_compose=(docker compose --env-file .env -f compose.yml)
              else
                rollback_compose=(docker compose --env-file /dev/null -f compose.yml)
              fi
              "${rollback_compose[@]}" up -d || \
                echo "::error::자동 롤백 기동 실패 — 운영 호스트를 즉시 확인하세요."
            fi
            rm -f "$candidate_compose" "$rendered_compose" "$previous_compose"
            exit "$status"
          }
          trap rollback EXIT

          required_production_values=(
            CENTRAL_DB_PASSWORD DISCORD_BOT_TOKEN CENTRAL_DURABLE_SECRET
            NEXA_FIELD_ENC_KEY ZAI_API_KEY CONNECT_DISCORD_CLIENT_SECRET
            DISCORD_ENABLED RELAY_PUBLIC_URL CONNECT_DISCORD_CLIENT_ID
            CENTRAL_OAUTH_ENABLED CENTRAL_DASHBOARD_ADMIN_USER_IDS
          )
          for key in "${required_production_values[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "::error::필수 production Environment Secret이 비어 있습니다: ${key}"
              exit 1
            fi
          done

          compose=(docker compose --env-file /dev/null -f "$candidate_compose")
          "${compose[@]}" config --quiet
          "${compose[@]}" config > "$rendered_compose"
          rendered_content="$(cat "$rendered_compose")"
          for key in "${required_production_values[@]}"; do
            if [[ "$rendered_content" == *"${!key}"* ]]; then
              echo "::error::렌더링된 Compose에 ${key} 값이 포함되었습니다."
              exit 1
            fi
          done
          unset rendered_content
          [ ! -f compose.yml ] || cp -p compose.yml "$previous_compose"
          install -m 640 "$rendered_compose" compose.yml.next
          mv -f compose.yml.next compose.yml
          rm -f "$candidate_compose" "$rendered_compose"
          compose=(docker compose --env-file /dev/null -f compose.yml)

          echo "▶ 운영 GLM 모델 free=glm-4.5-air fast=glm-4.5-air speech=glm-4.5-air"
          # 웹검색(SearXNG) 설정 — JSON 포맷 활성 + 안정적 시크릿(최초 1회만 생성, 이후 유지).
          # 컨테이너(다른 uid)가 읽어야 하므로 settings 파일은 읽기 가능 권한으로 둔다.
          mkdir -p searxng
          if [ ! -f searxng/settings.yml ]; then
            SX_SECRET=$(openssl rand -hex 32 2>/dev/null || (head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'))
            printf 'use_default_settings: true\nserver:\n  secret_key: "%s"\n  limiter: false\n  image_proxy: false\nsearch:\n  formats:\n    - html\n    - json\n' "$SX_SECRET" > searxng/settings.yml
          fi
          chmod 755 searxng && chmod 644 searxng/settings.yml || true
          retry() {
            name="$1"
            shift
            max=5
            delay=10
            for i in $(seq 1 "$max"); do
              echo "▶ ${name} 시도 ${i}/${max}"
              if "$@"; then
                echo "✅ ${name} 성공"
                return 0
              fi
              if [ "$i" = "$max" ]; then
                echo "❌ ${name} 최종 실패"
                return 1
              fi
              sleep "$delay"
              delay=$((delay * 2))
            done
          }
          retry "GHCR 이미지 다운로드" "${compose[@]}" pull
          retry "컨테이너 기동" "${compose[@]}" up -d --force-recreate
          ok=0
          for i in $(seq 1 40); do
            if curl -sf "http://localhost:${APP_PORT}/actuator/health" | grep -q '"status":"UP"'; then ok=1; break; fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "❌ 헬스 실패 — 로그:"; "${compose[@]}" logs --tail=80 central-server; exit 1
          fi
          echo "✅ 배포 완료 + 헬스 UP (image ${CENTRAL_IMAGE})"

          # 새 secret-file 런타임이 정상 기동한 뒤에만 legacy host secret 파일을 제거한다.
          [ ! -f .env ] || mv -f .env "$legacy_env"
          [ ! -f .durable-secret ] || mv -f .durable-secret "$legacy_durable"
          rm -f .env.tmp
          echo "▶ 운영 런타임 시크릿 감사(.env 없음, secret file 사용, 평문 env 없음)"
          ./ops_runtime_secret_audit.sh

          echo "▶ 운영 헬스 감사(health/pool/dev-mode)"
          EXTERNAL_BASE_URL=https://discord-ai.yeon.world ./ops_healthcheck.sh
          echo "▶ 운영 정책 감사(auto-respond/니아 자동 채널 vs LLM allow-list)"
          # 단일 인용문은 central-server 컨테이너 안에서 확장해야 한다.
          # shellcheck disable=SC2016
          if "${compose[@]}" exec -T central-server sh -c 'test -s "${DISCORD_BOT_TOKEN_FILE:-/run/secrets/central.discord.bot-token}"'; then
            DISCORD_GUILD_ID=all ./ops_policy_audit.sh
          else
            ./ops_policy_audit.sh
          fi
          echo "▶ 오래된 미사용 Docker 이미지 정리(활성 컨테이너 이미지와 최근 7일 이미지는 보존)"
          if ! docker image prune -af --filter "until=168h"; then
            echo "::warning::Docker 이미지 자동 정리에 실패했습니다. 배포는 완료됐지만 서버 디스크 상태를 확인하세요."
          fi
          docker system df || true
          rm -f "$legacy_env" "$legacy_durable" "$previous_compose"
          trap - EXIT
