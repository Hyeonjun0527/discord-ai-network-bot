# central-server 배포 (LAUNCH 차수 7). self-hosted 러너에서 compose 로 배포 + 헬스 판정.
# 필요 시크릿: CENTRAL_DB_PASSWORD, DISCORD_BOT_TOKEN. (이미지 워크플로 성공 후 트리거)
name: central-server deploy

on:
  workflow_run:
    workflows: ["central-server image"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Build jar (app.jar)
        working-directory: central-server
        run: ./gradlew clean bootJar --no-daemon --console=plain
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 || env.JAVA_HOME }}
      - name: Deploy (compose up)
        working-directory: central-server
        env:
          DB_PASSWORD: ${{ secrets.CENTRAL_DB_PASSWORD }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_ENABLED: "true"
        run: docker compose up -d --build
      - name: Health check (Flyway 마이그레이션 포함)
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "central-server UP"; exit 0
            fi
            sleep 3
          done
          echo "::error::배포 후 헬스체크 실패"; docker compose -f central-server/docker-compose.yml logs --tail=50 central-server; exit 1
      - name: Rollback note
        if: failure()
        run: echo "::warning::롤백은 이전 이미지 태그로 docker compose up (docs/ROLLBACK 참고)"
