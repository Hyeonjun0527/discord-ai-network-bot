# [DEPRECATED — 수동 전용] self-hosted(Mac) 배포. 운영 자동배포는 central-deploy.yml
# (원격 ssh.yeon.world / yeon-arm)로 이관됨. 이 워크플로는 비상 수동 폴백으로만 남긴다.
# 필요 시크릿: ENV_FILE.
name: central-server deploy (self-hosted, deprecated)

on:
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Build jar (app.jar)
        working-directory: central-server
        run: ./gradlew clean bootJar --no-daemon --console=plain
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 || env.JAVA_HOME }}
      - name: Deploy (compose up)
        working-directory: central-server
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "${ENV_FILE:-}" ]; then
            echo "❌ ENV_FILE GitHub secret 이 비어 있습니다."
            exit 1
          fi
          printf '%s\n' "$ENV_FILE" > .env
          tr -d '\r' < .env > .env.tmp && mv .env.tmp .env
          docker compose --env-file .env up -d --build
      - name: Health check (Flyway 마이그레이션 포함)
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8085/actuator/health | grep -q '"status":"UP"'; then
              echo "central-server UP"; exit 0
            fi
            sleep 3
          done
          echo "::error::배포 후 헬스체크 실패"; docker compose -f central-server/docker-compose.yml logs --tail=50 central-server; exit 1
      - name: Rollback note
        if: failure()
        run: echo "::warning::롤백은 이전 이미지 태그로 docker compose up (docs/ROLLBACK 참고)"
