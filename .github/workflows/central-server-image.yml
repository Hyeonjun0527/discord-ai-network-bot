# central-server 이미지 빌드 & GHCR 푸시 (LAUNCH 차수 7).
name: central-server image

on:
  push:
    branches: [main]
    paths:
      - "central-server/**"
      - ".github/workflows/central-server-image.yml"
    tags:
      - "central-v*"
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build jar (app.jar)
        working-directory: central-server
        run: ./gradlew clean bootJar --no-daemon --console=plain
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: central-server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/central-server:latest
            ghcr.io/${{ github.repository_owner }}/central-server:${{ github.sha }}
