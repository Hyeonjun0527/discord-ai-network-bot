# central-server 이미지 빌드 & GHCR 푸시 (LAUNCH 차수 7).
name: central-server image

# 릴리스 이미지 빌드 전용(태그). 브랜치 push 의 빌드+배포는 central-deploy-ssh.yml 이 담당.
on:
  push:
    tags:
      - "central-v*"
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build jar (app.jar)
        working-directory: central-server
        run: ./gradlew clean bootJar --no-daemon --console=plain
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: central-server
          push: true
          tags: |
            ghcr.io/hyeonjun0527/central-server:latest
            ghcr.io/hyeonjun0527/central-server:${{ github.sha }}
