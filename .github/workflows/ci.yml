name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python -m ruff check src/
      - run: python -m mypy src/
      # 커버리지 게이트(#66): bot 패키지 테스트 보강 후 실측 ~91.6% (#64).
      # 크로스버전/소폭 변동 여유를 둔 85% 하한으로 회귀를 막는다.
      # 임계는 pyproject [tool.coverage.report] 와 일치(85%). 보강되면 함께 올린다.
      - run: python -m pytest tests/ -v --cov=discord_assistant --cov-report=term-missing --cov-fail-under=85

  # 대시보드 백엔드 잡(#86): FastAPI 라우트의 ruff + pytest 스모크.
  dashboard-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 봇 패키지(src) + 대시보드 런타임/테스트 의존성 설치.
      # ruff/pytest 류 개발 도구는 봇 패키지의 [dev] extras 로 가져온다.
      - run: pip install -e ".[dev]"
      - run: pip install -r dashboard/backend/requirements.txt
      - run: python -m ruff check dashboard/backend
      - run: python -m pytest dashboard/backend -v --no-cov

  # 프론트엔드 잡(#86): Node 셋업 → 의존성 설치 → lint → 타입체크 → build.
  # 락파일이 없어 `npm ci` 대신 `npm install` 을 사용한다.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      # tsc --noEmit 로 타입 검사(빌드와 별개 단계로 빠르게 실패 확인).
      - run: npx tsc --noEmit
      - run: npm run build
