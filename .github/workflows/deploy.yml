name: Build, Push, and Deploy

# CD pipeline (yeon-style, simplified for a single Python bot):
#   main push / manual dispatch
#     → build linux/arm64 image on the self-hosted Mac
#     → push to GHCR (sha-<short> + latest)
#     → deploy on the SAME self-hosted host via `docker compose pull && up -d --wait`
# The self-hosted runner IS the deploy server (no SSH). Secrets live in a
# host-managed `.env` at DEPLOY_DIR (see deploy/.env.prod.example).

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "compose.prod.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

# Don't cancel an in-flight deploy on main; serialize instead.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: discord-assistant

jobs:
  build-and-push:
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image metadata
        id: meta
        run: |
          set -eu
          owner_lower="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${owner_lower}/${IMAGE_NAME}"
          tag="sha-${GITHUB_SHA::7}"
          {
            echo "image=${image}"
            echo "image_tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max

      # #71: 빌드 실패 시에도 Discord 웹훅으로 알림(미설정 시 스킵).
      - name: Notify build failure (Discord webhook)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -eu
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL 미설정 — 실패 알림 스킵."
            exit 0
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          short_sha="${GITHUB_SHA::7}"
          content="$(printf '%s\n%s\n%s\n%s' \
            '🚨 **Discord Assistant 빌드 실패**' \
            "- 커밋: \`${short_sha}\`" \
            '- 단계: 이미지 빌드/푸시(GHCR)' \
            "- 로그: ${run_url}")"
          payload="$(printf '%s' "${content}" | python3 -c 'import json,sys; print(json.dumps({"content": sys.stdin.read()}))')"
          curl -sf -X POST -H "Content-Type: application/json" \
            -d "${payload}" "${DISCORD_WEBHOOK_URL}" >/dev/null \
            && echo "Discord 빌드 실패 알림 전송 완료." \
            || echo "::warning::Discord 빌드 실패 알림 전송에 실패했습니다."

  # #73 멀티 호스트 배포: 배포 타겟 목록을 동적으로 산출하는 준비 job.
  #   - repo Variable `DEPLOY_TARGETS`(JSON 배열)가 설정돼 있으면 그대로 사용한다.
  #     예) [{"labels":["self-hosted","macOS","ARM64"],"deploy_dir":"/Users/a/app"},
  #         {"labels":["self-hosted","Linux","X64"],"deploy_dir":"/srv/app"}]
  #   - 미설정 시: 단일 타겟(기존 동작과 동일)로 폴백한다.
  #       labels=[self-hosted, macOS, ARM64], deploy_dir=""(=runner $HOME/discord-assistant).
  #     이렇게 하면 단일 호스트 환경은 매트릭스 1개로 기존과 완전히 동일하게 동작.
  prepare-targets:
    needs: build-and-push
    runs-on: [self-hosted, macOS, ARM64]
    outputs:
      targets: ${{ steps.compute.outputs.targets }}
    steps:
      - name: Compute deploy targets
        id: compute
        env:
          # vars.DEPLOY_TARGETS 가 비어 있으면 기존 단일 호스트 기본값을 사용.
          DEPLOY_TARGETS_JSON: ${{ vars.DEPLOY_TARGETS }}
        run: |
          set -eu
          if [ -n "${DEPLOY_TARGETS_JSON:-}" ]; then
            # 사용자가 명시한 매트릭스를 그대로 사용(JSON 유효성은 fromJSON 단계에서 검증됨).
            targets="${DEPLOY_TARGETS_JSON}"
            echo "DEPLOY_TARGETS 사용(멀티 호스트 매트릭스):"
          else
            # 기본값: 기존과 동일한 단일 타겟.
            # deploy_dir 을 빈 문자열로 두면 배포 job 에서 vars.DEPLOY_DIR → $HOME/discord-assistant 로 폴백.
            targets='[{"labels":["self-hosted","macOS","ARM64"],"deploy_dir":""}]'
            echo "DEPLOY_TARGETS 미설정 — 기존 단일 호스트 기본 타겟으로 폴백:"
          fi
          # #114: JSON 형식뿐 아니라 labels/deploy_dir 의 의미 유효성도 검증한다.
          #   - labels: 비어 있지 않은 문자열 리스트이고 모두 허용 라벨 집합에 속해야 함
          #     (오타/미존재 라벨로 deploy job 이 무기한 큐잉되는 것을 방지).
          #   - deploy_dir: 빈 문자열이거나 허용 베이스 하위의 절대경로여야 함
          #     (임의 경로에 .env(시크릿)/compose 를 렌더하는 것을 방지). `..` 트래버설 금지.
          #   위반 시 명확한 에러로 실패시켜 안전하지 않은 매트릭스가 배포로 흘러가지 않게 한다.
          #   입력은 stdin 이 아닌 env(TARGETS_JSON)로 넘긴다(heredoc 스크립트와 stdin 충돌 방지).
          targets="$(TARGETS_JSON="${targets}" python3 -c '
          import json
          import os
          import sys

          ALLOWED_LABELS = {"self-hosted", "macOS", "ARM64", "Linux", "X64"}
          ALLOWED_DIR_BASES = ("/Users/", "/home/", "/srv/", "/opt/")


          def fail(msg):
              print("::error::DEPLOY_TARGETS 검증 실패: " + msg)
              sys.exit(1)


          try:
              data = json.loads(os.environ["TARGETS_JSON"])
          except Exception as exc:
              fail("JSON 파싱 불가: " + str(exc))

          if not isinstance(data, list) or not data:
              fail("최상위는 비어 있지 않은 배열이어야 합니다.")

          for idx, target in enumerate(data):
              if not isinstance(target, dict):
                  fail("target[%d] 은 객체여야 합니다." % idx)
              labels = target.get("labels")
              if not isinstance(labels, list) or not labels:
                  fail("target[%d].labels 는 비어 있지 않은 배열이어야 합니다." % idx)
              for label in labels:
                  if not isinstance(label, str) or label not in ALLOWED_LABELS:
                      fail("target[%d].labels 에 허용되지 않은 라벨: %r (허용: %s)"
                           % (idx, label, sorted(ALLOWED_LABELS)))
              deploy_dir = target.get("deploy_dir", "")
              if not isinstance(deploy_dir, str):
                  fail("target[%d].deploy_dir 은 문자열이어야 합니다." % idx)
              if deploy_dir:
                  if not deploy_dir.startswith("/"):
                      fail("target[%d].deploy_dir 은 절대경로여야 합니다: %r" % (idx, deploy_dir))
                  if ".." in deploy_dir.split("/"):
                      fail("target[%d].deploy_dir 에 \"..\" 트래버설은 금지됩니다: %r" % (idx, deploy_dir))
                  if not deploy_dir.startswith(ALLOWED_DIR_BASES):
                      fail("target[%d].deploy_dir 은 허용 베이스 하위여야 합니다: %r (허용 베이스: %s)"
                           % (idx, deploy_dir, list(ALLOWED_DIR_BASES)))

          print(json.dumps(data))
          ')"
          echo "${targets}"
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [build-and-push, prepare-targets]
    # 매트릭스의 타겟별 라벨로 러너를 선택. 단일 기본 타겟이면 [self-hosted, macOS, ARM64].
    runs-on: ${{ matrix.target.labels }}
    strategy:
      # 한 호스트가 실패해도 다른 호스트 배포는 계속 시도(단일 호스트면 영향 없음).
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare-targets.outputs.targets) }}
    permissions:
      contents: read
      packages: read
    env:
      # 타겟별 deploy_dir 우선 → 비어 있으면 repo Variable DEPLOY_DIR → (이후 스텝에서) $HOME/discord-assistant.
      DEPLOY_DIR: ${{ matrix.target.deploy_dir || vars.DEPLOY_DIR || '' }}
      COMPOSE_FILE: compose.prod.yml
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check deploy prerequisites
        run: |
          set -eu
          # Default the deploy dir to the runner user's home if not overridden
          DEPLOY_DIR="${DEPLOY_DIR:-$HOME/discord-assistant}"
          echo "DEPLOY_DIR=${DEPLOY_DIR}" >> "$GITHUB_ENV"
          install -d "${DEPLOY_DIR}" "${DEPLOY_DIR}/data" "${DEPLOY_DIR}/logs"
          command -v docker >/dev/null
          docker compose version >/dev/null

      - name: Render .env from ENV_FILE secret
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -eu
          if [ -z "${ENV_FILE:-}" ]; then
            echo "::error::ENV_FILE secret 이 비어 있습니다. Settings → Secrets and variables → Actions 에 .env 전체를 ENV_FILE 로 등록하세요."
            exit 1
          fi
          umask 077
          printf '%s\n' "${ENV_FILE}" > "${DEPLOY_DIR}/.env"
          chmod 600 "${DEPLOY_DIR}/.env"
          # Guard: refuse to deploy with the placeholder token still in place.
          if grep -qE '^DISCORD_BOT_TOKEN=(replace-with|$)' "${DEPLOY_DIR}/.env"; then
            echo "::error::ENV_FILE 의 DISCORD_BOT_TOKEN 이 실제 값이 아닙니다(placeholder). 시크릿을 실제 봇 토큰으로 갱신하세요."
            exit 1
          fi
          if ! grep -qE '^SECRET_KEY=.+' "${DEPLOY_DIR}/.env"; then
            echo "::error::ENV_FILE 에 SECRET_KEY 가 없습니다."
            exit 1
          fi
          # Guard: refuse to deploy with the placeholder SECRET_KEY still in place
          # (.env.prod.example 의 'replace-with-...' 값 또는 빈 값). 공개된 약한 키로
          # 기동되면 crypto._fernet_key 가 동일하게 재현돼 저장된 API 키가 복호화될 수 있다.
          if grep -qE '^SECRET_KEY=(replace-with|$)' "${DEPLOY_DIR}/.env"; then
            echo "::error::ENV_FILE 의 SECRET_KEY 가 실제 값이 아닙니다(placeholder). 시크릿을 강력한 무작위 값으로 갱신하세요."
            exit 1
          fi
          echo "rendered ${DEPLOY_DIR}/.env ($(grep -cE '^[A-Za-z_]+=' "${DEPLOY_DIR}/.env") keys)"

      - name: Sync compose file
        run: |
          set -eu
          install -m 644 "${COMPOSE_FILE}" "${DEPLOY_DIR}/${COMPOSE_FILE}"

      # #69: 배포 직전, 현재 실행 중인 컨테이너의 이미지 태그를 캡처(롤백 기준값).
      #      컨테이너가 없으면(첫 배포) 빈 값으로 두고 이후 롤백을 스킵한다.
      - name: Capture current image (rollback baseline)
        id: prev
        run: |
          set -eu
          # 현재 컨테이너의 이미지 태그를 docker inspect 로 읽는다.
          # 컨테이너가 없으면 docker inspect 가 실패하므로 빈 값으로 처리.
          if prev_image="$(docker inspect --format '{{.Config.Image}}' discord-assistant-bot 2>/dev/null)"; then
            echo "이전 이미지(롤백 기준값): ${prev_image}"
          else
            prev_image=""
            echo "실행 중인 컨테이너가 없습니다(첫 배포로 간주) — 롤백 기준값 없음"
          fi
          # 다음 스텝/롤백 스텝에서 사용할 수 있도록 출력과 환경에 저장.
          echo "prev_image=${prev_image}" >> "$GITHUB_OUTPUT"
          echo "PREV_IMAGE=${prev_image}" >> "$GITHUB_ENV"

      - name: Deploy (pull + up --wait)
        id: deploy
        run: |
          set -eu
          owner_lower="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          export BOT_IMAGE="${REGISTRY}/${owner_lower}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Deploying ${BOT_IMAGE}"
          # #110: 이 배포 직전 시각(UTC)을 캡처해 스모크테스트가 이 기동 이후
          #       로그만 보도록 한다. 컨테이너가 recreate 되지 않는 재배포에서
          #       과거 기동의 'Logged in as' 로 거짓 통과하는 것을 방지한다.
          start_ts="$(date -u +%Y-%m-%dT%H:%M:%S)"
          echo "start_ts=${start_ts}" >> "$GITHUB_OUTPUT"
          echo "배포 시작 시각(UTC, 스모크테스트 로그 기준점): ${start_ts}"
          cd "${DEPLOY_DIR}"
          for i in 1 2 3; do
            docker compose -f "${COMPOSE_FILE}" pull bot && break
            [ "$i" -eq 3 ] && { echo "::error::이미지 pull 3회 실패"; exit 1; }
            echo "pull 실패 (${i}/3), 30초 후 재시도..."; sleep 30
          done
          docker compose -f "${COMPOSE_FILE}" up -d --wait bot

      # #70: 봇 실제 기동 스모크테스트 + 기존 이미지 일치 검증.
      #      up --wait 가 healthcheck 까지 기다리지만, 추가로 봇이 Discord
      #      게이트웨이에 실제 로그인했는지("Logged in as") 로그로 확인한다.
      #      타임아웃 시 실패 → 이후 if failure() 롤백 스텝이 트리거된다.
      - name: Verify deployed image and bot login (smoke test)
        id: verify
        run: |
          set -eu
          owner_lower="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          expected="${REGISTRY}/${owner_lower}/${IMAGE_NAME}:${IMAGE_TAG}"
          actual="$(docker inspect --format '{{.Config.Image}}' discord-assistant-bot)"
          echo "expected=${expected}"
          echo "actual=${actual}"
          [ "${actual}" = "${expected}" ] || { echo "::error::배포된 이미지가 기대값과 다릅니다"; exit 1; }
          echo "이미지 일치 확인: ${actual}"

          # 스모크테스트: 90초 내에 봇이 'Logged in as' 를 로그에 남기는지 확인.
          # #110: 이 배포 시작 시각(steps.deploy.outputs.start_ts) 이후 로그만 본다.
          #       컨테이너가 recreate 되지 않은 재배포에서 과거 기동의 'Logged in as'
          #       로 거짓 통과하는 것을 막기 위해 --since 로 로그 윈도를 한정한다.
          since_ts="${{ steps.deploy.outputs.start_ts }}"
          echo "봇 기동 스모크테스트 시작(최대 90초, 'Logged in as' 대기, --since ${since_ts})..."
          deadline=$(( $(date +%s) + 90 ))
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            if docker logs --since "${since_ts}" discord-assistant-bot 2>&1 | grep -q "Logged in as"; then
              echo "스모크테스트 성공: 봇이 Discord 에 로그인했습니다."
              docker logs --since "${since_ts}" --tail 20 discord-assistant-bot 2>&1 || true
              exit 0
            fi
            sleep 5
          done
          echo "::error::스모크테스트 타임아웃: 90초 내에 'Logged in as' 로그를 찾지 못했습니다."
          echo "----- 최근 봇 로그(tail 50) -----"
          docker logs --since "${since_ts}" --tail 50 discord-assistant-bot 2>&1 || true
          exit 1

      # #68: 배포(pull + up --wait) 또는 검증 실패 시 자동 롤백.
      #      #69 에서 캡처한 직전 이미지로 BOT_IMAGE 를 지정해 재기동한다.
      #      직전 태그가 없으면(첫 배포) 스킵하고 명확히 로깅한다.
      - name: Rollback to previous image
        id: rollback
        if: failure()
        run: |
          set -eu
          if [ -z "${PREV_IMAGE:-}" ]; then
            echo "::warning::롤백할 직전 이미지가 없습니다(첫 배포로 추정). 롤백을 스킵합니다."
            exit 0
          fi
          echo "::warning::배포/검증 실패 — 직전 이미지로 롤백합니다: ${PREV_IMAGE}"
          cd "${DEPLOY_DIR}"
          export BOT_IMAGE="${PREV_IMAGE}"
          # 직전 이미지는 이미 로컬에 존재하므로 pull 없이 바로 재기동.
          docker compose -f "${COMPOSE_FILE}" up -d --wait bot
          actual="$(docker inspect --format '{{.Config.Image}}' discord-assistant-bot)"
          if [ "${actual}" = "${PREV_IMAGE}" ]; then
            echo "롤백 완료: ${actual}"
          else
            echo "::error::롤백 후 이미지가 기대값과 다릅니다(actual=${actual}, expected=${PREV_IMAGE})"
            exit 1
          fi

      # #71: 빌드/배포/롤백 실패 시 Discord 웹훅으로 알림 전송.
      #      DISCORD_WEBHOOK_URL 시크릿이 미설정이면 스킵한다.
      - name: Notify failure (Discord webhook)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
        run: |
          set -eu
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL 미설정 — 실패 알림 스킵."
            exit 0
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # 롤백 결과를 알림 본문에 반영.
          case "${ROLLBACK_OUTCOME:-}" in
            success) rollback_line="롤백: 직전 이미지(${PREV_IMAGE:-?})로 복구 성공" ;;
            failure) rollback_line="롤백: 시도했으나 실패 — 수동 조치 필요" ;;
            *)       rollback_line="롤백: 미수행(직전 이미지 없음 또는 스킵)" ;;
          esac
          short_sha="${GITHUB_SHA::7}"
          content="$(printf '%s\n%s\n%s\n%s' \
            '🚨 **Discord Assistant 배포 실패**' \
            "- 커밋: \`${short_sha}\` (태그 \`${IMAGE_TAG}\`)" \
            "- ${rollback_line}" \
            "- 로그: ${run_url}")"
          payload="$(printf '%s' "${content}" | python3 -c 'import json,sys; print(json.dumps({"content": sys.stdin.read()}))')"
          curl -sf -X POST -H "Content-Type: application/json" \
            -d "${payload}" "${DISCORD_WEBHOOK_URL}" >/dev/null \
            && echo "Discord 실패 알림 전송 완료." \
            || echo "::warning::Discord 실패 알림 전송에 실패했습니다."

      - name: Prune dangling images
        if: always()
        run: docker image prune -f --filter "until=168h" || true
