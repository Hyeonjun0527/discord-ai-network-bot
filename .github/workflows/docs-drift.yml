# 문서 ↔ 코드 드리프트 검증(#100): README 의 슬래시 명령 목록이 bot.py 에 실제
# 등록된 명령 집합과 동기화되어 있는지 대조한다. 봇에 명령을 추가하고 문서를
# 갱신하지 않으면(또는 그 반대) 빌드에서 실패시킨다.
#
# 코드 기준(SSOT):
#   - 최상위 명령:  @bot.tree.command(name="...")        → "/<name>"
#   - config 하위:  @config_group.command(name="...")     → "/config <sub>"
#
# 문서 파싱:
#   README.md / README_EN.md 의 마크다운 표에서 첫 셀이 `/...` 인 행만 본다.
#   (경로/URL 같은 `/bin`, `/localhost` 등 오탐을 피하기 위해 표 셀로 한정.)
#
# 실패 조건: 봇에 등록된 명령이 README.md 에 문서화되어 있지 않을 때.
# README_EN.md 는 존재하면 함께 검사하고, 없으면 건너뛴다.
name: docs drift check

on:
  push:
    paths:
      - "README.md"
      - "README_EN.md"
      - "src/discord_assistant/bot.py"
      - ".github/workflows/docs-drift.yml"
  pull_request:
    paths:
      - "README.md"
      - "README_EN.md"
      - "src/discord_assistant/bot.py"
      - ".github/workflows/docs-drift.yml"
  workflow_dispatch:

jobs:
  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify README command list matches bot.py
        run: |
          python - <<'PY'
          import re
          import sys
          import pathlib

          ROOT = pathlib.Path(".")
          BOT = (ROOT / "src" / "discord_assistant" / "bot.py").read_text(encoding="utf-8")

          # --- 코드(SSOT): 봇에 실제 등록된 명령 집합 ---
          top = set(re.findall(r'@bot\.tree\.command\(\s*name="([a-z0-9-]+)"', BOT))
          grp = set(re.findall(r'@config_group\.command\(\s*name="([a-z0-9_]+)"', BOT))
          group_match = re.search(r'app_commands\.Group\(\s*name="([a-z0-9_]+)"', BOT)
          group_name = group_match.group(1) if group_match else "config"

          bot_cmds = {f"/{name}" for name in top}
          bot_cmds |= {f"/{group_name} {sub}" for sub in grp}

          if not bot_cmds:
              print("::error::bot.py 에서 명령을 하나도 찾지 못했습니다. 정규식 점검 필요.")
              sys.exit(1)

          # README 동기화가 아직 안 된 알려진 명령(부채 추적용 허용 목록).
          # 해당 명령을 README 표에 문서화하면 이 목록에서 제거할 것. 비워두는 것이 목표다.
          # (새로 추가되는 명령은 이 목록에 없으므로 문서화 누락 시 정상적으로 실패한다.)
          KNOWN_UNDOCUMENTED = {
              "/reminders",   # #3 예약 알림 목록/취소 — README 표 추가 대기
              "/forget-me",   # 대화 기록 삭제 — README 표 추가 대기
          }

          # --- 문서: 마크다운 표의 명령 셀 파싱 ---
          CELL_RE = re.compile(r"`(/[a-z][a-z0-9_-]*(?: [a-z0-9_]+)?)")

          def doc_cmds(path: pathlib.Path) -> set[str]:
              found: set[str] = set()
              for raw in path.read_text(encoding="utf-8").splitlines():
                  line = raw.strip()
                  if not line.startswith("|"):
                      continue
                  # 표의 첫 데이터 셀만 검사한다.
                  first_cell = line.split("|")[1] if len(line.split("|")) > 1 else ""
                  for token in CELL_RE.findall(first_cell):
                      parts = token.split()
                      if parts[0] == f"/{group_name}" and len(parts) >= 2:
                          found.add(f"/{group_name} {parts[1]}")
                      else:
                          found.add(parts[0])
              return found

          failed = False
          checked_any = False
          for name in ("README.md", "README_EN.md"):
              path = ROOT / name
              if not path.exists():
                  if name == "README.md":
                      print("::error::README.md 가 없습니다.")
                      failed = True
                  continue
              checked_any = True
              documented = doc_cmds(path)
              missing = sorted(bot_cmds - documented - KNOWN_UNDOCUMENTED)
              pending = sorted((bot_cmds - documented) & KNOWN_UNDOCUMENTED)
              print(f"--- {name}: 코드 {len(bot_cmds)}개 / 문서 {len(documented)}개 ---")
              if pending:
                  print(f"::warning::{name} 문서화 대기(허용 목록): " + ", ".join(pending))
              if missing:
                  print(f"::error::{name} 에 누락된 명령(코드엔 있으나 문서화 안 됨): "
                        + ", ".join(missing)
                        + " (README 표에 추가하거나, 의도적이라면 KNOWN_UNDOCUMENTED 에 등록하세요.)")
                  failed = True

          if not checked_any:
              print("::error::검사할 README 를 찾지 못했습니다.")
              failed = True

          if failed:
              sys.exit(1)
          print(f"OK: README 가 bot.py 의 명령 {len(bot_cmds)}개와 동기화되어 있습니다.")
          PY
