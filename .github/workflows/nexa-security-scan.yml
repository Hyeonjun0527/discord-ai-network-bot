# NEXA-P17-T021 — dependency·container 보안 scan(Gradle/Python/container).
#
# critical/high 취약점은 docs/nexa/security/scan-exceptions.yaml 에 만료일·소유자·근거 있는 예외로만 임시 허용된다
# (validate-nexa-scan-exceptions.py 가 게이트). 무기한·무기명 예외는 검증 단계에서 실패한다(acceptance T021).
name: NEXA security scan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    paths:
      - "central-server/**"
      - "ml/social-policy/**"
      - "provider-agent/**"
      - "docs/nexa/security/scan-exceptions.yaml"
      - ".github/workflows/nexa-security-scan.yml"
  schedule:
    # 신규 advisory 를 잡기 위해 주간 재스캔(코드 변경 없어도 새 CVE 가 뜰 수 있음).
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 예외 레지스트리 게이트 — 무기한·무기명·과거 만료 예외를 먼저 실패시킨다(scan 결과 해석의 전제).
  exception-policy:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: [self-hosted, yeon-arm]
    steps:
      - uses: actions/checkout@v4
      # self-hosted arm64(Debian)에는 setup-python prebuilt 가 없어 실패한다.
      # uv 가 python-build-standalone arm64 Linux prebuilt 로 3.12 를 보장한다(arch·tool-cache 무관).
      # activate-environment=true 로 .venv 를 만들어 활성화 → 이후 uv pip / uv run 이 그 3.12 venv 사용.
      - name: uv 설치(self-hosted arm64 python 3.12 보장)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          activate-environment: true
      - name: scan 예외 정책 검증(만료일·소유자·근거 필수)
        run: |
          uv pip install pyyaml
          uv run python scripts/validate-nexa-scan-exceptions.py

  # Gradle 의존성 취약점(central-server). OWASP dependency-check Gradle 플러그인이 없다면 표준 의존성 보고로 대체.
  gradle-deps:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: [self-hosted, yeon-arm]
    needs: exception-policy
    defaults:
      run:
        working-directory: central-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle 의존성 목록(취약점 분석 입력)
        run: ./gradlew dependencies --no-daemon --console=plain || true
      - name: Trivy fs scan(Gradle 의존성 CVE)
        # v0.28.0 은 내부적으로 yank 된 aquasecurity/setup-trivy@v0.2.1 을 참조해 더 이상 resolve 되지 않는다
        # ("Unable to resolve action setup-trivy@v0.2.1"). v0.36.0 은 setup-trivy 를 commit SHA(v0.2.6)로 핀해
        # 태그 삭제에 영향받지 않는다(번들 trivy v0.70.0). severity/exit-code/ignore-unfixed 등 게이트는 불변.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: central-server
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # Python 의존성 취약점(ml/social-policy, provider-agent).
  python-deps:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: [self-hosted, yeon-arm]
    needs: exception-policy
    steps:
      - uses: actions/checkout@v4
      # self-hosted arm64(Debian)에는 setup-python prebuilt 가 없어 실패한다.
      # uv 가 arm64 Linux prebuilt 로 3.12 를 보장(arch·tool-cache 무관). UV_PYTHON=3.12 가 설정되어
      # uvx 가 띄우는 pip-audit 도 3.12 런타임에서 동작한다(venv 불필요 — uvx 격리 실행).
      - name: uv 설치(self-hosted arm64 python 3.12 보장)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # pip-audit 는 critical/high CVE 에서 **실패**해야 한다(M4 — `|| true` 비차단 제거). 임시 허용은
      # docs/nexa/security/scan-exceptions.yaml 의 만료일·소유자·근거 있는 예외(T021 거버넌스)로만 한다.
      - name: pip-audit(ml/social-policy 의존성 CVE — 차단)
        run: |
          # --desc 는 {on,off,auto} 값을 받는 옵션이므로 프로젝트 경로는 별도 positional 로 넘긴다.
          # (`--desc ./path` 형태는 경로가 --desc 값으로 먹혀 argparse 가 exit 2 로 실패한다.)
          # uvx = uv tool 일회 실행(설치 불필요), UV_PYTHON=3.12 런타임 보장.
          uvx pip-audit --strict --desc on ./ml/social-policy
      - name: pip-audit(provider-agent 의존성 CVE — 차단)
        run: uvx pip-audit --strict --desc on ./provider-agent

  # 로그 redaction 스캔(NEXA-P17-T013) — central-server 테스트가 prod 프로파일로 파일 로그를 남기게 하고,
  # scan-sensitive-logs.py 로 그 로그에 snowflake·API key·Bearer 토큰이 한 건도 없는지 검사한다(있으면 실패).
  # 이로써 redactor 바인딩(logback-spring.xml %redactedMsg)이 실제 파일 출력에서 작동함을 CI 가 강제한다.
  log-redaction-scan:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: [self-hosted, yeon-arm]
    needs: exception-policy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # java(setup-java)·gradle 은 그대로(정상). python 만 uv 로 교체 — self-hosted arm64 에 setup-python
      # prebuilt 가 없어 실패하므로, 마지막 스캔 스크립트를 uv 보장 3.12 venv 에서 실행한다.
      - name: uv 설치(self-hosted arm64 python 3.12 보장)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          activate-environment: true
      - name: central-server 테스트 실행(prod 프로파일 파일 로그 생성)
        working-directory: central-server
        env:
          SPRING_PROFILES_ACTIVE: prod
          LOG_DIR: ${{ github.workspace }}/central-server/logs
        run: ./gradlew test --no-daemon --console=plain
      - name: 로그 금지 문자열 스캔(snowflake/API key/Bearer 토큰 0건 강제)
        run: |
          shopt -s nullglob
          logs=(central-server/logs/*.log central-server/logs/*.log.gz)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "스캔할 로그 파일 없음(파일 appender 미생성) — 스킵"
            exit 0
          fi
          # .gz 도 펼쳐서 스캔.
          for f in central-server/logs/*.log.gz; do [ -e "$f" ] && gunzip -kf "$f"; done
          uv run python scripts/scan-sensitive-logs.py central-server/logs/*.log

  # 컨테이너 이미지 취약점(빌드한 이미지 파일시스템·OS 패키지).
  container-scan:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: [self-hosted, yeon-arm]
    needs: exception-policy
    strategy:
      matrix:
        image:
          - central-server/Dockerfile
          - provider-agent/Dockerfile
          - docker/rag/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config scan(Dockerfile 취약 설정·베이스 이미지)
        # v0.28.0 은 yank 된 setup-trivy@v0.2.1 참조로 resolve 실패. v0.36.0 은 setup-trivy 를 commit SHA(v0.2.6)로
        # 핀해 안정적이다(번들 trivy v0.70.0). scan-type/severity/exit-code 게이트는 그대로 유지.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.image }}
          severity: HIGH,CRITICAL
          exit-code: "1"
