# Provider Agent 정적 분석 + 테스트 CI (차수 17 #255). + 문서 링크 검증(#266).
name: provider-agent CI

on:
  push:
    paths:
      - "provider-agent/**"
      - "packaging/**"
      - "i18n/**"
      - "docs/**"
      - "specs/**"
      - "scripts/check_links.py"
      - "scripts/check_packaging.py"
      - "scripts/gen_i18n.py"
      - ".github/workflows/provider-agent-ci.yml"
  pull_request:
    paths:
      - "provider-agent/**"
      - "packaging/**"
      - "i18n/**"
      - "docs/**"
      - "specs/**"
      - "scripts/check_links.py"
      - "scripts/check_packaging.py"
      - "scripts/gen_i18n.py"
      - ".github/workflows/provider-agent-ci.yml"
  workflow_dispatch:

jobs:
  agent:
    runs-on: [self-hosted, yeon-arm]
    defaults:
      run:
        working-directory: provider-agent
    steps:
      - uses: actions/checkout@v4
      # self-hosted arm64(Debian)에는 setup-python prebuilt 가 없어 실패한다.
      # uv 가 arm64 Linux prebuilt 로 3.12 를 보장(arch·tool-cache 무관). activate-environment=true 로
      # .venv 를 만들어 활성화 → 이후 uv pip install / uv run 이 그 3.12 venv 에서 동작.
      - name: uv 설치(self-hosted arm64 python 3.12 보장)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          activate-environment: true
      - run: uv pip install -e ".[dev]"
      - name: ruff (정적 분석)
        run: uv run python -m ruff check src tests
      - name: mypy (타입 검사)
        run: uv run python -m mypy src
      - name: pytest + 커버리지 게이트(#254)
        run: uv run python -m pytest -q --cov=provider_agent --cov-fail-under=70

  docs-links:
    runs-on: [self-hosted, yeon-arm]
    steps:
      - uses: actions/checkout@v4
      # self-hosted arm64(Debian)에는 setup-python prebuilt 가 없어 실패한다.
      # uv 가 arm64 Linux prebuilt 로 3.12 를 보장(arch·tool-cache 무관). activate-environment=true 로
      # .venv 를 만들어 활성화 → 이후 uv run 이 그 3.12 venv 에서 동작.
      - name: uv 설치(self-hosted arm64 python 3.12 보장)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          activate-environment: true
      - name: 상대 링크 검증
        run: uv run python scripts/check_links.py
      - name: 패키지 자산명 SSOT 드리프트 검사
        run: uv run python scripts/check_packaging.py
      - name: 문구 i18n SSOT 동기/완전성 검사(ko/en/ja)
        run: uv run python scripts/gen_i18n.py --check
