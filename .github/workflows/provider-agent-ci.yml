# Provider Agent 정적 분석 + 테스트 CI (차수 17 #255).
name: provider-agent CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    paths:
      - "provider-agent/**"
      - ".github/workflows/provider-agent-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: [self-hosted, Linux, X64, discord-ci-amd64]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: provider-agent
    steps:
      - uses: actions/checkout@v4
      # self-hosted AMD64 runner 에서 OS별 setup-python tool-cache 차이를 피한다.
      # uv 가 3.12 런타임을 보장한다(arch·tool-cache 무관).
      # setup-uv 에 python-version 을 주면 repo root 에 .venv·VIRTUAL_ENV 를 깔아, working-directory(provider-agent)
      # 의 .venv 와 충돌한다(uv pip 는 root, uv run 은 cwd .venv → 'No module named ruff'). 그래서 uv 바이너리만
      # 설치하고, python 3.12 는 아래 uv venv 가 cwd(provider-agent)에 받게 한다 — 단일 .venv 로 pip/run 일치.
      - name: uv 설치(바이너리만 — python 은 uv venv 가 cwd 에 받는다)
        uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"
      - name: ruff (정적 분석)
        run: uv run python -m ruff check src tests
      - name: mypy (타입 검사)
        run: uv run python -m mypy src
      - name: pytest + 커버리지 게이트(#254)
        run: uv run python -m pytest -q --cov=provider_agent --cov-fail-under=70
