# Provider Agent 정적 분석 + 테스트 CI (차수 17 #255). + 문서 링크 검증(#266).
name: provider-agent CI

on:
  push:
    paths:
      - "provider-agent/**"
      - "packaging/**"
      - "i18n/**"
      - "docs/**"
      - "specs/**"
      - "scripts/check_links.py"
      - "scripts/check_packaging.py"
      - "scripts/gen_i18n.py"
      - ".github/workflows/provider-agent-ci.yml"
  pull_request:
    paths:
      - "provider-agent/**"
      - "packaging/**"
      - "i18n/**"
      - "docs/**"
      - "specs/**"
      - "scripts/check_links.py"
      - "scripts/check_packaging.py"
      - "scripts/gen_i18n.py"
      - ".github/workflows/provider-agent-ci.yml"
  workflow_dispatch:

jobs:
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: provider-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: ruff (정적 분석)
        run: python -m ruff check src tests
      - name: mypy (타입 검사)
        run: python -m mypy src
      - name: pytest + 커버리지 게이트(#254)
        run: python -m pytest -q --cov=provider_agent --cov-fail-under=70

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 상대 링크 검증
        run: python3 scripts/check_links.py
      - name: 패키지 자산명 SSOT 드리프트 검사
        run: python3 scripts/check_packaging.py
      - name: 문구 i18n SSOT 동기/완전성 검사(ko/en/ja)
        run: python3 scripts/gen_i18n.py --check
