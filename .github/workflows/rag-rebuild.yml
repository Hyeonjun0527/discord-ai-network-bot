name: AI Network RAG index rebuild

on:
  push:
    branches: [main]
    paths:
      - 'docs/plans/ai-network/**'
      - 'docs/**/*.md'
      - 'rag/**'
      - 'docker/rag/Dockerfile'
      - 'docker-compose.qdrant.yml'
      - 'scripts/rag.sh'
      - '.github/workflows/rag-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-network-rag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    name: Rebuild AI Network RAG index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: pip install -r rag/requirements-build.txt

      - name: Rebuild local metadata index
        run: scripts/rag.sh build-local

      - name: Commit generated metadata index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rag/bm25/corpus.jsonl rag/meta.db
          if git diff --staged --quiet; then
            echo "RAG index unchanged"
          else
            git commit -m "chore: rebuild AI network RAG index [skip ci]"
            git push
          fi
