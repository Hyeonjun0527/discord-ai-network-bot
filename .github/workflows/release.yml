name: Release

# Create a GitHub Release when a SemVer tag is pushed, or on manual dispatch.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스할 태그 (예: v0.2.0). 없으면 가장 최근 v*.*.* 태그 사용."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)"
          fi
          [ -n "${tag}" ] || { echo "::error::릴리스할 태그를 찾을 수 없습니다."; exit 1; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "릴리스 ${tag} 가 이미 존재합니다. 스킵."
            exit 0
          fi
          gh release create "${tag}" \
            --title "discord-assistant ${tag}" \
            --generate-notes \
            --verify-tag
