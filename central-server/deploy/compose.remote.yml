# 원격(linuxssh.dailyting.cloud) 배포용 compose. GHCR 이미지를 pull 해서 실행한다(빌드는 CI 에서).
# CI 가 같은 디렉터리에 ENV_FILE 기반 .env 를 렌더링(CENTRAL_IMAGE/CENTRAL_DB_PASSWORD/DISCORD_* )한 뒤
#   docker compose --env-file .env -f compose.yml up -d 로 띄운다.
# 프로젝트명 central-server 로 격리 — 같은 호스트의 dailyting 서비스들과 충돌하지 않는다.
name: central-server

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: central
      POSTGRES_USER: central
      POSTGRES_PASSWORD: ${CENTRAL_DB_PASSWORD:?CENTRAL_DB_PASSWORD 필요}
    volumes:
      - central-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central -d central"]
      interval: 5s
      timeout: 3s
      retries: 12

  central-server:
    image: ${CENTRAL_IMAGE:?CENTRAL_IMAGE 필요(ghcr.io/owner/central-server:tag)}
    container_name: central-server # cloudflared 가 컨테이너명으로 라우팅(http://central-server:8085)
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/central
      DB_USER: central
      DB_PASSWORD: ${CENTRAL_DB_PASSWORD:?}
      # 토큰 없으면 Discord 만 비활성(서버는 기동) — 인프라 검증/단계적 활성에 유리.
      DISCORD_ENABLED: ${DISCORD_ENABLED:-true}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:-wss://discord-ai.yeon.world/agent}
      SERVER_PORT: ${SERVER_PORT:-8085}
      CENTRAL_DEV_ENABLED: "false"
      # durable 프로바이더 토큰 서명 시크릿(설정 시 재연결·재시작 재사용 토큰 활성). 배포 스크립트가 고정 생성.
      CENTRAL_DURABLE_SECRET: ${CENTRAL_DURABLE_SECRET:-}
      # 웹검색 백엔드(SearXNG, 같은 네트워크). 죽어도 web 검색은 graceful 폴백 → 봇 영향 없음.
      CENTRAL_SEARCH_URL: ${CENTRAL_SEARCH_URL:-http://searxng:8080}
      CENTRAL_SEARCH_MAX_RESULTS: ${CENTRAL_SEARCH_MAX_RESULTS:-5}
      CENTRAL_SEARCH_FETCH_CONTENT: ${CENTRAL_SEARCH_FETCH_CONTENT:-true}
      # z.ai(GLM) 클라우드 키 — /무료질문·NEXA speech 발화 생성(ADR 0006, cloud.zai-api-key SSOT).
      # 비면 fail-closed: GLM 직접 생성 비활성(봇 기동엔 무관). 값은 ENV_FILE(.env) 의 ZAI_API_KEY 로 주입.
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      # 빠른 채팅/무료질문/니아 speech 기본 모델. ENV_FILE 이 오버라이드하지 않으면 운영도 AirX 로 고정한다.
      ZAI_FREE_MODEL: ${ZAI_FREE_MODEL:-glm-4.5-airx}
      ZAI_FAST_MODEL: ${ZAI_FAST_MODEL:-glm-4.5-airx}
      NEXA_SPEECH_MODEL: ${NEXA_SPEECH_MODEL:-glm-4.5-airx}
      # 클라우드 이미지 생성(/그림) — Stability AI. 키 비면 비활성(provider-agent ComfyUI 폴백).
      # 모델은 코드 enum(StabilityModel) SSOT — 주입 키 없음.
      # 안전심사는 ZAI(GLM) 활성 전제(AskCommandHandler.imagine fail-closed). 값은 ENV_FILE(.env) 주입.
      STABILITY_API_KEY: ${STABILITY_API_KEY:-}
      # 웹 ‘토큰 받기’ Discord OAuth(설정 시 활성, 비면 503 안내 → 복붙 폴백). 시크릿은 ENV_FILE 주입.
      CONNECT_DISCORD_CLIENT_ID: ${CONNECT_DISCORD_CLIENT_ID:-}
      CONNECT_DISCORD_CLIENT_SECRET: ${CONNECT_DISCORD_CLIENT_SECRET:-}
      CONNECT_PUBLIC_BASE_URL: ${CONNECT_PUBLIC_BASE_URL:-https://discord-ai.yeon.world}
      # 대시보드 관리자 Discord 로그인(B안). true + 허용목록 설정 시 /dashboard/ 가 로그인·관리자 제한.
      # 위 CONNECT_DISCORD_CLIENT_ID/SECRET(같은 OAuth 앱) 재사용 — 앱에 redirect URI
      # <공개주소>/login/oauth2/code/discord 추가 등록 필요. user-id 는 콤마 구분.
      CENTRAL_OAUTH_ENABLED: ${CENTRAL_OAUTH_ENABLED:-false}
      CENTRAL_DASHBOARD_ADMIN_USER_IDS: ${CENTRAL_DASHBOARD_ADMIN_USER_IDS:-}
      CENTRAL_DASHBOARD_ADMIN_TOKEN: ${CENTRAL_DASHBOARD_ADMIN_TOKEN:-}
      # NEXA participation 글로벌 기본 lane. LIVE = 모든(+미래) 길드가 길드별 설정 없이도 자발발화를 **실제 Discord
      # 로 전송**(allowsRealSend=true). 과발화·토큰 폭주는 NexaParticipationEmitBridge 의 rate limit 안전망(채널별
      # central.nexa.participation.rate-limit.per-channel-per-min 기본 6 + 전역 global-per-min 기본 30, 분당)이
      # emit(GLM 발화) 호출 직전 이중 게이트로 막는다(한도 초과 시 토큰 0). 길드가 명시적으로 다른 lane 을 가지면 그게
      # 우선. 코드 기본값(@Value)은 OFF 라 테스트/로컬은 회귀 0 — 실서버만 이 줄로 LIVE 활성.
      CENTRAL_NEXA_PARTICIPATION_GLOBAL_DEFAULT_LANE: LIVE
    networks:
      default: {}
      yeon-edge:
        aliases:
          - discord-yeon-world
    volumes:
      # 에이전트 단일 실행파일 서빙(/download/**). agent-build 가 이 폴더에 바이너리 배치.
      - ./downloads:/app/downloads:ro
    # 호스트 로컬 바인딩(헬스/디버그용). 공개는 Cloudflare Tunnel → http://central-server:8085.
    ports:
      - "127.0.0.1:8085:8085"

  # 웹검색 백엔드(SearXNG, JSON API). 외부 검색 API 키 불필요·자체 호스팅.
  # settings.yml 은 배포 스크립트(central-deploy.yml)가 JSON 포맷·시크릿을 채워 생성한다.
  # 공개 포트 없음(중앙 서버만 내부망에서 http://searxng:8080 으로 접근).
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080/"
    volumes:
      - ./searxng:/etc/searxng:rw

networks:
  # yeon 스택의 외부 네트워크(yeon-cloudflared-1 과 공유). 컨테이너명/alias 로 터널 라우팅.
  yeon-edge:
    external: true

volumes:
  central-db:
