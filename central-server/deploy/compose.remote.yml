# 원격(ssh.yeon.world) 배포용 compose. GHCR 이미지를 pull 해서 실행한다(빌드는 CI 에서).
# 운영 값은 GitHub production Environment에서만 주입한다. 민감 값은 Docker Compose secret으로 전달하고,
# Spring Boot는 configtree:/run/secrets/ 에서 읽는다. 운영 호스트의 .env는 사용하지 않는다.
# 프로젝트명 central-server 로 격리 — 같은 호스트의 dailyting 서비스들과 충돌하지 않는다.
name: central-server

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: central
      POSTGRES_USER: central
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PASSWORD
    secrets:
      - DB_PASSWORD
    volumes:
      - central-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central -d central"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  central-server:
    image: ${CENTRAL_IMAGE:?CENTRAL_IMAGE 필요(ghcr.io/owner/central-server:tag)}
    container_name: central-server # cloudflared 가 컨테이너명으로 라우팅(http://central-server:8085)
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      DB_URL: jdbc:postgresql://db:5432/central
      DB_USER: central
      DB_PASSWORD_FILE: /run/secrets/spring.datasource.password
      DISCORD_ENABLED_FILE: /run/secrets/central.discord.enabled
      DISCORD_BOT_TOKEN_FILE: /run/secrets/central.discord.bot-token
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      RELAY_PUBLIC_URL_FILE: /run/secrets/central.relay.public-url
      SERVER_PORT: ${SERVER_PORT:-8085}
      CENTRAL_DEV_ENABLED: "false"
      CENTRAL_DURABLE_SECRET_FILE: /run/secrets/central.durable.secret
      NEXA_FIELD_ENC_KEY_FILE: /run/secrets/nexa.field-enc-key
      NEXA_AUTONOMOUS_SEND_ENABLED: "true"
      CENTRAL_NEXA_EXECUTION_PERMIT_REDIS_ENABLED: "true"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # 웹검색 백엔드(SearXNG, 같은 네트워크). 죽어도 web 검색은 graceful 폴백 → 봇 영향 없음.
      CENTRAL_SEARCH_URL: ${CENTRAL_SEARCH_URL:-http://searxng:8080}
      CENTRAL_SEARCH_MAX_RESULTS: ${CENTRAL_SEARCH_MAX_RESULTS:-5}
      CENTRAL_SEARCH_FETCH_CONTENT: ${CENTRAL_SEARCH_FETCH_CONTENT:-true}
      # OpenAI 클라우드 키 — GitHub Environment Secret → Docker secret → Spring configtree.
      OPENAI_API_KEY_FILE: /run/secrets/central.cloud.openai-api-key
      # 빠른 채팅/무료질문/니아 speech 기본 모델.
      OPENAI_FREE_MODEL: ${OPENAI_FREE_MODEL:-gpt-5.6-luna}
      OPENAI_FAST_MODEL: ${OPENAI_FAST_MODEL:-gpt-5.6-luna}
      # provider 내부 중첩 재시도는 끈다. Judge/Speech가 실패 시 각각 한 번만 재시도한다.
      OPENAI_LLM_MAX_RETRIES: "0"
      # Judge의 고정 지시와 active few-shot prefix만 캐시한다. raw scene/RAG/상태는 breakpoint 뒤라
      # 매 요청 새로 전달되고, active few-shot이 바뀌면 prefix hash도 바뀐다. 운영 환경변수로 즉시 OFF
      # 할 수 있고, 짧은 speech prefix는 기본 비활성으로 둔다.
      OPENAI_PROMPT_CACHE_NIA_JUDGE_ENABLED: ${OPENAI_PROMPT_CACHE_NIA_JUDGE_ENABLED:-true}
      OPENAI_PROMPT_CACHE_NIA_SPEECH_ENABLED: ${OPENAI_PROMPT_CACHE_NIA_SPEECH_ENABLED:-false}
      NEXA_SPEECH_MODEL: ${NEXA_SPEECH_MODEL:-gpt-5.6-luna}
      NEXA_PARTICIPATION_JUDGE_MODEL: ${NEXA_PARTICIPATION_JUDGE_MODEL:-gpt-5.6-luna}
      # 비용 최적화는 서로 독립적으로 즉시 롤백할 수 있다. rawScene 압축은 입력 schema/prompt version으로
      # 기존 캐시와 분리되고, 아래 세 스위치는 다음 요청부터 각 경로만 끈다.
      NEXA_PARTICIPATION_JUDGE_STRUCTURED_OUTPUT_ENABLED: ${NEXA_PARTICIPATION_JUDGE_STRUCTURED_OUTPUT_ENABLED:-true}
      NEXA_PARTICIPATION_TURN_BOUNDARY_ENABLED: ${NEXA_PARTICIPATION_TURN_BOUNDARY_ENABLED:-true}
      DISCORD_TYPING_INTENT_ENABLED: ${DISCORD_TYPING_INTENT_ENABLED:-true}
      # 클라우드 이미지 생성(/그림)은 현재 운영 secret-file 계약에 Stability 키가 없어 비활성이다.
      # 필요하면 평문 env를 복구하지 말고 production Environment + configtree target을 함께 추가한다.
      # 안전심사는 OpenAI 활성 전제(AskCommandHandler.imagine fail-closed).
      # 웹 ‘토큰 받기’ Discord OAuth. client-id는 설정값, client-secret은 Docker secret으로 주입한다.
      CONNECT_DISCORD_CLIENT_ID_FILE: /run/secrets/central.connect.discord-client-id
      CONNECT_DISCORD_CLIENT_SECRET_FILE: /run/secrets/central.connect.discord-client-secret
      CONNECT_PUBLIC_BASE_URL: ${CONNECT_PUBLIC_BASE_URL:-https://discord-ai.yeon.world}
      # 대시보드 관리자 Discord 로그인(B안). true + 허용목록 설정 시 /dashboard/ 가 로그인·관리자 제한.
      # 위 CONNECT_DISCORD_CLIENT_ID/SECRET(같은 OAuth 앱) 재사용 — 앱에 redirect URI
      # <공개주소>/login/oauth2/code/discord 추가 등록 필요. user-id 는 콤마 구분.
      CENTRAL_OAUTH_ENABLED_FILE: /run/secrets/central.oauth.enabled
      CENTRAL_DASHBOARD_ADMIN_USER_IDS_FILE: /run/secrets/central.dashboard.admin-user-ids
      CENTRAL_METRICS_SCRAPE_TOKEN_FILE: /run/secrets/central.metrics.scrape-token
      # NEXA participation 글로벌 기본 lane. LIVE = 모든(+미래) 길드가 길드별 설정 없이도 자발발화를 **실제 Discord
      # 로 전송**(allowsRealSend=true). 채널별 6/분·전역 30/분 execution permit은 실제 SEND/REACT를 hard cap하지만,
      # 그 전에 끝난 judge/speech 호출 비용까지 되돌리지는 않는다. 이 비용은 central_openai_* 목적별 지표로 별도 관측한다.
      # 길드가 명시적으로 다른 lane 을 가지면 그게 우선. 코드 기본값(@Value)은 OFF 라 테스트/로컬은 회귀 0 —
      # 실서버만 이 줄로 LIVE 활성.
      CENTRAL_NEXA_PARTICIPATION_GLOBAL_DEFAULT_LANE: LIVE
    secrets:
      - source: DB_PASSWORD
        target: spring.datasource.password
      - source: DISCORD_ENABLED
        target: central.discord.enabled
      - source: DISCORD_BOT_TOKEN
        target: central.discord.bot-token
      - source: RELAY_PUBLIC_URL
        target: central.relay.public-url
      - source: CENTRAL_DURABLE_SECRET
        target: central.durable.secret
      - source: NEXA_FIELD_ENC_KEY
        target: nexa.field-enc-key
      - source: OPENAI_API_KEY
        target: central.cloud.openai-api-key
      - source: CONNECT_DISCORD_CLIENT_ID
        target: central.connect.discord-client-id
      - source: CONNECT_DISCORD_CLIENT_SECRET
        target: central.connect.discord-client-secret
      - source: CENTRAL_OAUTH_ENABLED
        target: central.oauth.enabled
      - source: CENTRAL_DASHBOARD_ADMIN_USER_IDS
        target: central.dashboard.admin-user-ids
      - source: METRICS_SCRAPE_TOKEN
        target: central.metrics.scrape-token
    networks:
      default: {}
      yeon-edge:
        aliases:
          - discord-yeon-world
    volumes:
      # 에이전트 단일 실행파일 서빙(/download/**). agent-build 가 이 폴더에 바이너리 배치.
      - ./downloads:/app/downloads:ro
    # 호스트 로컬 바인딩(헬스/디버그용). 공개는 Cloudflare Tunnel → http://central-server:8085.
    ports:
      - "127.0.0.1:8085:8085"

  # 웹검색 백엔드(SearXNG, JSON API). 외부 검색 API 키 불필요·자체 호스팅.
  # settings.yml 은 배포 스크립트(central-deploy.yml)가 JSON 포맷·시크릿을 채워 생성한다.
  # 공개 포트 없음(중앙 서버만 내부망에서 http://searxng:8080 으로 접근).
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080/"
    volumes:
      - ./searxng:/etc/searxng:rw

  # 중앙 서버의 process-local Micrometer counter를 영속 수집한다. 호스트/공개 포트는 열지 않는다.
  prometheus:
    image: prom/prometheus:v3.13.1
    restart: unless-stopped
    depends_on:
      central-server:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 용량 상한은 365일 전에 데이터를 지울 수 있으므로 시간 기준 보존만 적용한다.
      - --storage.tsdb.retention.time=365d
    secrets:
      - METRICS_SCRAPE_TOKEN
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - central-prometheus:/prometheus

networks:
  # yeon 스택의 외부 네트워크(yeon-cloudflared-1 과 공유). 컨테이너명/alias 로 터널 라우팅.
  yeon-edge:
    external: true

secrets:
  DB_PASSWORD:
    environment: CENTRAL_DB_PASSWORD
  DISCORD_ENABLED:
    environment: DISCORD_ENABLED
  DISCORD_BOT_TOKEN:
    environment: DISCORD_BOT_TOKEN
  RELAY_PUBLIC_URL:
    environment: RELAY_PUBLIC_URL
  CENTRAL_DURABLE_SECRET:
    environment: CENTRAL_DURABLE_SECRET
  NEXA_FIELD_ENC_KEY:
    environment: NEXA_FIELD_ENC_KEY
  OPENAI_API_KEY:
    environment: OPENAI_API_KEY
  CONNECT_DISCORD_CLIENT_ID:
    environment: CONNECT_DISCORD_CLIENT_ID
  CONNECT_DISCORD_CLIENT_SECRET:
    environment: CONNECT_DISCORD_CLIENT_SECRET
  CENTRAL_OAUTH_ENABLED:
    environment: CENTRAL_OAUTH_ENABLED
  CENTRAL_DASHBOARD_ADMIN_USER_IDS:
    environment: CENTRAL_DASHBOARD_ADMIN_USER_IDS
  METRICS_SCRAPE_TOKEN:
    environment: CENTRAL_METRICS_SCRAPE_TOKEN

volumes:
  central-db:
  central-prometheus:
