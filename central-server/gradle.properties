# central-server 빌드 JVM 메모리 — CI(ubuntu-latest, ~7GB) compileKotlin OOM 방지.
#
# 코드베이스가 커지며(671+ Kotlin 소스) Kotlin 컴파일러 데몬 기본 힙(512m)이 부족해
# `:compileKotlin` 이 GC overhead limit / OutOfMemoryError 로 실패했다(NEXA-P00 CI build job).
# Gradle/Kotlin 데몬 힙을 명시적으로 키운다. 테스트 JVM 은 별도 fork(build.gradle.kts maxHeapSize
# 1280m/docker 1536m)라 이 값과 합산되지 않으며, 단일 fork(maxParallelForks=1)라 7GB 안에 든다.
# Gradle 메인 JVM(3g) + Kotlin 데몬(3g) = 피크 6g 로 ubuntu-latest 7GB 천장 아래에 둔다.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin 컴파일러 데몬 힙(Gradle 데몬과 별개 프로세스). 큰 모듈의 IR 백엔드 코드젠에 필요.
kotlin.daemon.jvmargs=-Xmx3g
