spring:
  application:
    name: central-server
  datasource:
    # dev/test 기본 H2(in-memory, PostgreSQL 호환 모드). prod 는 DB_URL 로 Postgres 주입.
    url: ${DB_URL:jdbc:h2:mem:central;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none # 스키마는 Flyway 가 소유
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080
  # Cloudflare Tunnel(TLS 종단) 뒤라 Spring 이 X-Forwarded-Proto/Host 를 반영해야 baseUrl 이 https 가 된다.
  # 안 그러면 OAuth2 redirect_uri 가 http:// 로 생성돼 디스코드 'invalid redirect_uri' 로 로그인 실패.
  # 이 컨테이너는 localhost(터널)만 도달하므로 헤더 신뢰 안전.
  forward-headers-strategy: framework

# 운영 관측(Actuator). 헬스/정보만 노출.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    # Redis 는 분산 rate limit(#242) 옵트인 기능 — 미사용 시 헬스 프로브 비활성(헬스 DOWN 방지).
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
  # 분산 추적(#219). 기본 OFF(OTLP 익스포터 미생성). 운영에서 TRACING_ENABLED=true + OTLP_ENDPOINT 로 활성.
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.0}
  otlp:
    tracing:
      # 활성 시에만 유효한 URL 주입(빈 문자열은 익스포터 인스턴스화 실패 — 기본 표준 포트).
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# 중앙 서버 고유 설정 (ADR 0003/0004). 환경변수로 오버라이드.
central:
  metrics:
    # 운영 Prometheus collector 전용 bearer token. 로컬 OAuth OFF + 미설정은 직접 조회 가능하지만,
    # 운영 OAuth ON에서는 반드시 설정해야 하며 미설정 시 scrape endpoint가 fail-closed(503)한다.
    scrape-token: ${CENTRAL_METRICS_SCRAPE_TOKEN:}
  discord:
    # Discord 봇 토큰. 절대 커밋 금지 — 환경변수 DISCORD_BOT_TOKEN 로 주입.
    bot-token: ${DISCORD_BOT_TOKEN:}
    enabled: ${DISCORD_ENABLED:false}
    # 설정 시 해당 길드(서버)에 슬래시 명령 즉시 등록(전파 지연 없음). 비우면 글로벌(최대 ~1h).
    guild-id: ${DISCORD_GUILD_ID:}
    # @니아 질문처럼 일반 메시지 본문을 읽는 멘션 호출. Developer Portal Bot 설정의 Message Content Intent 와 일치해야 한다.
    # false 면 MESSAGE_CONTENT 를 요청하지 않아 슬래시/버튼/모달만 안전하게 부팅한다.
    message-content-intent-enabled: ${DISCORD_MESSAGE_CONTENT_INTENT_ENABLED:true}
    # 연속 메시지 turn boundary가 열린 동안 사용자의 typing 신호로 quiet window를 연장한다.
    # 비특권 intent이며, 꺼져도 메시지 간격 기반 적응형 경계는 그대로 동작한다.
    typing-intent-enabled: ${DISCORD_TYPING_INTENT_ENABLED:false}
    # Developer Portal 에서 Message Content Intent 가 꺼져 4014 로 거부되면, @멘션 질문을 끄고 슬래시 명령만 자동 재기동한다.
    fallback-without-message-content-on-4014: ${DISCORD_FALLBACK_WITHOUT_MESSAGE_CONTENT_ON_4014:true}
  relay:
    # 에이전트 WebSocket 경로. 유저/프로바이더 PC 에이전트가 outbound 접속.
    path: ${RELAY_PATH:/agent}
    # 프로바이더 온보딩 안내에 넣을 공개 relay 주소(예: wss://discord-ai.yeon.world/agent).
    # 비우면 안내문에 "관리자에게 문의" 플레이스홀더 표시.
    public-url: ${RELAY_PUBLIC_URL:}
    max-concurrency-per-provider: ${RELAY_MAX_CONCURRENCY:1}
    heartbeat-seconds: ${RELAY_HEARTBEAT_SECONDS:30}
    request-timeout-seconds: ${RELAY_REQUEST_TIMEOUT_SECONDS:120}
  token:
    ttl-seconds: ${AGENT_TOKEN_TTL_SECONDS:600}
  connect:
    # 웹 ‘토큰 받기’(--gui 버튼) Discord OAuth. client-id/secret 미설정이면 비활성(복붙 안내).
    # Discord 개발자 포털에 redirect URI <공개주소>/provider/connect/callback 등록 필요.
    discord-client-id: ${CONNECT_DISCORD_CLIENT_ID:}
    discord-client-secret: ${CONNECT_DISCORD_CLIENT_SECRET:}
    # 공개 베이스 URL(예: https://discord-ai.yeon.world). 비우면 relay.public-url 에서 도출.
    public-base-url: ${CONNECT_PUBLIC_BASE_URL:}
  oauth:
    # 대시보드 관리자 Discord 로그인 활성화. true 면 대시보드 데이터/쓰기 API 가 로그인 + 관리자
    # 허용목록(dashboard.admin-user-ids)으로 제한된다. 위 spring.security.oauth2 등록 필요.
    enabled: ${CENTRAL_OAUTH_ENABLED:false}
  dashboard:
    # Discord OAuth 를 켜기 전에도 운영 AI Network 관리자 API 를 막기 위한 임시 운영 토큰.
    # 설정하면 X-Dashboard-Admin-Token 헤더가 일치할 때만 admin audience/쓰기 API 를 허용한다.
    admin-token: ${CENTRAL_DASHBOARD_ADMIN_TOKEN:}
    # Vite React 관리자 콘솔을 별도 origin 에 배포할 때 허용할 origin 목록(콤마 구분).
    cors-origins: ${CENTRAL_DASHBOARD_CORS_ORIGINS:}
    # 관리자 Discord user id 허용목록(콤마 구분). OAuth 로그인 사용자는 이 목록에 있을 때만 관리자.
    # 비면 OAuth 만으로는 관리자 작업 불가(admin-token 헤더로만) — fail-closed.
    admin-user-ids: ${CENTRAL_DASHBOARD_ADMIN_USER_IDS:}
  idempotency:
    # 같은 요청 폭주 방어. 같은 (guild,user,prompt) 는 window-millis 안에서 max-duplicates-per-window 번까지
    # 허용(반복 채팅은 통과), 그 다음부터 막는다. 예전엔 1번이라도 같으면 무조건 막아 채팅에 "중복 요청" 문구가 샜다.
    window-millis: ${CENTRAL_IDEMPOTENCY_WINDOW_MILLIS:10000}
    max-duplicates-per-window: ${CENTRAL_IDEMPOTENCY_MAX_DUPLICATES:5}
    # 채널당 하루 AI 사용 상한(비용·남용 방어). channel-window-millis 안에서 이 횟수를 넘으면 막는다.
    channel-daily-limit: ${CENTRAL_IDEMPOTENCY_CHANNEL_DAILY_LIMIT:50}
    channel-window-millis: ${CENTRAL_IDEMPOTENCY_CHANNEL_WINDOW_MILLIS:86400000}
  cloud:
    # 무료질문과 니아 판단·발화를 중앙 서버가 관리자 키로 직접 처리하는 OpenAI 백엔드.
    # 비우면 중앙 클라우드 경로가 비활성화되며 Z.AI로 폴백하지 않는다.
    openai-api-key: ${OPENAI_API_KEY:}
    openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:120}
    llm-timeout-seconds: ${OPENAI_LLM_TIMEOUT_SECONDS:20}
    # 동일 생성의 숨은 재호출은 timeout 뒤에도 과금될 수 있다. 기본 0; 의미 있는 복구는 각 상위 유스케이스가 명시한다.
    llm-max-retries: ${OPENAI_LLM_MAX_RETRIES:0}
    # 항상 같은 고정 prefix만 목적별 explicit cache에 넣는다. OFF인 목적은 explicit/no-breakpoint로 implicit write도 막는다.
    prompt-cache-nia-judge-enabled: ${OPENAI_PROMPT_CACHE_NIA_JUDGE_ENABLED:false}
    prompt-cache-nia-speech-enabled: ${OPENAI_PROMPT_CACHE_NIA_SPEECH_ENABLED:false}
    # 모든 Luna 호출은 OpenAiCloudLlm에서 reasoning effort none으로 고정한다.
    free-model: ${OPENAI_FREE_MODEL:gpt-5.6-luna}
    # 짧은 니아 호명(예: "니아야?") 전용 즉답 모델. 실제 AI 호출이며, env 로 즉시 rollback 가능.
    fast-model: ${OPENAI_FAST_MODEL:gpt-5.6-luna}
    # 이미지 픽셀까지 중앙 서버가 직접 만드는 클라우드 SD(ADR 0006 단계4 — 완전 앱리스 이미지).
    # 키가 있으면 에이전트(provider-agent) 풀이 비어도 /그림 이 동작한다. 비워도 에이전트 이미지 백엔드를
    # 사용할 수 있지만, 프롬프트 심사·번역을 위한 OpenAI는 반드시 활성이어야 한다(fail-closed).
    # Stability 우선, 없으면 RunPod. 모델은 코드 enum(StabilityModel) 이 SSOT — env 주입 없음.
    stability-api-key: ${STABILITY_API_KEY:}
    stability-base-url: ${STABILITY_BASE_URL:https://api.stability.ai}
    runpod-api-key: ${RUNPOD_API_KEY:}
    runpod-endpoint-id: ${RUNPOD_ENDPOINT_ID:}
    runpod-timeout-seconds: ${RUNPOD_TIMEOUT_SECONDS:300}
    runpod-base-url: ${RUNPOD_BASE_URL:https://api.runpod.ai/v2}
  speech:
    # NEXA 발화 생성(SPEAK 이후 문장 생성, ADR 0006 anti-corruption) 모델·budget 외부화(P14-T003).
    # endpoint/api-key 는 위 cloud.openai-* 가 SSOT — speech 는 모델 라벨·호출 budget 만 외부화한다.
    # 모델 업데이트·rollback 은 코드 수정 없이 이 값(또는 환경변수)만 바꾸면 된다.
    model: ${NEXA_SPEECH_MODEL:gpt-5.6-luna}
    timeout-seconds: ${NEXA_SPEECH_TIMEOUT_SECONDS:8}
    # 기존 설정 호환값. Luna Responses 요청에는 temperature를 전송하지 않는다(ADR 0006).
    temperature: ${NEXA_SPEECH_TEMPERATURE:0.5}
  ai-network:
    enabled: ${AI_NETWORK_ENABLED:true}
    dashboard-enabled: ${AI_NETWORK_DASHBOARD_ENABLED:true}
    presets-enabled: ${AI_NETWORK_PRESETS_ENABLED:true}
    rag-enabled: ${AI_NETWORK_RAG_ENABLED:true}
    multi-response-enabled: ${AI_NETWORK_MULTI_RESPONSE_ENABLED:true}
    multi-response-synthesis-enabled: ${AI_NETWORK_MULTI_RESPONSE_SYNTHESIS_ENABLED:true}
    multi-response-dashboard-enabled: ${AI_NETWORK_MULTI_RESPONSE_DASHBOARD_ENABLED:true}
    multi-response-rag-enabled: ${AI_NETWORK_MULTI_RESPONSE_RAG_ENABLED:true}
    multi-response-max-fanout: ${AI_NETWORK_MULTI_RESPONSE_MAX_FANOUT:2}
    channel-ai-enabled: ${AI_NETWORK_CHANNEL_AI_ENABLED:true}
    # 운영 긴급 차단. true 면 AI Network 신규 기능 API/고급 워크플로가 즉시 멈춘다.
    kill-switch: ${AI_NETWORK_KILL_SWITCH:false}
  nexa:
    token-budget:
      # NIA Judge/Speech의 실제 input+output 토큰을 채널별 24시간 창으로 합산한다. 외부 요청 직전 최대 예상량을
      # Redis에 원자 예약하고 성공 usage로 정산한다. timeout처럼 과금 여부가 불명확한 실패는 예약량을 유지한다.
      enabled: ${NEXA_CHANNEL_TOKEN_BUDGET_ENABLED:true}
      per-channel: ${NEXA_CHANNEL_TOKEN_BUDGET_PER_CHANNEL:1000000}
      window-seconds: ${NEXA_CHANNEL_TOKEN_BUDGET_WINDOW_SECONDS:86400}
      # 운영은 Redis fail-closed, 로컬 단일 인스턴스/테스트만 명시적으로 false를 사용한다.
      redis-enabled: ${CENTRAL_NEXA_TOKEN_BUDGET_REDIS_ENABLED:true}
    conversation-rag:
      embedding-model: ${NEXA_CONVERSATION_RAG_EMBEDDING_MODEL:text-embedding-3-small}
      timeout-seconds: ${NEXA_CONVERSATION_RAG_TIMEOUT_SECONDS:15}
    execution-permit:
      # NEXA 실행 permit은 기본 Redis Lua 원자 경로다. 로컬 단일 인스턴스/테스트에서만 명시적으로 false를 준다.
      # Redis 장애는 reserve=false로 닫혀 CANARY/LIVE의 채널/전역 상한이 인스턴스별로 갈라지지 않는다.
      redis-enabled: ${CENTRAL_NEXA_EXECUTION_PERMIT_REDIS_ENABLED:true}
    judge:
      # real-send(CANARY/LIVE) 채널의 참여 여부는 raw scene + few-shot single judge가 최종 판단한다.
      # shadow는 CENTRAL_NEXA_JUDGE_MODE=shadow 로 명시한 SHADOW_PREDICT 관찰용이다. CANARY/LIVE에서 shadow/off는
      # legacy로 우회하지 않고 fail-closed하므로, real-send 롤아웃은 항상 final로 유지한다.
      mode: ${CENTRAL_NEXA_JUDGE_MODE:final}
    autonomous-send:
      # 니아 자율 전송(예약된 SPEAK 를 실제 Discord 로 보냄) 실행 파이프라인 활성화 스위치.
      # 기본 false(꺼짐). 키·Cloud LLM·Redis 전제조건을 갖춘 배포만 명시적으로 켠다. 켜면
      # 파이프라인(poller/executor/스케줄러) 빈이 생성돼 니아가 자율 발화할 수 있다. 단 실제 전송은
      # 채널별 ShadowMode 가 실행 직전 한 번 더 게이팅한다: OFF/OBSERVE_ONLY/SHADOW_PREDICT=전송 0(기본), CANARY/LIVE
      # 채널만 실제 전송("니아 채널 자동 만들기"가 LIVE 설정). 즉 전역은 켜져 있어도 관리자가 LIVE 로 명시한 채널만
      # 발화한다. 비상 정지(kill-switch)는 env NEXA_AUTONOMOUS_SEND_ENABLED=false.
      enabled: ${NEXA_AUTONOMOUS_SEND_ENABLED:false}
      # due 예약을 확인하는 poll 주기(ms). 켜졌을 때만 유효.
      poll-interval-ms: ${NEXA_AUTONOMOUS_SEND_POLL_INTERVAL_MS:2000}
    closed-loop-retention:
      # WAIT outbox와 행동-결과 관측 행은 원문이 아니어도 무한 보존하지 않는다. 매일 UTC 03:55에 30일 초과분을
      # 자식 outcome -> interaction 순서와 만료 WAIT 순서로 정리한다. 기능을 꺼도 과거 행 정리를 위해 기본 활성이다.
      enabled: ${NEXA_CLOSED_LOOP_RETENTION_ENABLED:true}
      days: ${NEXA_CLOSED_LOOP_RETENTION_DAYS:30}
      cron: ${NEXA_CLOSED_LOOP_RETENTION_CRON:0 55 3 * * *}
    canary-halt:
      # Canary 자동 중단 SAFETY NET. 자율 전송(위 autonomous-send.enabled)이 켜졌을 때만 모니터 빈이 생성돼,
      # 길드별 최근 1시간 신호가 한도를 넘으면 스스로 SHADOW_PREDICT/OFF 로 강등한다(+pending 취소·운영자 알림).
      # privacy error·model mismatch 는 1건이라도 즉시 OFF(한도 없음). complaints·modelMismatches 신호는 아직
      # 공급원 미wiring 으로 항상 0 이다(후속). 아래는 utterances/complaints/staleSends 한도와 평가 주기.
      max-utterances-per-hour: ${NEXA_CANARY_HALT_MAX_UTTERANCES_PER_HOUR:30}
      max-complaints: ${NEXA_CANARY_HALT_MAX_COMPLAINTS:3}
      max-stale-sends: ${NEXA_CANARY_HALT_MAX_STALE_SENDS:5}
      # 자동 중단 평가 tick 주기(ms).
      interval-ms: ${NEXA_CANARY_HALT_INTERVAL_MS:60000}
    participation:
      turn-boundary:
        # FINAL real-send 턴만 2~7초 적응형 quiet window로 합친다. 30초 hard cap과 generation 검사는
        # 계속되는 메시지/typing이 판단을 무한 지연하거나 낡은 발화를 보내지 못하게 한다.
        enabled: ${NEXA_PARTICIPATION_TURN_BOUNDARY_ENABLED:false}
      judge:
        # 니아 participation 판단 모델. 발화와 같은 Luna none 경로를 사용한다.
        model: ${NEXA_PARTICIPATION_JUDGE_MODEL:gpt-5.6-luna}
        # Responses API strict JSON Schema를 사용한다. 실패는 Judge가 한 번만 재시도한 뒤 제한 하강한다.
        structured-output-enabled: ${NEXA_PARTICIPATION_JUDGE_STRUCTURED_OUTPUT_ENABLED:false}
        raw-context:
          # 저장 보존 한도(20만 자)와 모델 입력 한도를 분리한다. 기본값은 기존 판단 품질을 보존하고,
          # 목적별 input token 실측 뒤 운영에서만 낮춘다.
          max-chars: ${NEXA_PARTICIPATION_JUDGE_RAW_CONTEXT_MAX_CHARS:200000}
      speech:
        raw-context:
          max-chars: ${NEXA_PARTICIPATION_SPEECH_RAW_CONTEXT_MAX_CHARS:12000}

# 원문 문자 수가 0인 첨부/삭제 메시지도 행과 직렬화 메타데이터를 소비하므로 개수 상한을 별도로 둔다.
# 100개 burst 원문은 그대로 보존하면서 비어 있는 행이 무한히 쌓여 judge 입력 상한을 우회하는 것만 막는다.
nexa:
  raw-context:
    max-raw-chars-per-scope: ${NEXA_RAW_CONTEXT_MAX_RAW_CHARS_PER_SCOPE:200000}
    max-entries-per-scope: ${NEXA_RAW_CONTEXT_MAX_ENTRIES_PER_SCOPE:2000}

# Bugsink 오류 수집. Bugsink는 Sentry SDK 호환이므로 Sentry Java SDK를 사용한다.
# DSN 미설정(기본)이면 완전 no-op. BUGSINK_DSN 또는 SENTRY_DSN 주입 시 활성.
sentry:
  dsn: ${BUGSINK_DSN:${SENTRY_DSN:}}
  environment: ${SENTRY_ENV:dev}
  traces-sample-rate: ${SENTRY_TRACES_RATE:0.0}
  # 프롬프트 등 민감 데이터 전송 방지(기본 끔).
  send-default-pii: false

logging:
  level:
    com.discordassistant.central: INFO
