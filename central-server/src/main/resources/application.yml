spring:
  application:
    name: central-server
  datasource:
    # dev/test 기본 H2(in-memory, PostgreSQL 호환 모드). prod 는 DB_URL 로 Postgres 주입.
    url: ${DB_URL:jdbc:h2:mem:central;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none # 스키마는 Flyway 가 소유
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080
  # Cloudflare Tunnel(TLS 종단) 뒤라 Spring 이 X-Forwarded-Proto/Host 를 반영해야 baseUrl 이 https 가 된다.
  # 안 그러면 OAuth2 redirect_uri 가 http:// 로 생성돼 디스코드 'invalid redirect_uri' 로 로그인 실패.
  # 이 컨테이너는 localhost(터널)만 도달하므로 헤더 신뢰 안전.
  forward-headers-strategy: framework

# 운영 관측(Actuator). 헬스/정보만 노출.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    # Redis 는 분산 rate limit(#242) 옵트인 기능 — 미사용 시 헬스 프로브 비활성(헬스 DOWN 방지).
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
  # 분산 추적(#219). 기본 OFF(OTLP 익스포터 미생성). 운영에서 TRACING_ENABLED=true + OTLP_ENDPOINT 로 활성.
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.0}
  otlp:
    tracing:
      # 활성 시에만 유효한 URL 주입(빈 문자열은 익스포터 인스턴스화 실패 — 기본 표준 포트).
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# 중앙 서버 고유 설정 (ADR 0003/0004). 환경변수로 오버라이드.
central:
  discord:
    # Discord 봇 토큰. 절대 커밋 금지 — 환경변수 DISCORD_BOT_TOKEN 로 주입.
    bot-token: ${DISCORD_BOT_TOKEN:}
    enabled: ${DISCORD_ENABLED:false}
    # 설정 시 해당 길드(서버)에 슬래시 명령 즉시 등록(전파 지연 없음). 비우면 글로벌(최대 ~1h).
    guild-id: ${DISCORD_GUILD_ID:}
    # @냥시스턴트 질문처럼 일반 메시지 본문을 읽는 멘션 호출. Developer Portal Bot 설정의 Message Content Intent 와 일치해야 한다.
    # false 면 MESSAGE_CONTENT 를 요청하지 않아 슬래시/버튼/모달만 안전하게 부팅한다.
    message-content-intent-enabled: ${DISCORD_MESSAGE_CONTENT_INTENT_ENABLED:true}
    # Developer Portal 에서 Message Content Intent 가 꺼져 4014 로 거부되면, @멘션 질문을 끄고 슬래시 명령만 자동 재기동한다.
    fallback-without-message-content-on-4014: ${DISCORD_FALLBACK_WITHOUT_MESSAGE_CONTENT_ON_4014:true}
  relay:
    # 에이전트 WebSocket 경로. 유저/프로바이더 PC 에이전트가 outbound 접속.
    path: ${RELAY_PATH:/agent}
    # 프로바이더 온보딩 안내에 넣을 공개 relay 주소(예: wss://discord-ai.yeon.world/agent).
    # 비우면 안내문에 "관리자에게 문의" 플레이스홀더 표시.
    public-url: ${RELAY_PUBLIC_URL:}
    max-concurrency-per-provider: ${RELAY_MAX_CONCURRENCY:1}
    heartbeat-seconds: ${RELAY_HEARTBEAT_SECONDS:30}
    request-timeout-seconds: ${RELAY_REQUEST_TIMEOUT_SECONDS:120}
  token:
    ttl-seconds: ${AGENT_TOKEN_TTL_SECONDS:600}
  connect:
    # 웹 ‘토큰 받기’(--gui 버튼) Discord OAuth. client-id/secret 미설정이면 비활성(복붙 안내).
    # Discord 개발자 포털에 redirect URI <공개주소>/provider/connect/callback 등록 필요.
    discord-client-id: ${CONNECT_DISCORD_CLIENT_ID:}
    discord-client-secret: ${CONNECT_DISCORD_CLIENT_SECRET:}
    # 공개 베이스 URL(예: https://discord-ai.yeon.world). 비우면 relay.public-url 에서 도출.
    public-base-url: ${CONNECT_PUBLIC_BASE_URL:}
  oauth:
    # 대시보드 관리자 Discord 로그인 활성화. true 면 대시보드 데이터/쓰기 API 가 로그인 + 관리자
    # 허용목록(dashboard.admin-user-ids)으로 제한된다. 위 spring.security.oauth2 등록 필요.
    enabled: ${CENTRAL_OAUTH_ENABLED:false}
  dashboard:
    # Discord OAuth 를 켜기 전에도 운영 AI Network 관리자 API 를 막기 위한 임시 운영 토큰.
    # 설정하면 X-Dashboard-Admin-Token 헤더가 일치할 때만 admin audience/쓰기 API 를 허용한다.
    admin-token: ${CENTRAL_DASHBOARD_ADMIN_TOKEN:}
    # 관리자 Discord user id 허용목록(콤마 구분). OAuth 로그인 사용자는 이 목록에 있을 때만 관리자.
    # 비면 OAuth 만으로는 관리자 작업 불가(admin-token 헤더로만) — fail-closed.
    admin-user-ids: ${CENTRAL_DASHBOARD_ADMIN_USER_IDS:}
  ai-network:
    enabled: ${AI_NETWORK_ENABLED:true}
    dashboard-enabled: ${AI_NETWORK_DASHBOARD_ENABLED:true}
    presets-enabled: ${AI_NETWORK_PRESETS_ENABLED:true}
    rag-enabled: ${AI_NETWORK_RAG_ENABLED:true}
    multi-response-enabled: ${AI_NETWORK_MULTI_RESPONSE_ENABLED:true}
    multi-response-synthesis-enabled: ${AI_NETWORK_MULTI_RESPONSE_SYNTHESIS_ENABLED:true}
    multi-response-dashboard-enabled: ${AI_NETWORK_MULTI_RESPONSE_DASHBOARD_ENABLED:true}
    multi-response-rag-enabled: ${AI_NETWORK_MULTI_RESPONSE_RAG_ENABLED:true}
    multi-response-max-fanout: ${AI_NETWORK_MULTI_RESPONSE_MAX_FANOUT:2}
    channel-ai-enabled: ${AI_NETWORK_CHANNEL_AI_ENABLED:true}
    # 운영 긴급 차단. true 면 AI Network 신규 기능 API/고급 워크플로가 즉시 멈춘다.
    kill-switch: ${AI_NETWORK_KILL_SWITCH:false}

# 에러 트래킹(#223). DSN 미설정(기본)이면 완전 no-op. 운영에서 SENTRY_DSN 주입 시 활성.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENV:dev}
  traces-sample-rate: ${SENTRY_TRACES_RATE:0.0}
  # 프롬프트 등 민감 데이터 전송 방지(기본 끔).
  send-default-pii: false

logging:
  level:
    com.discordassistant.central: INFO
