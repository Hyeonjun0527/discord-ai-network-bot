spring:
  application:
    name: central-server
  datasource:
    # dev/test 기본 H2(in-memory, PostgreSQL 호환 모드). prod 는 DB_URL 로 Postgres 주입.
    url: ${DB_URL:jdbc:h2:mem:central;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none # 스키마는 Flyway 가 소유
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

# 운영 관측(Actuator). 헬스/정보만 노출.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    # Redis 는 분산 rate limit(#242) 옵트인 기능 — 미사용 시 헬스 프로브 비활성(헬스 DOWN 방지).
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
  # 분산 추적(#219). 기본 OFF(OTLP 익스포터 미생성). 운영에서 TRACING_ENABLED=true + OTLP_ENDPOINT 로 활성.
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.0}
  otlp:
    tracing:
      # 활성 시에만 유효한 URL 주입(빈 문자열은 익스포터 인스턴스화 실패 — 기본 표준 포트).
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# 중앙 서버 고유 설정 (ADR 0003/0004). 환경변수로 오버라이드.
central:
  discord:
    # Discord 봇 토큰. 절대 커밋 금지 — 환경변수 DISCORD_BOT_TOKEN 로 주입.
    bot-token: ${DISCORD_BOT_TOKEN:}
    enabled: ${DISCORD_ENABLED:false}
  relay:
    # 에이전트 WebSocket 경로. 유저/프로바이더 PC 에이전트가 outbound 접속.
    path: ${RELAY_PATH:/agent}
    max-concurrency-per-provider: ${RELAY_MAX_CONCURRENCY:1}
    heartbeat-seconds: ${RELAY_HEARTBEAT_SECONDS:30}
    request-timeout-seconds: ${RELAY_REQUEST_TIMEOUT_SECONDS:120}
  token:
    ttl-seconds: ${AGENT_TOKEN_TTL_SECONDS:600}

# 에러 트래킹(#223). DSN 미설정(기본)이면 완전 no-op. 운영에서 SENTRY_DSN 주입 시 활성.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENV:dev}
  traces-sample-rate: ${SENTRY_TRACES_RATE:0.0}
  # 프롬프트 등 민감 데이터 전송 방지(기본 끔).
  send-default-pii: false

logging:
  level:
    com.discordassistant.central: INFO
