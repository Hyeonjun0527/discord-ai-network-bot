<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXA shadow 관찰 보드</title>
  <!-- 기존 어드민 대시보드 디자인 토큰 재사용(별도 SPA 와 분리된 자족 페이지 — 기존 id 보존). -->
  <link rel="stylesheet" href="/admin/dashboard/style.css" />
  <style>
    .wrap { max-width: 1040px; margin: 0 auto; padding: 24px; }
    .mode-badge { display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 12px; border-radius:8px; font-size:12px; font-weight:800; letter-spacing:.02em; }
    /* OBSERVE_ONLY/SHADOW_PREDICT = 미발화(안전) → 차분한 색. LIVE/CANARY = 실제 발화 → 강한 경고색. 혼동 불가(acceptance T011). */
    .mode-OFF { background: rgba(148,163,184,.14); color: var(--faint); border:1px solid var(--line); }
    .mode-OBSERVE_ONLY, .mode-SHADOW_PREDICT { background: rgba(70,211,154,.12); color: var(--ok); border:1px solid rgba(70,211,154,.4); }
    .mode-CANARY { background: rgba(246,162,60,.16); color: var(--warn); border:1px solid rgba(246,162,60,.5); }
    .mode-LIVE { background: rgba(251,113,133,.18); color: var(--bad); border:1px solid rgba(251,113,133,.6); }
    .send-tag { font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px; margin-left:8px; }
    .send-shadow { background: rgba(70,211,154,.12); color: var(--ok); }
    .send-live { background: rgba(251,113,133,.18); color: var(--bad); }
    table { width:100%; border-collapse:collapse; margin-top:12px; }
    th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); font-size:13px; }
    th { color: var(--muted); font-weight:700; }
    .rate-bar { display:inline-block; height:8px; border-radius:4px; vertical-align:middle; }
    .rate-speak { background: var(--bad); }
    .rate-silence { background: var(--ok); }
    .eligibility { font-size:12px; }
    .elig-ready { color: var(--ok); } .elig-thin { color: var(--warn); }
    .muted { color: var(--muted); }
    .scene-form input { max-width: 200px; margin-right: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>NEXA shadow 관찰 보드</h1>
    <p class="muted">
      shadow = <strong>미발화 관찰</strong>. <span class="mode-badge mode-SHADOW_PREDICT">SHADOW_PREDICT</span>/<span class="mode-badge mode-OBSERVE_ONLY">OBSERVE_ONLY</span> 단계는
      정책 예측만 기록하고 <strong>실제 Discord 전송을 하지 않습니다</strong>.
      <span class="mode-badge mode-LIVE">LIVE</span>/<span class="mode-badge mode-CANARY">CANARY</span> 만 실제로 발화합니다.
    </p>

    <h2>길드별 모드·수집 상태</h2>
    <table id="statusTable">
      <thead>
        <tr><th>길드(가명)</th><th>모드</th><th>실제 전송</th><th>예측 수</th><th>수집 기간</th><th>오류율</th><th>데이터 적격</th></tr>
      </thead>
      <tbody><tr><td colspan="7" class="muted">불러오는 중…</td></tr></tbody>
    </table>

    <h2>장면별 정책 비교(발화율·침묵률·delay)</h2>
    <div class="scene-form">
      <input id="sceneGuild" placeholder="길드 가명" />
      <input id="sceneChannel" placeholder="채널 id" />
      <input id="sceneSeq" placeholder="sceneSeq" inputmode="numeric" />
      <button id="loadScene" class="primary">비교 불러오기</button>
    </div>
    <table id="sceneTable">
      <thead>
        <tr><th>정책</th><th>발화율(SPEAK)</th><th>침묵률(IGNORE)</th><th>샘플 행동</th><th>예상 발사</th></tr>
      </thead>
      <tbody><tr><td colspan="5" class="muted">장면을 입력하면 정책별 비교가 표시됩니다.</td></tr></tbody>
    </table>
  </div>

  <script>
    const BASE = "/api/ai-network/shadow";

    // 데이터 적격: 예측 수가 충분하고 오류율이 낮으면 ready(임계는 운영 휴리스틱).
    function eligibility(count, errorRate) {
      if (count >= 100 && errorRate <= 0.05) return { cls: "elig-ready", text: "적격(ready)" };
      return { cls: "elig-thin", text: "표본 부족/오류 높음" };
    }

    function fmtPeriod(first, last) {
      if (!first || !last) return "<span class='muted'>—</span>";
      return `${new Date(first).toLocaleString()} ~ ${new Date(last).toLocaleString()}`;
    }

    function rateBar(rate, cls) {
      const pct = Math.round((rate || 0) * 100);
      return `<span class="rate-bar ${cls}" style="width:${Math.max(2, pct)}px"></span> ${pct}%`;
    }

    async function loadStatus() {
      const tbody = document.querySelector("#statusTable tbody");
      try {
        const res = await fetch(`${BASE}/status`, { headers: { Accept: "application/json" } });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const rows = await res.json();
        if (!rows.length) { tbody.innerHTML = `<tr><td colspan="7" class="muted">수집된 길드가 없습니다.</td></tr>`; return; }
        tbody.innerHTML = rows.map((r) => {
          const elig = eligibility(r.predictionCount, r.errorRate);
          const sendTag = r.realSendActive
            ? `<span class="send-tag send-live">실제 전송</span>`
            : `<span class="send-tag send-shadow">미발화</span>`;
          return `<tr>
            <td>${r.guildPseudonym}</td>
            <td><span class="mode-badge mode-${r.mode}">${r.mode}</span></td>
            <td>${sendTag}</td>
            <td>${r.predictionCount}</td>
            <td>${fmtPeriod(r.firstPredictedAt, r.lastPredictedAt)}</td>
            <td>${Math.round((r.errorRate || 0) * 1000) / 10}%</td>
            <td class="eligibility ${elig.cls}">${elig.text}</td>
          </tr>`;
        }).join("");
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="7" class="muted">불러오기 실패: ${e.message} (관리자 로그인/토큰 필요)</td></tr>`;
      }
    }

    async function loadScene() {
      const tbody = document.querySelector("#sceneTable tbody");
      const guild = document.getElementById("sceneGuild").value.trim();
      const channel = document.getElementById("sceneChannel").value.trim();
      const seq = document.getElementById("sceneSeq").value.trim();
      if (!guild || !channel || !seq) { tbody.innerHTML = `<tr><td colspan="5" class="muted">길드·채널·sceneSeq 를 모두 입력하세요.</td></tr>`; return; }
      try {
        const url = `${BASE}/${encodeURIComponent(guild)}/scene?channelId=${encodeURIComponent(channel)}&sceneSeq=${encodeURIComponent(seq)}`;
        const res = await fetch(url, { headers: { Accept: "application/json" } });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const rows = await res.json();
        if (!rows.length) { tbody.innerHTML = `<tr><td colspan="5" class="muted">이 장면의 예측이 없습니다.</td></tr>`; return; }
        tbody.innerHTML = rows.map((r) => `<tr>
          <td>${r.modelVersion}</td>
          <td>${rateBar(r.speakRate, "rate-speak")}</td>
          <td>${rateBar(r.silenceRate, "rate-silence")}</td>
          <td>${r.sampledAction}</td>
          <td>${r.expectedFireAt ? new Date(r.expectedFireAt).toLocaleString() : "<span class='muted'>발사 안 함</span>"}</td>
        </tr>`).join("");
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="5" class="muted">불러오기 실패: ${e.message}</td></tr>`;
      }
    }

    document.getElementById("loadScene").addEventListener("click", loadScene);
    loadStatus();
  </script>
</body>
</html>
