# Cucumber 글루/리포터 설정(차수 18). JUnit Platform 런처가 모든 엔진(스위트→cucumber)에 전파한다.
cucumber.glue=com.discordassistant.central.bdd
cucumber.publish.quiet=true
# Cucumber Report: PR/CI 에서 어떤 요구사항 시나리오가 깨졌는지 보이도록 html/json/junit 산출.
cucumber.plugin=pretty, html:build/reports/cucumber/index.html, json:build/reports/cucumber/cucumber.json, junit:build/reports/cucumber/cucumber.xml
