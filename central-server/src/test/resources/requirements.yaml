# 요구사항 원장(SSOT, 차수 18). feature 의 @REQ-* 태그 ↔ 이 원장 ↔ 테스트 코드 ↔ CI 결과로 추적성을 만든다.
# RequirementsTraceabilityTest 가 다음을 강제한다:
#   - feature 의 @REQ-* 태그가 이 원장에 존재하는가
#   - P0 요구사항에 추적 시나리오가 있는가
#   - tests[].path 가 실제로 존재하는가
# priority: P0(필수 핵심 흐름) / P1 / P2.
requirements:
  - id: REQ-ASK-001
    title: 가용 프로바이더가 있으면 질문이 처리된다
    priority: P0
    tests:
      - type: cucumber
        path: src/test/resources/features/ask_routing.feature
  - id: REQ-ASK-002
    title: 허용 채널이 지정되면 다른 채널 요청은 거부된다
    priority: P0
    tests:
      - type: cucumber
        path: src/test/resources/features/ask_routing.feature
  - id: REQ-ASK-003
    title: 풀에 프로바이더가 없으면 처리 불가를 안내한다
    priority: P0
    tests:
      - type: cucumber
        path: src/test/resources/features/ask_routing.feature
  - id: REQ-ASK-004
    title: 차단된 사용자의 질문은 거부된다
    priority: P0
    tests:
      - type: cucumber
        path: src/test/resources/features/ask_routing.feature
  - id: REQ-PPOOL-001
    title: 프로바이더 풀은 길드별로 격리되어 다른 서버 프로바이더로 라우팅하지 않는다
    priority: P0
    tests:
      - type: cucumber
        path: src/test/resources/features/provider_pool_lifecycle.feature
  - id: REQ-PPOOL-002
    title: 봇이 서버에서 제거되면 해당 서버의 프로바이더 세션·등록·미사용 토큰을 정리한다
    priority: P0
    tests:
      - type: cucumber
        path: src/test/resources/features/provider_pool_lifecycle.feature
      - type: unit
        path: src/test/kotlin/com/discordassistant/central/discord/GuildRemovalCleanupServiceTest.kt
  - id: REQ-PPOOL-003
    title: 한 번이라도 기여한 프로바이더는 오프라인이어도 기여순위에 영구 표시된다
    priority: P0
    tests:
      - type: cucumber
        path: src/test/resources/features/provider_pool_lifecycle.feature
      - type: unit
        path: src/test/kotlin/com/discordassistant/central/discord/CommandServiceTest.kt
  - id: REQ-PPOOL-004
    title: 프로바이더 토큰은 길드에 묶인 일회용 토큰이다
    priority: P0
    tests:
      - type: cucumber
        path: src/test/resources/features/provider_pool_lifecycle.feature
      - type: unit
        path: src/test/kotlin/com/discordassistant/central/provider/ProviderRegistrationTest.kt
  - id: REQ-PPOOL-005
    title: 같은 프로바이더 유저의 여러 서버 등록과 세션은 서로 격리된다
    priority: P1
    tests:
      - type: unit
        path: src/test/kotlin/com/discordassistant/central/provider/ProviderRegistrationTest.kt
      - type: unit
        path: src/test/kotlin/com/discordassistant/central/relay/ProviderSessionTest.kt
  - id: REQ-PPOOL-006
    title: 서버를 떠난 프로바이더는 해당 서버 풀에서만 정리되고 기여 기록은 유지된다
    priority: P1
    tests:
      - type: unit
        path: src/test/kotlin/com/discordassistant/central/discord/ProviderPoolReconciliationServiceTest.kt
  - id: REQ-PPOOL-007
    title: 삭제된 채널의 허용 정책과 채널 AI 프로필은 함께 정리된다
    priority: P1
    tests:
      - type: unit
        path: src/test/kotlin/com/discordassistant/central/discord/ProviderPoolReconciliationServiceTest.kt
  - id: REQ-PPOOL-008
    title: 서버에 묶이지 않은 레거시 토큰은 릴레이 인증 단계에서 거부된다
    priority: P1
    tests:
      - type: unit
        path: src/test/kotlin/com/discordassistant/central/relay/RelayWebSocketHandlerTest.kt
  - id: REQ-PPOOL-009
    title: 길드 제거는 진행 중 요청을 실패 처리하고 해당 세션을 닫는다
    priority: P1
    tests:
      - type: unit
        path: src/test/kotlin/com/discordassistant/central/relay/ProviderSessionTest.kt
  # 서버 AI 자동 온보딩(Phase 1 — 동의 기반 골격, 휴리스틱 draft + 승인 카드).
  # Phase 1 은 LLM 추론·메시지 백필이 없으므로 P1(단위 추적). Phase 2/3 에서 P0 흐름·feature 시나리오로 승격 예정.
  - id: REQ-ONBOARD-001
    title: 관리자가 자동 온보딩을 시작하면 동의가 기록되고 휴리스틱 draft 의 PENDING 제안이 생성된다
    priority: P1
    tests:
      - type: unit
        path: src/test/kotlin/com/discordassistant/central/network/GuildOnboardingServiceTest.kt
  - id: REQ-ONBOARD-002
    title: 온보딩 제안을 승인하면 채널 AI 활성 behavior 버전으로 전환된다
    priority: P1
    tests:
      - type: unit
        path: src/test/kotlin/com/discordassistant/central/network/GuildOnboardingServiceTest.kt
  - id: REQ-ONBOARD-003
    title: 비관리자/미동의 사용자의 자동 온보딩 시작·승인·거절은 거부된다
    priority: P1
    tests:
      - type: unit
        path: src/test/kotlin/com/discordassistant/central/network/GuildOnboardingServiceTest.kt
      - type: unit
        path: src/test/kotlin/com/discordassistant/central/discord/CommandServiceTest.kt
  # Phase 2b — 과거 메시지 백필 + RAG 색인. 핀/공지 기본, 본문은 화이트리스트 채널 + MESSAGE_CONTENT 활성 시에만.
  # 봇/시스템 메시지·민감정보·opt-out 제외 + 작성자 익명화 + row 삭제로 즉시 잊을 수 있는 RAG 색인.
  - id: REQ-ONBOARD-004
    title: 백필 시 봇/시스템 메시지·민감정보 라인·opt-out 사용자는 RAG 색인에서 제외되고 작성자는 익명화된다
    priority: P1
    tests:
      - type: unit
        path: src/test/kotlin/com/discordassistant/central/discord/GuildHistoryBackfillServiceTest.kt
  - id: REQ-ONBOARD-005
    title: 정제된 백필 텍스트는 채널 지식공간의 RAG source 로 색인되고 run 에 색인 메타가 기록된다
    priority: P1
    tests:
      - type: unit
        path: src/test/kotlin/com/discordassistant/central/network/GuildOnboardingServiceTest.kt
  # 개인정보 보호 강화(적대적 리뷰 S1/S2/S3 대응):
  #  - 유저 단위 opt-out 실연동(/ai-onboard-optout 으로 본인 메시지를 백필 색인에서 제외),
  #  - 제3자 멘션(user/role/channel) 익명 토큰 마스킹(표시이름/실명 비노출),
  #  - 백필 색인 실패가 consent/proposal/run 생성을 롤백하지 않는 트랜잭션 격리.
  - id: REQ-ONBOARD-006
    title: 본인 opt-out·제3자 멘션 마스킹·색인 실패 격리로 개인정보를 보호하며 온보딩 본체는 보존된다
    priority: P1
    tests:
      - type: unit
        path: src/test/kotlin/com/discordassistant/central/discord/GuildHistoryBackfillServiceTest.kt
      - type: unit
        path: src/test/kotlin/com/discordassistant/central/discord/CommandServiceTest.kt
      - type: unit
        path: src/test/kotlin/com/discordassistant/central/network/GuildOnboardingServiceTest.kt
  # 채널 AI 자유 지침(custom instruction) — 슬롯(가드레일)과 공존하는 자연어 페르소나 색깔.
  # behavior 버전의 일부로 저장·버전관리되고 /ask 시스템 프롬프트 정체성 블록 뒤([우선순위 2.5])에 삽입된다.
  - id: REQ-INSTRUCTION-001
    title: 관리자가 추가한 자유 지침은 behavior 버전으로 저장되고 시스템 프롬프트 정체성 블록에 삽입된다
    priority: P1
    tests:
      - type: unit
        path: src/test/kotlin/com/discordassistant/central/network/ChannelAiCustomizationServiceTest.kt
  - id: REQ-INSTRUCTION-002
    title: 민감정보/위험 용어가 담긴 자유 지침은 자동 적용되지 않고 승인 대기열로 강제된다
    priority: P1
    tests:
      - type: unit
        path: src/test/kotlin/com/discordassistant/central/network/ChannelAiCustomizationServiceTest.kt
      - type: unit
        path: src/test/kotlin/com/discordassistant/central/discord/CommandServiceTest.kt
