# Production compose — pulled & run by the self-hosted runner during deploy.
#
# The deploy workflow exports IMAGE_TAG (e.g. sha-abc1234) and runs:
#   docker compose -f compose.prod.yml pull && up -d --wait
#
# Secrets/config come from a host-managed `.env` in the deploy directory
# (see deploy/.env.prod.example). This file is synced from the repo on every
# deploy, so edit it in git — not on the host.
#
# 봇 호스트(배포 Mac)에서 네이티브 Ollama 를 돌리고 컨테이너가 그것을 바라본다.
# 사용자는 아무 설치도 필요 없이 봇 호스트의 로컬 모델을 공유한다(클라우드 비용 0).
# 호스트 Ollama 는 OLLAMA_HOST=0.0.0.0:11434 로 떠 있어야 컨테이너에서 닿는다.
# (클라우드 API 로 가려면 길드별 /settings 에서 제공자/키를 등록하면 그게 우선한다.)

services:
  bot:
    image: ${BOT_IMAGE:-ghcr.io/hyeonjun0527/discord-assistant:${IMAGE_TAG:-latest}}
    container_name: discord-assistant-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Persist SQLite under the bind-mounted data dir
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/discord_assistant.db}
      # 컨테이너 → 봇 호스트의 네이티브 Ollama. 호스트가 0.0.0.0:11434 로 떠 있어야 함.
      # 리터럴로 둔다(${..} 보간 금지): compose 는 프로젝트 .env 를 변수 보간에도
      # 자동 사용하는데, .env(ENV_FILE 시크릿)의 OLLAMA_BASE_URL=localhost 가 보간돼
      # 들어오면 컨테이너가 자기 자신을 가리킨다. environment 는 env_file 보다 우선하므로
      # 여기 리터럴 값이 .env 의 localhost 를 확실히 덮어쓴다. (.env.example 의 localhost
      # 는 봇을 네이티브로 돌리는 로컬 dev 용이라 그대로 둔다.)
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      # Ollama 가 일시적으로 죽어도 봇이 재시작 플랩하지 않도록 헬스는 DB 만 본다
      # (개별 명령은 친절 안내로 폴백). 필요 시 .env 에서 true 로 전환.
      HEALTHCHECK_REQUIRE_OLLAMA: ${HEALTHCHECK_REQUIRE_OLLAMA:-false}
    # Docker Desktop 은 host.docker.internal 을 자동 제공하지만, 리눅스 러너에서도
    # 호스트 게이트웨이로 해석되도록 명시한다(있어도 무해).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "/app/scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
