services:
  - type: web
    name: discord-assistant-dashboard-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r dashboard/backend/requirements.txt
    startCommand: uvicorn dashboard.backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
