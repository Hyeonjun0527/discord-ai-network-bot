# /etc/logrotate.d/discord-assistant
# Install: sudo cp deploy/logrotate.conf /etc/logrotate.d/discord-assistant
/opt/discord-assistant/logs/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0640 discord-bot discord-bot
    sharedscripts
    postrotate
        systemctl restart discord-assistant 2>/dev/null || true
    endscript
}
