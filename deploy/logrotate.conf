# /etc/logrotate.d/discord-assistant  (#76)
#
# 컨테이너 STDOUT/STDERR 로그는 이 파일이 아니라 compose 의 json-file 드라이버가
# 회전시킨다(compose.prod.yml: logging.options max-size=10m, max-file=5). 따라서
# 여기서는 호스트 ./logs 디렉터리에 쌓이는 *.log(예: cron 으로 돌리는 backup.log)만
# 회전 대상으로 삼는다. systemd 서비스 재시작 가정은 Docker 배포에 맞지 않아 제거했다.
#
# 설치: sudo cp deploy/logrotate.conf /etc/logrotate.d/discord-assistant
# 그리고 아래 경로를 실제 DEPLOY_DIR(기본 $HOME/discord-assistant)로 바꾼다.
# 예: /home/<user>/discord-assistant/logs/*.log
/opt/discord-assistant/logs/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
# 참고:
#   - copytruncate: 파일을 새로 만들지 않고 잘라내므로 backup.sh 가 append(>>) 하는
#     로그를 끊김 없이 회전할 수 있다(프로세스 재시작 불필요).
#   - 컨테이너 자체 로그(docker logs)는 json-file max-size/max-file 로 이미 제한되며
#     `docker compose logs` 로 조회한다 — logrotate 대상이 아니다.
