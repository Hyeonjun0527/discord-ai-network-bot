version: "3.9"

services:
  # ── Discord bot ───────────────────────────────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Override Ollama URL to use the Docker service name
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./scripts:/app/scripts:ro
    depends_on:
      - ollama
    restart: unless-stopped

  # ── Ollama (local LLM inference) ─────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: "0.0.0.0"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  # ── Web dashboard backend (optional — only used when dashboard exists) ───
  dashboard:
    build:
      context: ./dashboard/backend
      dockerfile: Dockerfile
    env_file: dashboard/backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - bot
    restart: unless-stopped
    profiles:
      # Only starts when explicitly requested: docker compose --profile dashboard up
      - dashboard

volumes:
  ollama_data:
