schema_version: '1.0'
project: NEXA social Discord member
generated_from: User-provided repository inventory; P00 must verify all paths and commands against the actual repository.
execution_policy:
  unit_of_work: one task per Codex thread/branch/ExecPlan
  gate_rule: Each program T025 must be VERIFIED before the next program begins.
  later_tasks: Concrete but conditional. If a gate changes assumptions, update affected tasks through an ADR and task-graph
    revision rather than blindly executing stale work.
  production_rule: No live Discord speech before P18 canary gate.
recommended_new_contexts:
- name: conversation
  responsibility: normalized events, utterance bursts, threads, addressees, scenes
- name: participation
  responsibility: social policy features and IGNORE/WAIT/REACT/SPEAK/CANCEL decisions
- name: socialmemory
  responsibility: temporal social memory, relationship projections, pending intents
- name: actionruntime
  responsibility: durable scheduling, reevaluation, cancellation, Discord execution state
- name: speech
  responsibility: GLM candidate generation, critics, and burst planning after SPEAK
programs:
- id: P00
  name: 저장소 기준선과 Codex 작업 운영체제
  goal: 기존 모노레포를 변경하기 전에 빌드·테스트·생성물·아키텍처·보안 기준선을 고정하고, 이후 499개 작업을 원자적으로 실행할 수 있는 저장소 내 운영 규칙을 만든다.
  roots:
  - AGENTS.md
  - PLANS.md
  - docs/nexa/**
  - ai-context/**
  - scripts/**
  - .github/workflows/**
  exit_gate: 깨끗한 체크아웃에서 기준선 검증 명령이 재현되고, 기존 실패와 신규 실패가 구분되며, Codex가 단일 작업만 수행하도록 강제하는 문서·검증기가 준비되어야 한다.
  task_count: 25
- id: P01
  name: NEXA 경계와 기존 19개 도메인 통합 계약
  goal: 기존 헥사고날 구조를 유지하면서 NEXA 사회행동 기능의 새 경계와 기존 도메인의 책임을 확정하고, 코드로 강제 가능한 의존 DAG를 만든다.
  roots:
  - central-server/src/main/kotlin/com/discordassistant/central/**
  - central-server/src/test/**
  - docs/nexa/architecture/**
  - docs/adr/**
  exit_gate: conversation·participation·socialmemory·actionruntime·speech의 책임과 기존 도메인 연결이 ADR·모듈 계약·ArchUnit 테스트로 일치해야 한다.
  task_count: 25
- id: P02
  name: 개인정보·동의·정규화 이벤트 계약
  goal: Discord 원문을 관찰하는 기능을 구현하기 전에 데이터 범주, 동의, 보존, 삭제, 외부 전송 경계를 확정하고 프레임워크 독립적인 이벤트 계약을 만든다.
  roots:
  - specs/product-v2/nexa/**
  - central-server/src/main/kotlin/com/discordassistant/central/guild/**
  - central-server/src/main/kotlin/com/discordassistant/central/global/**
  - central-server/src/main/kotlin/com/discordassistant/central/conversation/**
  - central-server/src/main/resources/db/migration/**
  exit_gate: 동의되지 않은 메시지가 저장·외부 전송·학습 데이터로 진입하지 못하고, 모든 정규화 이벤트가 출처·보존·삭제 추적 정보를 가져야 한다.
  task_count: 25
- id: P03
  name: Discord 이벤트 수집과 append-only event store
  goal: JDA 이벤트를 정규화해 순서·중복·재시작에 안전하게 저장하고, 이후 모든 사회행동 projection을 재생할 수 있는 기반을 만든다.
  roots:
  - central-server/src/main/kotlin/com/discordassistant/central/platform/discord/**
  - central-server/src/main/kotlin/com/discordassistant/central/conversation/**
  - central-server/src/main/resources/db/migration/**
  - central-server/src/test/**
  exit_gate: 수신 이벤트가 동의 경계를 통과한 뒤 append-only로 저장되고, 중복·역순·재연결·프로세스 재시작에도 동일한 projection 입력 스트림을 재생할 수 있어야 한다.
  task_count: 25
- id: P04
  name: 인간 발화 버스트 구성
  goal: Discord 메시지 한 줄을 대화 턴으로 취급하지 않고, 동일 사용자의 연속 조각을 하나의 발화 버스트로 결정론적으로 구성한다.
  roots:
  - central-server/src/main/kotlin/com/discordassistant/central/conversation/**
  - central-server/src/test/**
  - test-fixtures/nexa/bursts/**
  - docs/nexa/conversation/**
  exit_gate: 네가 제시한 짧은 연속 메시지 사례를 한 버스트로 묶고, 다른 화자의 개입·reply·thread·수정·삭제를 정확히 반영하며 replay 결과가 동일해야 한다.
  task_count: 25
- id: P05
  name: 대화 스레드·대상·장면 projection
  goal: 발화 버스트를 누가 누구에게 어떤 흐름에서 말했는지 연결하고, 정책이 원문 전체를 매번 재해석하지 않아도 되는 버전된 대화 장면을 만든다.
  roots:
  - central-server/src/main/kotlin/com/discordassistant/central/conversation/**
  - central-server/src/test/**
  - test-fixtures/nexa/scenes/**
  - docs/nexa/conversation/**
  exit_gate: reply·mention·시간 인접성·주제 전환으로 스레드와 대상 확률을 만들고, 매 장면에 contextVersion을 부여해 예약 행동의 stale 여부를 판단할 수 있어야 한다.
  task_count: 25
- id: P06
  name: 관찰 가능한 사회 상태와 관계 projection
  goal: 사람의 내면을 단정하지 않고 Discord에서 관찰 가능한 상호작용만으로 NEXA 자체 상태, 채널 문화, 사용자별 관계 상태를 지속적으로 갱신한다.
  roots:
  - central-server/src/main/kotlin/com/discordassistant/central/participation/**
  - central-server/src/main/kotlin/com/discordassistant/central/socialmemory/**
  - central-server/src/main/kotlin/com/discordassistant/central/ainetwork/**
  - central-server/src/main/resources/db/migration/**
  - central-server/src/test/**
  exit_gate: 관계 상태가 출처·감쇠·삭제 가능성을 가지며 ainetwork와 중복되지 않고, replay로 동일하게 재구축되어야 한다.
  task_count: 25
- id: P07
  name: 시간 유효성이 있는 사회적 기억
  goal: 벡터 검색 하나로 과거를 덮어쓰지 않고, 출처·유효 기간·충돌·삭제를 보존하는 append-only 사회적 기억을 구축한다.
  roots:
  - central-server/src/main/kotlin/com/discordassistant/central/socialmemory/**
  - central-server/src/main/kotlin/com/discordassistant/central/globalpromptset/**
  - central-server/src/main/resources/db/migration/**
  - central-server/src/test/**
  - docs/nexa/memory/**
  exit_gate: 현재 유효한 기억만 speech와 participation에 제공되고, 닉네임 변경·농담·삭제·모순 사례에서 stale memory 사용이 차단되어야 한다.
  task_count: 25
- id: P08
  name: 사회행동 정책 계약과 feature 파이프라인
  goal: 말할지 여부를 GLM 문장 생성에서 분리하고, 행동·대상·시간·버스트를 확률분포로 반환하는 버전된 정책 계약을 만든다.
  roots:
  - central-server/src/main/kotlin/com/discordassistant/central/participation/**
  - contracts/policy/**
  - central-server/src/test/**
  - docs/nexa/policy/**
  exit_gate: IGNORE가 정식 행동으로 존재하고, 같은 scene/state/model/seed가 같은 결정을 재생하며, 안전 제약과 학습 정책이 분리되어야 한다.
  task_count: 25
- id: P09
  name: 규칙 기반 기준선과 완전 무발화 Shadow Mode
  goal: 학습 모델 전에 단순 기준선들을 동일한 계약으로 구현하고, 실제 Discord에서는 한 글자도 보내지 않은 채 인간 행동 예측 품질을 측정한다.
  roots:
  - central-server/src/main/kotlin/com/discordassistant/central/participation/**
  - central-server/src/main/kotlin/com/discordassistant/central/channelai/**
  - central-server/src/main/resources/static/admin/dashboard/**
  - central-server/src/test/**
  - docs/nexa/experiments/**
  exit_gate: 모든 정책이 같은 replay/eval 경로를 사용하고 shadow mode에서는 JDA outbound가 구조적으로 차단되며 최소 7일 기준선 데이터가 준비되어야 한다.
  task_count: 25
- id: P10
  name: 옵트인 데이터셋·Masked Member·재생 실험실
  goal: 동의된 이벤트를 한 인간 멤버의 행동 궤적 예측 문제로 변환하고, 서버 간 누출 없이 재현 가능한 학습·평가 데이터셋을 만든다.
  roots:
  - ml/social-policy/**
  - contracts/policy/**
  - scripts/**
  - docs/nexa/datasets/**
  - central-server/src/main/kotlin/com/discordassistant/central/participation/**
  exit_gate: 데이터셋의 모든 row가 동의·출처·변환 버전·split을 가지며, 특정 길드가 train/test에 동시에 나타나지 않고 삭제 요청을 반영할 수 있어야 한다.
  task_count: 25
- id: P11
  name: 학습된 Social Policy v1
  goal: 규칙을 대체할 목적이 아니라 비교 가능한 학습 모델들을 만들고, 행동·대상·시간·버스트의 확률 보정을 shadow 환경에서 검증한다.
  roots:
  - ml/social-policy/**
  - contracts/policy/**
  - central-server/src/main/kotlin/com/discordassistant/central/participation/**
  - docs/nexa/experiments/**
  exit_gate: 학습 모델이 최소 두 개의 단순 기준선을 여러 길드 holdout에서 일관되게 넘고, ONNX/JVM 결과가 Python과 수치 허용오차 내 일치해야 한다.
  task_count: 25
- id: P12
  name: 연속시간 참여·지연·취소 정책
  goal: 메시지마다 즉시 이진 판단하는 구조를 넘어, 다음 행동 종류와 발생 시간을 함께 모델링하고 1.5배 설정을 발화 위험도 보정으로 구현한다.
  roots:
  - ml/social-policy/**
  - contracts/policy/**
  - central-server/src/main/kotlin/com/discordassistant/central/participation/**
  - docs/nexa/experiments/**
  exit_gate: delay/never 예측이 검열 데이터를 올바르게 다루고, multiplier가 행동 분포를 망가뜨리지 않으며, 실시간 추론 지연이 shadow 요구를 충족해야 한다.
  task_count: 25
- id: P13
  name: 취소 가능한 Action Runtime과 Discord 실행기
  goal: 정책 결정을 즉시 전송하지 않고 영속 예약, 재평가, 취소, 재시도, 부분 전송을 관리하는 실행 상태 머신을 구축한다.
  roots:
  - central-server/src/main/kotlin/com/discordassistant/central/actionruntime/**
  - central-server/src/main/kotlin/com/discordassistant/central/platform/discord/**
  - central-server/src/main/kotlin/com/discordassistant/central/multiresponse/**
  - central-server/src/main/resources/db/migration/**
  - central-server/src/test/**
  exit_gate: 프로세스 재시작과 문맥 변경 중에도 stale 메시지가 전송되지 않고, 첫 버블 이후 나머지 버블 취소까지 결정론적으로 검증되어야 한다.
  task_count: 25
- id: P14
  name: GLM-5.1 기반 발화 후보·스타일·버스트 생성
  goal: 정책이 SPEAK를 선택한 뒤에만 기존 routing을 통해 GLM-5.1을 호출하고, 장면·정체성·기억에서 여러 후보를 만든 뒤 도우미 말투와 모순을 걸러낸다.
  roots:
  - central-server/src/main/kotlin/com/discordassistant/central/speech/**
  - central-server/src/main/kotlin/com/discordassistant/central/routing/**
  - central-server/src/main/kotlin/com/discordassistant/central/globalpromptset/**
  - central-server/src/test/**
  - docs/nexa/speech/**
  exit_gate: IGNORE/WAIT/REACT에서 GLM 호출이 0이고, SPEAK 후보가 정책 socialAct·burstProfile을 따르며 외부 전송 최소화·timeout·fallback·비용 관측이 검증되어야
    한다.
  task_count: 25
- id: P15
  name: 기존 central-server 도메인과 점진 통합
  goal: 새 NEXA 경로를 기존 channelai·ainetwork·routing·guild·onboarding·quota·requestlog·knowledge·multiresponse와 feature flag
    아래 연결하고 기존 기능을 깨지 않는다.
  roots:
  - central-server/src/main/kotlin/com/discordassistant/central/**
  - central-server/src/main/resources/**
  - central-server/src/test/**
  - docs/nexa/migration/**
  exit_gate: 기존 자동응답과 NEXA 경로를 길드별로 독립 전환할 수 있고, 모듈 순환·중복 설정·이중 과금·이중 전송 없이 E2E 테스트가 통과해야 한다.
  task_count: 25
- id: P16
  name: 행동 평가·시뮬레이션·적대적 시나리오
  goal: 짧은 성공 데모에 속지 않도록 실제 Discord 리듬, 장기 상태, 오류, 공격을 재생하는 평가 하네스를 만들고 release gate를 수치화한다.
  roots:
  - ml/social-policy/**
  - central-server/src/test/**
  - test-fixtures/nexa/scenarios/**
  - scripts/**
  - docs/nexa/evals/**
  exit_gate: 각 모델·정책·런타임 버전을 같은 시나리오에서 비교할 수 있고, 사람다움·침묵·안전·장기 기억 실패가 단일 종합점수에 숨지 않아야 한다.
  task_count: 25
- id: P17
  name: 보안·안전·데이터 오염 방어
  goal: 공개 채팅을 관찰하고 외부 모델을 호출하는 시스템의 prompt injection, 개인정보, 권한, 괴롭힘, 데이터 poisoning, 모델 공급망 위험을 방어한다.
  roots:
  - central-server/src/main/kotlin/com/discordassistant/central/global/**
  - central-server/src/main/kotlin/com/discordassistant/central/speech/**
  - central-server/src/main/kotlin/com/discordassistant/central/participation/**
  - ml/social-policy/**
  - docs/nexa/security/**
  - .github/workflows/**
  exit_gate: 대화 원문이 시스템 권한을 획득하지 못하고, 삭제·동의 철회·키 회전·artifact 검증·incident rollback이 실제 테스트와 runbook으로 입증되어야 한다.
  task_count: 25
- id: P18
  name: 관측성·운영·Canary 롤아웃
  goal: 정책이 왜 침묵하거나 말했는지 원문 없이 관측하고, 길드별 canary·kill switch·모델/설정 rollback·용량 계획으로 안전하게 운영한다.
  roots:
  - central-server/src/main/kotlin/com/discordassistant/central/global/observability/**
  - central-server/src/main/kotlin/com/discordassistant/central/participation/**
  - central-server/src/main/resources/static/admin/dashboard/**
  - deploy/**
  - .github/workflows/**
  - docs/nexa/operations/**
  exit_gate: 한 길드에서 시작해 즉시 중단·rollback할 수 있고, action 분포·점유율·오류·비용·stale memory를 실시간 탐지하며 운영자가 원문 없이 원인을 추적할 수 있어야 한다.
  task_count: 25
- id: P19
  name: 장기 적응·오프라인 강화학습·v1 출시 판단
  goal: 수주·수개월 사용에서 사람처럼 느껴지는지 검증하고, 서버별 적응은 제한된 파라미터부터 시작하며 engagement 조작 없이 다음 세대 정책 학습 루프를 만든다.
  roots:
  - ml/social-policy/**
  - central-server/src/main/kotlin/com/discordassistant/central/**
  - docs/nexa/longitudinal/**
  - docs/nexa/models/**
  - docs/nexa/operations/**
  exit_gate: 30/90일 데이터로 일관성·침묵·관계·기억·불쾌감·차단률을 평가하고, 명시적 인간 승인 없이는 온라인 학습이나 다길드 LIVE 출시를 하지 않는다.
  task_count: 25
tasks:
- id: NEXA-P00-T001
  program: P00
  sequence: 1
  title: 현재 브랜치와 작업 트리 기준선 기록
  status: VERIFIED
  kind: audit
  risk: low
  depends_on: []
  recommended_paths:
  - docs/nexa/baseline/repository-state.md
  deliverable: 현재 커밋, 브랜치, 미추적 파일, 서브모듈, 대용량 파일을 기록하는 기준선 문서를 만든다.
  acceptance: 다른 개발자가 같은 커밋에서 문서의 명령을 실행해 동일한 저장소 상태를 확인할 수 있다.
  verification:
  - ./scripts/nexa-verify.sh docs
  verification_evidence:
  - "repository-state.md 작성, task graph VALID, 문서 링크 OK, diff-check OK"
  human_gate: false
  execution_rule: 이 작업만 수행하고 다음 작업을 자동 시작하지 않는다.
- id: NEXA-P00-T002
