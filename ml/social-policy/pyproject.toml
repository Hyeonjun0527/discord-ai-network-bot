[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexa-social-policy"
version = "0.1.0"
description = "NEXA participation 정책 지도학습용 데이터셋 빌더 — 합성 fixture 전용, 운영 데이터 미접근."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# 의도적으로 런타임 필수 의존 0개(stdlib 전용). central-server/provider-agent 런타임을 끌어오지 않는다(T001 acceptance).
dependencies = []

[project.optional-dependencies]
# Parquet 직렬화는 선택 어댑터다. 없으면 in-memory 레코드/JSON 만 쓰고 Parquet 쓰기는 명시적으로 거부한다.
parquet = [
  "pyarrow>=15",
]
# 정책 모델 학습/평가/ONNX export 의존(P11). torch 는 의도적으로 쓰지 않는다(footprint·결정론 이유):
# numpy 기반 소형 신경망 + sklearn baseline + onnx/onnxruntime export·parity 로 모든 acceptance 를 충족한다.
ml = [
  "numpy>=2",
  "scikit-learn>=1.5",
  "onnx>=1.16",
  "onnxruntime>=1.18",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.4",
  "mypy>=1.10",
  "numpy>=2",
  "scikit-learn>=1.5",
  "onnx>=1.16",
  "onnxruntime>=1.18",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexa_policy = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

# numpy/onnx 표면은 대부분 Any 로 타입되어 warn_return_any 가 과도하게 운다(실제 버그 아님).
# P11 ML 수치 모듈만 warn_return_any 를 끈다(나머지 P10 도메인 코드는 strict 유지). 타입 정의 강제
# (disallow_untyped_defs)는 그대로 둔다 — 시그니처 타입은 계속 요구한다.
[[tool.mypy.overrides]]
module = [
  "nexa_policy.datasets",
  "nexa_policy.metrics",
  "nexa_policy.reproducibility",
  "nexa_policy.features.schema",
  "nexa_policy.baselines.*",
  "nexa_policy.models.*",
  "nexa_policy.training.*",
  "nexa_policy.calibration.*",
  "nexa_policy.export.*",
]
warn_return_any = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
