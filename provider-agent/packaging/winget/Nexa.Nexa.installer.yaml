# winget 설치 매니페스트. winget 이 InstallerSha256 을 **자동 검증**하므로 사용자는 수동
# 해시검증을 하지 않아도 된다. CI 가 __VERSION__/__WINDOWS_SHA256__ 를 채워 microsoft/winget-pkgs
# 로 제출(PR)한다. **설치 대상은 데스크톱 GUI 앱(Nexa — 맥 .app 과 동일한 네이티브 창)**:
# nexa-windows.exe(pywebview 번들). InstallerType: portable, 실행 별칭 nexa.
PackageIdentifier: Nexa.Nexa
PackageVersion: __VERSION__
InstallerType: portable
Commands:
  - nexa
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/yeon-intergation-platform/nexa-releases/releases/download/agent-v__VERSION__/nexa-windows.exe
    InstallerSha256: __WINDOWS_SHA256__
ManifestType: installer
ManifestVersion: 1.6.0
