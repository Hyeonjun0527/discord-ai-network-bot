# winget 설치 매니페스트. winget 이 InstallerSha256 을 **자동 검증**하므로 사용자는 수동
# 해시검증을 하지 않아도 된다. CI 가 __VERSION__/__WINDOWS_SHA256__ 를 채워 microsoft/winget-pkgs
# 로 제출(PR)한다. InstallerType: portable — 단일 CLI 실행파일.
PackageIdentifier: Nyassistant.DiscordAiAgentNetworkBot
PackageVersion: __VERSION__
InstallerType: portable
Commands:
  - discord-ai-agent-network-bot
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/Hyeonjun0527/discord-assistant/releases/download/agent-v__VERSION__/discord-ai-agent-network-bot-windows.exe
    InstallerSha256: __WINDOWS_SHA256__
ManifestType: installer
ManifestVersion: 1.6.0
