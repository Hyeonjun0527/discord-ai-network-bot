[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-assistant"
version = "0.1.0"
description = "Local LLM Discord bot for channel summarization and context-aware Q&A."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "discord-assistant contributors" }]
dependencies = [
  "discord.py>=2.4,<3.0",
  "python-dotenv>=1.0,<2.0",
  "cryptography>=42,<44",
  "aiosqlite>=0.20,<1.0",
  "psutil>=5.9,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-cov>=4,<6",
  "coverage>=7,<8",
  "ruff>=0.4,<1.0",
  "mypy>=1.10,<2.0",
]
# 관측성(선택적, 런타임 필수 아님). 미설치 시 메트릭/Sentry 기능만 비활성화되며
# 봇은 정상 동작한다(import 가드). `pip install '.[observability]'` 로 활성화.
observability = [
  "prometheus-client>=0.20,<1.0",
  "sentry-sdk>=2.0,<3.0",
]

[project.scripts]
discord-assistant = "discord_assistant.bot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Coverage is opt-in to avoid per-run overhead on the default `pytest` invocation (#94).
# Run with coverage explicitly: `pytest --cov=discord_assistant --cov-report=term-missing`
# (CI uses the coverage flags; see .github/workflows).
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["discord_assistant"]
branch = false
omit = [
  "*/__main__.py",
]

[tool.coverage.report]
# 회귀 방지용 커버리지 게이트(#66). 현재 실측 커버리지(약 37%)보다 약간 낮은
# 보수적 임계로 설정해 기존 CI를 깨지 않으면서 하한선을 강제한다.
# bot.py/대시보드 테스트가 보강되면 이 값을 점진적으로 올린다(목표 60~70).
fail_under = 35
show_missing = true
