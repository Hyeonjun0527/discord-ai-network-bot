[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-assistant"
version = "0.1.0"
description = "Local LLM Discord bot for channel summarization and context-aware Q&A."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "discord-assistant contributors" }]
dependencies = [
  "discord.py>=2.4,<3.0",
  "python-dotenv>=1.0,<2.0",
  "cryptography>=42,<44",
  "aiosqlite>=0.20,<1.0",
  "psutil>=5.9,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-cov>=4,<6",
  "coverage>=7,<8",
  "ruff>=0.4,<1.0",
  "mypy>=1.10,<2.0",
]

[project.scripts]
discord-assistant = "discord_assistant.bot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=discord_assistant --cov-report=term-missing"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
ignore_missing_imports = true
