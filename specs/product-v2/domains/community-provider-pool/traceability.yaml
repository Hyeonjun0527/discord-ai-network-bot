# 추적성 연결층(traceability) — 연결(ID)만 기재. 긴 설명 금지(title 은 짧은 보조 라벨만).
# 출처: requirements.md §10(추적성표) + TRACEABILITY.md 매핑.
# 모든 값은 각 소유 MD 에 "실제 존재하는" ID 다(검증 스크립트가 강제).
# §10 표가 인용했으나 실제 정의처에 없던 ID 는 가장 정확한 실제 ID 로 교정했다.
# 모든 REQ-* 가 최소 1개 항목을 갖는다(미연결 0).

links:
  # ── 기능 요구사항(§5) ──────────────────────────────────────────────
  - requirement: REQ-501
    title: 봇 설치
    domain_models: [DM-E-Guild, DM-E-GuildPolicy]
    screens: [SCR-501]
    flows: [FLOW-01]
    apis: [API-REST-GUILD-GET, API-REST-GUILD-UPDATE]
    errors: []

  - requirement: REQ-502
    title: 서버 설정
    domain_models: [DM-E-GuildPolicy, DM-E-RolePolicy]
    screens: [SCR-501]
    flows: [FLOW-02]
    apis: [API-CMD-LLM-SETTINGS, API-REST-GUILD-GET, API-REST-GUILD-UPDATE]
    errors: [ERR-PERMISSION-DENIED, ERR-POLICY-INVALID]

  - requirement: REQ-503
    title: 채널 제한
    domain_models: [DM-E-AllowedChannel]
    screens: [SCR-502]
    flows: [FLOW-02.1]
    apis: [API-CMD-LLM-ALLOW-CHANNEL, API-CMD-LLM-DENY-CHANNEL, API-REST-GUILD-CHANNEL-ADD, API-REST-GUILD-CHANNEL-REMOVE]
    errors: [ERR-CHANNEL-NOT-ALLOWED]

  - requirement: REQ-504
    title: 역할별 권한
    domain_models: [DM-E-RolePolicy, DM-V-RoleId, DM-V-RoleTier, DM-V-ModelBurdenLevel]
    screens: [SCR-503]
    flows: [FLOW-02.2]
    apis: [API-CMD-LLM-ROLE-POLICY, API-REST-GUILD-ROLE-GET, API-REST-GUILD-ROLE-UPDATE]
    errors: [ERR-PERMISSION-DENIED]

  - requirement: REQ-505
    title: 프로바이더 등록
    domain_models: [DM-E-Provider, DM-E-ProviderApproval, DM-S-ProviderState, DM-EV-ProviderRegistered]
    screens: [SCR-601]
    flows: [FLOW-03]
    apis: [API-CMD-PROVIDER-JOIN, API-REST-PROVIDER-REGISTER]
    errors: [ERR-PROVIDER-ALREADY-REGISTERED]

  - requirement: REQ-506
    title: 승인
    domain_models: [DM-E-ProviderApproval, DM-S-ApprovalState, DM-EV-ProviderApproved]
    screens: [SCR-602, SCR-504]
    flows: [FLOW-03.3]
    apis: [API-CMD-PROVIDER-APPROVE, API-REST-PROVIDER-APPROVE]
    errors: [ERR-PERMISSION-DENIED]

  - requirement: REQ-507
    title: 기여 한도
    domain_models: [DM-E-ProviderContributionPolicy, DM-E-ProviderCapability, DM-V-LimitPolicy, DM-V-TimeoutPolicy]
    screens: [SCR-605, SCR-606, SCR-607]
    flows: [FLOW-03.4]
    apis: [API-CMD-PROVIDER-MODELS, API-CMD-PROVIDER-SCOPE, API-CMD-PROVIDER-LIMIT, API-REST-PROVIDER-MODELS-UPDATE, API-REST-PROVIDER-POLICY-UPDATE, API-REST-PROVIDER-LIMIT-UPDATE]
    errors: []

  - requirement: REQ-508
    title: Agent 연결
    domain_models: [DM-E-ProviderSession, DM-S-AgentConnState, DM-S-ProviderSessionState, DM-EV-ProviderAgentConnected]
    screens: [SCR-603, SCR-604]
    flows: [FLOW-04]
    apis: [API-WS-CONNECT, API-WS-PROVIDER-HELLO, API-WS-AUTH-OK, API-WS-AUTH-ERR]
    errors: [ERR-AGENT-AUTH-FAILED, ERR-WS-CONNECT-FAILED]

  - requirement: REQ-509
    title: 모델 부담 수준 분류
    domain_models: [DM-V-ModelBurdenLevel, DM-E-ModelProfile, DM-R-05]
