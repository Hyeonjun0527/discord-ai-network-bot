    screens: [SCR-910]
    flows: [FLOW-12]
    apis: [API-INT-FALLBACK, API-WS-CANCEL]
    errors: [ERR-FALLBACK-FAILED, ERR-TIMEOUT]

  - requirement: REQ-513
    title: 사용량 기록
