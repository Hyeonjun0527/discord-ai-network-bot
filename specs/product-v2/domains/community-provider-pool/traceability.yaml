    flows: [FLOW-09]
    apis: [API-CMD-PRIVACY, API-REST-GUILD-PRIVACY-SET]
    errors: []

  - requirement: REQ-515
    title: 관리자 모니터링
    domain_models: [DM-E-Provider, DM-S-ProviderState, DM-E-ContributionLog]
    screens: [SCR-504, SCR-505, SCR-507]
    flows: [FLOW-02.5]
    apis: [API-CMD-PROVIDERS, API-CMD-PROVIDER-REMOVE, API-REST-PROVIDER-LIST, API-REST-PROVIDER-GET, API-REST-PROVIDER-REMOVE]
    errors: [ERR-PROVIDER-NOT-FOUND]

