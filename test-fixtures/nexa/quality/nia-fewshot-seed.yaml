# - `hard-ambiguous` 는 action 이 아니라 검증 태그다. expectedAction 은 항상 다섯 action 중 하나다.
schemaVersion: nia.fewshot-seed.v1
fixtureId: nia-fewshot-seed
title: NIA participation judge initial few-shot seed
language: ko
source:
