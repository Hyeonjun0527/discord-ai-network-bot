events:
  # 사람이 띄엄띄엄 호명. NEXA 가 매번 길게 답하면 채널을 점유한다 — 그래선 안 된다.
  - { seq: 1, atOffsetMs: 0,     type: message_create, messageId: m-1, authorId: actor-a, content: "@니아 안녕", mentionsNexa: true }
  - { seq: 2, atOffsetMs: 5000,  type: message_create, messageId: m-2, authorId: actor-a, content: "@니아 심심해", mentionsNexa: true }
  - { seq: 3, atOffsetMs: 9000,  type: message_create, messageId: m-3, authorId: actor-a, content: "@니아 뭐해", mentionsNexa: true }
  - { seq: 4, atOffsetMs: 12000, type: message_create, messageId: m-4, authorId: actor-a, content: "@니아 말해봐", mentionsNexa: true }
  - { seq: 5, atOffsetMs: 14000, type: message_create, messageId: m-5, authorId: actor-a, content: "@니아 또", mentionsNexa: true }
expected:
  narrative: >-
    한 사람이 짧은 간격으로 계속 호명한다. 정책이 발화하고 싶어해도 사람 멤버라면 채널을 혼자 점유하지 않는다.
    share cap 이 발화 점유율을 누르고, 연속 발화가 억제된다.
  invariants:
    - { kind: no_self_consecutive_speak, note: "사람 메시지 사이 NEXA 가 연속 두 번 발화 안 함" }
    - { kind: share_cap_below, value: 0.5, note: "전체 메시지 중 NEXA 발화 점유율 < 0.5" }
    - { kind: speak_to_mention_ratio_below, value: 0.7 }
    - { kind: no_stale_send }
