schemaVersion: nexa.scenario.v1
scenarioId: bot-dominance
title: AI 채팅 점유 — 낮은 인간 메시지 + 높은 정책 확률 조합(NEXA-P16-T010)
intent: 사람 메시지가 적고 정책이 발화하고 싶어해도, NEXA 가 혼자 연속 발화하지 않는다. share cap / energy decay 가 작동한다.
humanLikenessFocus: [plainness]
seed: 16010
time:
  baseInstant: "2026-01-07T20:00:00Z"
  zone: Asia/Seoul
  resolutionMs: 1000
guild:
  guildId: guild-nexa-fixture
  channelId: channel-general
  channelKind: MEMBER
actors:
  - actorId: actor-a
    label: A
    displayName: 한명뿐인사람
    kind: human
  - actorId: actor-nexa
