schemaVersion: nexa.scenario.v1
scenarioId: model-timeout
title: policy/GLM timeout — fallback chain 이 always-silent/cancel 로 안전 종료(NEXA-P16-T017)
intent: >-
  정책 서비스와 GLM 각각에 timeout 을 주입한다. 어떤 timeout 도 부분 응답을 전송하지 않고 fallback chain 이
  침묵(always-silent) 또는 예약 취소로 안전하게 끝난다(P14 fallback). 다른 채널 fallback 없음.
humanLikenessFocus: [timing]
seed: 16017
time:
  baseInstant: "2026-01-13T15:00:00Z"
  zone: Asia/Seoul
  resolutionMs: 500
guild:
  guildId: guild-nexa-fixture
  channelId: channel-general
  channelKind: MEMBER
actors:
  - actorId: actor-a
    label: A
    displayName: 민수
    kind: human
  - actorId: actor-nexa
    label: NEXA
    displayName: 니아
    kind: nexa
events:
  # 케이스 1: GLM timeout — 호명 후 생성이 timeout 나면 부분 응답을 보내지 않고 취소(침묵).
  - { seq: 1, atOffsetMs: 0,    type: message_create, messageId: m-1, authorId: actor-a, content: "@니아 이 코드 왜 안 돼?", mentionsNexa: true }
  - { seq: 2, atOffsetMs: 1000, type: fault_inject, fault: glm_timeout, detailMs: 30000, targetMessageId: m-1 }
  # 케이스 2: policy timeout — 이후 새 호명에도 정책 평가가 timeout 이면 always-silent fallback.
  - { seq: 3, atOffsetMs: 5000, type: message_create, messageId: m-2, authorId: actor-a, content: "@니아 그럼 이건?", mentionsNexa: true }
  - { seq: 4, atOffsetMs: 5200, type: fault_inject, fault: policy_timeout, detailMs: 20000, targetMessageId: m-2 }
expected:
  narrative: >-
    m-1 호명 직후 GLM timeout — 부분 답을 만들지 않고 예약을 취소한다. 이후 m-2 호명에도 policy timeout 이라
    NEXA 는 발화하지 않는다(always-silent fallback). 전송은 0, 다른 채널로 우회하지 않는다.
  invariants:
    - { kind: cancel_on_fault, note: "timeout 시 예약 취소(우아한 실패)" }
    - { kind: silent_after_fault, note: "timeout 후 어떤 SPEAK 도 없음" }
    - { kind: max_speak_count, value: 0 }
    - { kind: no_stale_send }
