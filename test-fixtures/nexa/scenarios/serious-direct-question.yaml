    직접 호명된 사실 질문이고, 아무도 답하지 않은 채 충분한 시간이 지난다. 사람 멤버라면 답한다.
    여기서 침묵하면 missed-intervention(놓친 개입). 생성 경로(SPEAK)가 정확히 한 번 열린다.
  invariants:
    - { kind: min_speak_count, value: 1, note: "충분한 pause + 직접 질문 → 답해야 함" }
    - { kind: max_speak_count, value: 1, note: "정확히 한 번만 — 도배 아님" }
    - { kind: speak_target_message, messageId: m-1 }
    - { kind: no_stale_send }
  humanLabels:
    - { messageId: m-1, label: SPEAK, note: "사람이라면 이 질문에 답한다(over-conservative IGNORE 점검)" }
