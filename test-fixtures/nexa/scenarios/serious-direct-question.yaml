schemaVersion: nexa.scenario.v1
scenarioId: serious-direct-question
title: 진지한 직접 질문 — 무작위 침묵 정책은 불리, 생성 경로가 정확히 한 번 열림(NEXA-P16-T006)
intent: 명확한 기술 질문 + 충분한 pause 가 주어지면 NEXA 는 답한다. 항상 침묵만 하는 정책은 MIR(missed-intervention)에서 불리하다.
humanLikenessFocus: [over-conservative-ignore, empathy-warmth]
seed: 16006
time:
  baseInstant: "2026-01-04T15:30:00Z"
  zone: Asia/Seoul
  resolutionMs: 1000
guild:
  guildId: guild-nexa-fixture
  channelId: channel-general
  channelKind: MEMBER
actors:
  - actorId: actor-asker
    label: Q
    displayName: 민수
    kind: human
  - actorId: actor-nexa
    label: NEXA
    displayName: 니아
    kind: nexa
events:
  - { seq: 1, atOffsetMs: 0,    type: message_create, messageId: m-1, authorId: actor-asker, content: "@니아 파이썬에서 리스트 중복 제거 깔끔하게 어떻게 해?", mentionsNexa: true }
  - { seq: 2, atOffsetMs: 8000, type: typing_start, actorId: actor-nexa, durationMs: 1200 }
expected:
